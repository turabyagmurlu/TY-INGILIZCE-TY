<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4F7CAC" />
<meta name="color-scheme" content="light" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="TY İngilizce" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>TY İngilizce</title>
<style>
  :root{
    --bg:#F7F4EF; --primary:#44709e; --primary-dark:#3c5f87;
    --accent:#F2C14E; --accent-dark:#d9a52f; --text:#222222; --card:#ffffff;
    --good:#2e9e5b; --good-bg:#e7f6ec; --bad:#c0392b; --bad-bg:#fbe9e8;
    --muted:#626262; --line:#ece6dc; --shadow:0 6px 18px rgba(60,50,30,.10);
    --radius:18px; --fs:19px; --k:1; --focus:#1f4e80;
    color-scheme:light;
    --l1:#4F7CAC; --l2:#2e9e5b; --l3:#9b59b6; --l4:#d35400;
    --l1d:#3c5f87; --l2d:#237a46; --l3d:#7d3f9a; --l4d:#a04000;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
    background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden;}
  button,input,[data-act]{touch-action:manipulation;}
  button,input,textarea,select{font-family:inherit;color:var(--text);}
  input,textarea,select{background:#fff;}
  /* Klavye ile gezinmede her yerde görünür odak halkası */
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .btn:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.opt:focus-visible,.speak:focus-visible,.reveal-btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
  input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:0;border-color:var(--primary) !important;}
  /* Bayraklar: Windows bayrak emojisi göstermediği için satır içi SVG */
  .flag{display:inline-block;width:1.4em;height:.95em;border-radius:3px;overflow:hidden;vertical-align:-0.12em;box-shadow:0 0 0 1px rgba(0,0,0,.18);flex:0 0 auto;line-height:0;}
  .flag svg{display:block;width:100%;height:100%;}
  .wrap{max-width:720px;margin:0 auto;
    padding:14px max(16px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));}
  /* Başlık çentiğin altında kalmasın: yapışınca durum çubuğu alanını da kaplar */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-14px 0 14px;
    position:sticky;top:0;background:var(--bg);z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px;border-bottom:1px solid var(--line);}
  header.top h1{font-size:20px;margin:0;color:var(--primary-dark);min-width:0;line-height:1.2;display:flex;align-items:center;gap:8px;}
  header.top h1 .h1-logo{display:inline-flex;align-items:center;justify-content:center;background:var(--primary-dark);color:#fff;border-radius:9px;font-size:14px;font-weight:800;padding:4px 7px;letter-spacing:.5px;flex:0 0 auto;}
  header.top h1 .h1-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .top-actions{display:flex;gap:6px;flex:0 0 auto;}
  .icon-btn{background:#fff;border:2px solid var(--line);color:var(--primary-dark);border-radius:12px;
    padding:8px 12px;font-size:16px;cursor:pointer;font-weight:600;min-width:44px;min-height:44px;}
  .top-actions .icon-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 6px;min-width:52px;line-height:1.1;}
  .top-actions .icon-btn .ib-lbl{font-size:12px;font-weight:700;white-space:nowrap;}
  .top-actions .icon-btn .ib-ico{font-size:17px;line-height:1.2;height:20px;display:flex;align-items:center;}
  .icon-btn:hover{border-color:var(--primary);}
  .icon-btn[aria-current="page"]{border-color:var(--primary);background:#eef2f6;}
  .hidden{display:none !important;}

  .card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
  h2{font-size:calc(25px*var(--k));margin:0 0 12px;color:var(--primary-dark);}
  h3{font-size:calc(20px*var(--k));margin:0 0 8px;}
  p{margin:0 0 12px;}
  .muted{color:var(--muted);font-size:.88em;}
  .center{text-align:center;}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;
    padding:16px 20px;font-size:calc(20px*var(--k));font-weight:700;cursor:pointer;width:100%;margin-top:8px;transition:transform .06s ease, filter .15s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#3a2e00;}
  .btn-accent:hover{background:var(--accent-dark);}
  .btn-soft{background:#eef2f6;color:var(--primary-dark);}
  .btn-soft:hover{background:#e2e9f0;}
  .btn-ghost{background:transparent;border:2px solid var(--line);color:var(--primary-dark);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  .lang-choices{display:grid;gap:12px;margin:14px 0 4px;}
  .lang-choice{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text);font-size:calc(20px*var(--k));font-weight:800;min-height:64px;}
  .lang-choice:hover{border-color:var(--primary);background:#f7fafd;}
  .lang-choice.current{border-color:var(--primary);background:#eef4fa;}
  .lang-choice .flag{font-size:calc(30px*var(--k));border-radius:5px;}
  .lang-choice .lc-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;}
  .lang-choice .lc-sub{font-size:calc(15px*var(--k));font-weight:600;color:var(--muted);}
  .lang-choice .lc-go{color:var(--primary-dark);font-size:calc(15px*var(--k));font-weight:700;white-space:nowrap;}
  .btn-row .btn{flex:1;min-width:130px;}

  .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{flex:1;min-width:84px;background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow);}
  .stat .num{font-size:calc(28px*var(--k));font-weight:800;color:var(--primary);}
  .stat .lbl{font-size:calc(13px*var(--k));color:var(--muted);}
  .streak-badge{background:var(--accent);color:#3a2e00;border-radius:12px;padding:10px 16px;display:inline-block;font-weight:800;font-size:calc(18px*var(--k));}

  .week{display:flex;gap:6px;justify-content:space-between;margin-top:6px;}
  .day{flex:1;text-align:center;}
  .day .dot{width:38px;height:38px;border-radius:50%;margin:4px auto 2px;display:flex;align-items:center;justify-content:center;background:#eef2f6;color:var(--muted);font-size:calc(18px*var(--k));font-weight:700;}
  .day .dot.on{background:var(--good);color:#fff;}
  .day .dot.today{outline:3px solid var(--accent);}
  .day .lbl{font-size:calc(12px*var(--k));color:var(--muted);}

  /* level card */
  .level-card{border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);background:#fff;border-top:6px solid var(--primary);}
  .level-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .level-head .lv-title{font-size:calc(21px*var(--k));font-weight:800;color:var(--primary-dark);}
  .cefr{font-size:calc(13px*var(--k));font-weight:800;color:#fff;background:var(--primary);border-radius:999px;padding:3px 10px;}
  .lv-prog{font-size:calc(14px*var(--k));color:var(--muted);margin-left:auto;}
  .locked-note{background:#fff7e6;border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:calc(15px*var(--k));color:#7a5a00;}

  .unit-list{list-style:none;padding:0;margin:10px 0 0;}
  .unit-item{display:flex;align-items:center;gap:12px;background:#fbf9f5;border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer;border:2px solid transparent;}
  .unit-item:hover{border-color:var(--primary);}
  .unit-ico{font-size:calc(24px*var(--k));flex:0 0 auto;width:38px;text-align:center;}
  .unit-meta{flex:1;min-width:0;overflow-wrap:break-word;}
  .unit-meta .t{font-weight:700;font-size:calc(17px*var(--k));}
  .type-tag{font-size:calc(12px*var(--k));font-weight:700;border-radius:999px;padding:2px 8px;margin-right:6px;}
  .type-tag.g{background:#efe6f7;color:#6f3fa0;}
  .type-tag.v{background:#e6eef7;color:#34618c;}
  .badge-score{font-size:calc(12px*var(--k));background:var(--good-bg);color:#1d7a42;border-radius:999px;padding:2px 8px;font-weight:700;}
  .check{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:flex;align-items:center;justify-content:center;background:#eef2f6;color:var(--muted);font-size:calc(16px*var(--k));font-weight:700;}
  .check.done{background:var(--good);color:#fff;}

  /* grammar */
  .gtable{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:calc(17px*var(--k));}
  .gtable th,.gtable td{border:1px solid var(--line);padding:9px 10px;text-align:left;}
  .gtable th{background:#eef2f6;color:var(--primary-dark);}
  .rule-box{background:#f3f7fb;border-left:5px solid var(--primary);border-radius:10px;padding:12px 14px;margin:8px 0 12px;font-size:calc(17px*var(--k));}
  .ex-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .ex-row:last-child{border-bottom:none;}
  .ex-main{flex:1;min-width:0;overflow-wrap:break-word;}
  .ex-en{font-weight:700;font-size:calc(18px*var(--k));}
  .ex-tr{color:var(--primary-dark);font-size:calc(15px*var(--k));}

  /* word rows */
  .word-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .word-row:last-child{border-bottom:none;}
  .word-main{flex:1;min-width:0;overflow-wrap:break-word;}
  .word-en{font-size:calc(21px*var(--k));font-weight:700;}
  .word-tr{font-size:calc(17px*var(--k));color:var(--primary-dark);}
  .word-ex{font-size:calc(15px*var(--k));color:var(--muted);margin-top:2px;}
  .speak{flex:0 0 auto;width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);font-size:calc(24px*var(--k));cursor:pointer;}
  .speak:active{transform:scale(.94);}
  .speak.sm{width:46px;height:46px;font-size:calc(20px*var(--k));}

  /* flashcard */
  .flash{perspective:1200px;margin:10px 0 4px;}
  .flash-inner{position:relative;display:grid;width:100%;min-height:220px;cursor:pointer;transition:transform .55s;transform-style:preserve-3d;}
  .flash.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-face{grid-area:1/1;position:relative;min-height:220px;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow-wrap:break-word;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius);padding:20px;text-align:center;}
  .flash-front{background:var(--primary);color:#fff;}
  .flash-back{background:var(--accent);color:#3a2e00;transform:rotateY(180deg);}
  .flash-face .big{font-size:calc(34px*var(--k));font-weight:800;}
  .flash-face .sub{font-size:calc(17px*var(--k));margin-top:12px;opacity:.96;}
  .flash-hint{text-align:center;color:var(--muted);font-size:calc(15px*var(--k));margin:8px 0 12px;}
  .counter{text-align:center;color:var(--muted);font-size:calc(16px*var(--k));margin-bottom:8px;}

  /* quiz */
  .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:2px solid #dfe5ec;border-radius:14px;padding:15px 16px;font-size:calc(19px*var(--k));margin-bottom:11px;cursor:pointer;}
  .opt:hover{border-color:var(--primary);}
  .opt.correct{background:var(--good-bg);border-color:var(--good);}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);}
  .opt{color:var(--text);}
  .opt:disabled{cursor:default;color:var(--text);opacity:1;}
  .opt:disabled:not(.correct):not(.wrong){opacity:.7;}
  .feedback{border-radius:14px;padding:14px;margin-top:6px;font-size:calc(17px*var(--k));}
  .feedback.good{background:var(--good-bg);color:#1d7a42;}
  .feedback.bad{background:var(--bad-bg);color:#a8312d;}
  .progressbar{background:#e7e1d7;border-radius:999px;height:14px;overflow:hidden;margin:10px 0;}
  .progressbar > span{display:block;height:100%;background:var(--accent);width:0;transition:width .35s;}

  .empty{color:var(--muted);text-align:center;padding:22px 0;}
  .review-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);}

  .badges{display:flex;flex-wrap:wrap;gap:10px;}
  .badge{flex:1 1 140px;background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow);opacity:.45;filter:grayscale(1);}
  .badge.on{opacity:1;filter:none;border:2px solid var(--accent);}
  .badge .b-ico{font-size:calc(34px*var(--k));}
  .badge .b-name{font-weight:700;font-size:calc(15px*var(--k));margin-top:4px;}
  .badge .b-desc{font-size:calc(13px*var(--k));color:var(--muted);}

  .seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px;}
  .seg button{flex:1;min-width:90px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:calc(16px*var(--k));cursor:pointer;font-weight:600;}
  .seg button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  label.set-lbl{font-weight:700;display:block;margin-top:8px;}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:14px 20px;border-radius:14px;box-shadow:var(--shadow);font-size:calc(17px*var(--k));opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:92%;text-align:center;}
  .toast.show{opacity:1;}
  .mic-state{border-radius:14px;padding:14px;margin-top:8px;font-size:calc(17px*var(--k));background:#eef2f6;color:var(--primary-dark);}
  .mic-state.listening{background:#fff4d6;color:#7a5a00;}
  .mic-state.good{background:var(--good-bg);color:#1d7a42;}
  .mic-state.near{background:#fff4d6;color:#6b4f00;}
  .mic-state.bad{background:var(--bad-bg);color:#a8312d;}
  .mic-state.warn{background:#fff1e0;color:#7a3e00;}
  .mic-state .mr-title{font-weight:800;margin-bottom:4px;}
  .mic-state .mr-heard,.mic-state .mr-target{margin-top:4px;overflow-wrap:anywhere;}
  .mic-state .mr-help{margin:6px 0 0;padding-left:20px;font-size:.92em;}
  .mic-state .mr-help li{margin:4px 0;}
  .mic-state mark.miss{background:#ffd9a8;color:#7a2e00;border-radius:4px;padding:0 3px;text-decoration:underline wavy #c0392b;}
  .mic-state .btn{margin-top:10px;}
  .mic-live{margin-top:6px;font-weight:700;font-size:1.05em;min-height:1.3em;overflow-wrap:anywhere;}
  .btn.listening{background:#c0392b;color:#fff;}
  .pr-ok{color:var(--good);font-size:.8em;}
  .pr-okn{color:#1d7a42;font-weight:700;}
  .pr-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
  .pr-chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:calc(15px*var(--k));cursor:pointer;color:var(--primary-dark);max-width:100%;overflow-wrap:anywhere;}
  .pr-chip.ok{background:var(--good-bg);border-color:var(--good);color:#1d7a42;font-weight:700;}
  .pr-chip.cur{outline:3px solid var(--primary);outline-offset:1px;}
  .ex-row.has-mic{flex-wrap:wrap;}
  .ex-row.has-mic .mic-state{flex:1 0 100%;margin-top:4px;}
  .speak.mic-sm{background:#e3ecf6;}
  .speak.mic-sm.ok{background:var(--good-bg);color:#1d7a42;font-weight:800;}
  .speak.mic-sm.listening{background:#c0392b;color:#fff;}
  .pulse{animation:pulse 1s infinite;}
  @keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
  .confetti{position:fixed;top:-12px;width:10px;height:16px;z-index:70;border-radius:2px;pointer-events:none;}
  .tip{background:#fff8e6;border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:12px 0 4px;font-size:calc(16px*var(--k));color:#6b5300;}
  .tip b{color:#7a5a00;}
  .goal{background:#eef5ff;border-left:5px solid var(--primary);border-radius:10px;padding:10px 14px;margin:6px 0;font-size:calc(16px*var(--k));}
  .stepper{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  button.step{border:2px solid transparent;cursor:pointer;min-height:44px;font-family:inherit;line-height:1.3;}
  button.step:hover{border-color:var(--primary);}
  button.step:focus-visible{border-color:var(--primary);outline:3px solid var(--primary);outline-offset:2px;}
  .stepper-hint{font-size:calc(13px*var(--k));color:var(--muted);margin-top:6px;text-align:center;}
  .dict-item{flex-direction:column;align-items:stretch;gap:8px;}
  .dict-actions{display:flex;gap:6px;}
  .dict-actions button{flex:1 1 0;min-width:0;line-height:1.2;min-height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--primary-dark);font-weight:700;font-size:calc(14px*var(--k));cursor:pointer;font-family:inherit;padding:6px 2px;}
  .dict-actions button.on{background:var(--good-bg);border-color:var(--good);color:#1d7a42;}
  .dict-actions button:focus-visible,.unit-item:focus-visible{outline:3px solid var(--primary);outline-offset:2px;}
  .daily{background:#fff8e6;border:2px solid var(--accent);border-radius:14px;padding:12px 14px;margin-top:10px;}
  .daily b{color:#7a5a00;}
  .step{flex:1;min-width:64px;background:#eef2f6;border-radius:12px;padding:8px 4px;text-align:center;font-size:calc(13px*var(--k));color:var(--primary-dark);font-weight:700;}
  .step .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;align-items:center;justify-content:center;font-size:calc(13px*var(--k));margin-bottom:3px;}
  /* adım takibi */
  .step.ok{background:var(--good-bg);color:#1d7a42;}
  .step.ok .n{background:var(--good);}
  .step.cur{background:var(--primary);color:#fff;border-color:var(--primary-dark);box-shadow:0 2px 8px rgba(79,124,172,.35);}
  .step.cur .n{background:#fff;color:var(--primary-dark);}
  .step.cur.ok .n{color:var(--good);}
  .step-pos{font-size:calc(14px*var(--k));color:var(--muted);margin-top:10px;}
  .step-pos b{color:var(--primary-dark);}
  .step-note{background:var(--good-bg);color:#1d7a42;border-radius:12px;padding:10px 12px;font-weight:700;font-size:calc(16px*var(--k));margin-bottom:4px;}
  .unit-bar{padding:12px 14px;}
  .unit-bar .ub-title{font-weight:800;color:var(--primary-dark);font-size:calc(17px*var(--k));overflow-wrap:break-word;}
  .unit-bar .step-pos{margin-top:2px;}
  .unit-bar .stepper{margin-top:6px;}
  .st{display:inline-block;font-size:calc(12px*var(--k));font-weight:700;border-radius:999px;padding:2px 8px;margin:2px 6px 0 0;}
  .st-ok{background:var(--good-bg);color:#1d7a42;}
  .st-bad{background:var(--bad-bg);color:#a8312d;}
  .st-go{background:#e6eef7;color:#34618c;}
  .st-new{background:#f1eee8;color:var(--muted);}
  .st-next{background:var(--accent);color:#3a2e00;}
  .st-line{font-size:calc(16px*var(--k));color:var(--primary-dark);margin:4px 0 8px;}
  .u-tags{display:flex;flex-wrap:wrap;align-items:center;}
  .u-tags .type-tag{margin-top:2px;}
  .unit-item.is-next{border-color:var(--accent);background:#fffaf0;}
  .check.part{background:#e6eef7;color:#34618c;font-size:calc(11px*var(--k));border:2px solid var(--primary);}
  .check.retry{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad);}
  .lv-bar{background:#e7e1d7;border-radius:999px;height:10px;overflow:hidden;margin:10px 0 2px;}
  .lv-bar > span{display:block;height:100%;border-radius:999px;min-width:0;}

    {uid:"1-12", type:"grammar", icon:"📖", title:"Gramer: my / your / his / her (iyelik)",
      intro:"Bir şeyin kime ait olduğunu söylerken ismin önüne küçük bir kelime koyarız. Türkçedeki \"-im, -in, -i\" eklerine benzer.",
      rule:"<b>I → my</b> (benim), <b>you → your</b> (senin), <b>he → his</b> (onun, erkek), <b>she → her</b> (onun, kadın), <b>it → its</b> (onun, eşya/hayvan), <b>we → our</b> (bizim), <b>they → their</b> (onların). Örnek: \"<b>my</b> house\" = \"ev<b>im</b>\".",
      structure:[["Özne","İyelik","Örnek"],["I","my","my name (adım)"],["you","your","your bag (çantan)"],["he","his","his car (onun arabası)"],["she","her","her son (onun oğlu)"],["we","our","our house (evimiz)"],["they","their","their children (çocukları)"]],
      examples:[{en:"My name is Ayşe.",tr:"Benim adım Ayşe."},{en:"Is this your phone?",tr:"Bu senin telefonun mu?"},{en:"His wife is a nurse.",tr:"Onun eşi hemşire."},{en:"Her daughter lives in London.",tr:"Onun kızı Londra'da yaşıyor."},{en:"Our house is small.",tr:"Evimiz küçük."}],
      exercises:[
        {q:"I have a cat. ___ cat is white.", options:["My","Your","Her"], answer:"My", explain:"I → my (benim)."},
        {q:"Ali has a car. ___ car is red.", options:["His","Her","Their"], answer:"His", explain:"Ali erkek → his (onun)."},
        {q:"Ayşe is here. ___ son is a doctor.", options:["Her","His","Our"], answer:"Her", explain:"Ayşe kadın → her (onun)."},
        {q:"We have a garden. ___ garden is big.", options:["Our","Their","My"], answer:"Our", explain:"we → our (bizim)."},
        {q:"They live here. ___ house is old.", options:["Their","Our","His"], answer:"Their", explain:"they → their (onların)."},
        {q:"What is ___ name? (senin)", options:["your","you","my"], answer:"your", explain:"Senin = your. 'you' öznedir, 'your' iyeliktir."},
        {q:"My husband and I love ___ children.", options:["our","their","his"], answer:"our", explain:"My husband and I = we → our."}
      ]},

{
  id:2, cefr:"A1+", name:"Seviye 2 — Temel", desc:"Cümle kurmaya başla: geniş zaman, can, have ve edatlar.",
  units:[
    {uid:"2-1", type:"grammar", icon:"📖", title:"Gramer: Geniş Zaman (Present Simple)",
      intro:"Her zaman yaptığımız, alışkanlık olan işleri anlatır. \"Her gün çay içerim\" gibi.",
      rule:"I/You/We/They + <b>fiilin yalın hali</b>: I drink. He/She/It + <b>fiil + s</b>: He drink<b>s</b>. (-o, -s, -sh, -ch, -x ile bitenlere <b>-es</b>: go → goes, watch → watches. Sessiz harf + y → <b>-ies</b>: study → studies. have → has.)",
      structure:[["Özne","Fiil","Örnek"],["I / You / We / They","work","I work every day"],["He / She / It","works","She works here"],["He / She / It","goes","He goes to school"]],
      examples:[{en:"I drink tea.",tr:"Çay içerim."},{en:"She drinks coffee.",tr:"O kahve içer."},{en:"We play every day.",tr:"Her gün oynarız."},{en:"He goes to work.",tr:"O işe gider."}],
      exercises:[
        {q:"She ___ tea. (drink)", options:["drinks","drink","drinking"], answer:"drinks", explain:"She ile fiile -s: drinks."},
        {q:"I ___ every day. (work)", options:["work","works","working"], answer:"work", explain:"I ile fiil yalın: work."},
        {q:"He ___ to school. (go)", options:["goes","gos","go"], answer:"goes", explain:"-o ile bitince -es: go → goes."},
        {q:"They ___ football. (play)", options:["play","plays","playing"], answer:"play", explain:"They ile fiil yalın: play."},
        {q:"My father ___ TV every evening. (watch)", options:["watches","watchs","watch"], answer:"watches", explain:"-ch ile bitince -es: watch → watches."},
        {q:"She ___ English. (study)", options:["studies","studys","study"], answer:"studies", explain:"Sessiz harf + y → -ies: study → studies."},
        {q:"We ___ in Ankara. (live)", options:["live","lives","living"], answer:"live", explain:"We ile fiil yalın: live."}
      ]},
    {uid:"2-2", type:"vocab", icon:"🍎", title:"Yiyecek & Fiiller", desc:"Yiyecekler ve günlük fiiller.", words:[
      {en:"Eat", tr:"Yemek (yemek yemek)", ex:"I eat bread.", exTr:"Ekmek yerim."},
      {en:"Drink", tr:"İçmek", ex:"I drink water.", exTr:"Su içerim."},
      {en:"Apple", tr:"Elma", ex:"I eat an apple.", exTr:"Bir elma yerim."},
      {en:"Milk", tr:"Süt", ex:"The milk is cold.", exTr:"Süt soğuk."},
      {en:"Bread", tr:"Ekmek", ex:"I want bread.", exTr:"Ekmek istiyorum."},
      {en:"Like", tr:"Sevmek/hoşlanmak", ex:"I like tea.", exTr:"Çayı severim."},
      {en:"Tea", tr:"Çay", ex:"I drink tea every morning.", exTr:"Her sabah çay içerim."},
      {en:"Coffee", tr:"Kahve", ex:"A coffee, please.", exTr:"Bir kahve, lütfen."},
      {en:"Cook", tr:"Yemek pişirmek", ex:"I cook dinner every day.", exTr:"Her gün akşam yemeği pişiririm."},
      {en:"Cheese", tr:"Peynir", ex:"I like white cheese.", exTr:"Beyaz peyniri severim."},
      {en:"Egg", tr:"Yumurta", ex:"I eat an egg for breakfast.", exTr:"Kahvaltıda bir yumurta yerim."}
    ]},
    {uid:"2-3", type:"grammar", icon:"📖", title:"Gramer: Olumsuz & Soru (don't / doesn't)",
      intro:"Geniş zamanda \"yapmıyorum\" demek ve soru sormak için yardımcı kelime kullanırız.",
      rule:"Olumsuz: I/you/we/they + <b>don't</b> + fiil. he/she/it + <b>doesn't</b> + fiil. Soru: <b>Do</b> you...? <b>Does</b> she...? (Bu durumda fiil hep yalındır.)",
      structure:[["Özne","Olumsuz","Soru"],["I/You/We/They","don't like","Do you like?"],["He/She/It","doesn't like","Does he like?"]],
      examples:[{en:"I don't like coffee.",tr:"Kahveyi sevmem."},{en:"She doesn't eat meat.",tr:"O et yemez."},{en:"Do you speak English?",tr:"İngilizce konuşur musun?"},{en:"Does he work here?",tr:"O burada mı çalışıyor?"}],
      exercises:[
        {q:"She ___ like tea.", options:["doesn't","don't","not"], answer:"doesn't", explain:"He/She/It ile doesn't."},
        {q:"I ___ eat fish.", options:["don't","doesn't","not"], answer:"don't", explain:"I ile don't."},
        {q:"___ you speak English?", options:["Do","Does","Are"], answer:"Do", explain:"you ile soru: Do you...?"},
        {q:"___ he work here?", options:["Does","Do","Is"], answer:"Does", explain:"he ile soru: Does he...?"},
        {q:"My brother ___ drink coffee.", options:["doesn't","don't","isn't"], answer:"doesn't", explain:"'My brother' = he → doesn't."},
        {q:"___ they live here?", options:["Do","Does","Are"], answer:"Do", explain:"they ile soru: Do they...?"},
        {q:"Does she ___ tea?", options:["like","likes","liking"], answer:"like", explain:"Does'tan sonra fiil yalın: like (likes değil)."}
      ]},
    {uid:"2-4", type:"grammar", icon:"📖", title:"Gramer: have / has (sahip olmak)",
      intro:"Bir şeye sahip olduğumuzu anlatır. \"Bir arabam var\" gibi.",
      rule:"I/You/We/They + <b>have</b>: I have a car. He/She/It + <b>has</b>: She has a cat.",
      structure:[["Özne","Fiil","Örnek"],["I / You / We / They","have","I have a car"],["He / She / It","has","She has a cat"]],
      examples:[{en:"I have a car.",tr:"Bir arabam var."},{en:"She has two cats.",tr:"İki kedisi var."},{en:"We have a big house.",tr:"Büyük bir evimiz var."},{en:"He has a phone.",tr:"Onun telefonu var."}],
      exercises:[
        {q:"I ___ a car.", options:["have","has","haves"], answer:"have", explain:"I ile have."},
        {q:"She ___ two cats.", options:["has","have","haves"], answer:"has", explain:"She ile has."},
        {q:"We ___ a big house.", options:["have","has","having"], answer:"have", explain:"We ile have."},
        {q:"He ___ a phone.", options:["has","have","haves"], answer:"has", explain:"He ile has."},
        {q:"My parents ___ a garden.", options:["have","has","haves"], answer:"have", explain:"'My parents' = they → have."},
        {q:"The house ___ three rooms.", options:["has","have","haves"], answer:"has", explain:"'The house' = it → has."},
        {q:"You ___ a beautiful smile.", options:["have","has","having"], answer:"have", explain:"You ile have."}
      ]},

      {en:"Bathroom", tr:"Banyo", ex:"Where is the bathroom?", exTr:"Banyo nerede?"},
      {en:"Bedroom", tr:"Yatak odası", ex:"The bedroom is upstairs.", exTr:"Yatak odası üst katta."},

    {uid:"2-6", type:"grammar", icon:"📖", title:"Gramer: can / can't (yapabilmek)",
      intro:"Bir şeyi yapabildiğimizi veya yapamadığımızı anlatır.",
      rule:"Özne + <b>can</b> + fiil (yalın): I can swim. Olumsuz: <b>can't</b>: She can't drive. Soru: <b>Can</b> you...? (Tüm öznelerde aynı, -s eklenmez.)",
      structure:[["Olumlu","Olumsuz","Soru"],["I can swim","I can't swim","Can you swim?"],["She can cook","She can't cook","Can she cook?"]],
      examples:[{en:"I can swim.",tr:"Yüzebilirim."},{en:"She can't drive.",tr:"O araba süremez."},{en:"Can you help me?",tr:"Bana yardım edebilir misin?"},{en:"He can speak English.",tr:"O İngilizce konuşabilir."}],
      exercises:[
        {q:"I ___ swim.", options:["can","cans","am"], answer:"can", explain:"Özne + can + fiil."},
        {q:"She ___ drive a car. (yapamıyor)", options:["can't","can","doesn't can"], answer:"can't", explain:"Olumsuz: can't."},
        {q:"___ you help me?", options:["Can","Do","Are"], answer:"Can", explain:"Soru: Can you...?"},
        {q:"He can ___ English.", options:["speak","speaks","speaking"], answer:"speak", explain:"can'den sonra fiil yalın: speak."},
        {q:"My mother ___ cook very well.", options:["can","cans","is"], answer:"can", explain:"can tüm öznelerde aynıdır, -s almaz."},
        {q:"I ___ hear you. Please speak louder. (duyamıyorum)", options:["can't","can","don't can"], answer:"can't", explain:"Olumsuz: can't + fiil."},
        {q:"Can she ___ a car?", options:["drive","drives","driving"], answer:"drive", explain:"can'den sonra fiil yalın: drive."}
      ]},
    {uid:"2-7", type:"grammar", icon:"📖", title:"Gramer: Edatlar (in / on / under / at)",
      intro:"Bir şeyin nerede olduğunu anlatan küçük kelimeler.",
      rule:"<b>in</b> = içinde, <b>on</b> = üstünde, <b>under</b> = altında, <b>at</b> = belirli bir yerde/saatte (at home, at 5 o'clock).",
      structure:[["Edat","Anlam","Örnek"],["in","içinde","in the box"],["on","üstünde","on the table"],["under","altında","under the chair"],["at","-de/-da (nokta)","at home"]],
      examples:[{en:"The cat is in the box.",tr:"Kedi kutunun içinde."},{en:"The book is on the table.",tr:"Kitap masanın üstünde."},{en:"The ball is under the chair.",tr:"Top sandalyenin altında."},{en:"I am at home.",tr:"Evdeyim."}],
      exercises:[
        {q:"The book is ___ the table. (üstünde)", options:["on","in","under"], answer:"on", explain:"üstünde = on."},
        {q:"The cat is ___ the box. (içinde)", options:["in","on","at"], answer:"in", explain:"içinde = in."},
        {q:"The ball is ___ the chair. (altında)", options:["under","on","in"], answer:"under", explain:"altında = under."},
        {q:"I am ___ home.", options:["at","in","on"], answer:"at", explain:"at home kalıptır."},
        {q:"The keys are ___ my bag. (içinde)", options:["in","on","under"], answer:"in", explain:"içinde = in."},
        {q:"The shoes are ___ the bed. (altında)", options:["under","on","at"], answer:"under", explain:"altında = under."},
        {q:"The lesson starts ___ 9 o'clock.", options:["at","in","on"], answer:"at", explain:"Saatlerle at kullanılır: at 9 o'clock."}
      ]},

    {uid:"2-14", type:"grammar", icon:"📖", title:"Gramer: There is / There are (var / yok)",
      intro:"Bir yerde bir şeyin \"var\" olduğunu söylemek için kullanılır. \"Masada bir kitap var\" gibi.",
      rule:"Tekil için <b>There is</b> (kısaca There's): There is a book. Çoğul için <b>There are</b>: There are two cats. Olumsuz: <b>There isn't / There aren't</b>. Soru: <b>Is there...? / Are there...?</b>",
      structure:[["","Tekil","Çoğul"],["Olumlu","There is a bank","There are two banks"],["Olumsuz","There isn't a bank","There aren't any banks"],["Soru","Is there a bank?","Are there any banks?"]],
      examples:[{en:"There is a cat in the garden.",tr:"Bahçede bir kedi var."},{en:"There are three rooms in the house.",tr:"Evde üç oda var."},{en:"There isn't a hospital in our village.",tr:"Köyümüzde hastane yok."},{en:"Is there a pharmacy near here?",tr:"Buralarda eczane var mı?"}],
      exercises:[
        {q:"There ___ a book on the table.", options:["is","are","be"], answer:"is", explain:"Tekil (a book) → There is."},
        {q:"There ___ two cats in the garden.", options:["are","is","am"], answer:"are", explain:"Çoğul (two cats) → There are."},
        {q:"___ there a bank near here?", options:["Is","Are","Do"], answer:"Is", explain:"Tekil soru: Is there...?"},
        {q:"___ there any chairs in the room?", options:["Are","Is","Do"], answer:"Are", explain:"Çoğul soru: Are there...?"},
        {q:"There ___ a hospital in our village. (yok)", options:["isn't","aren't","not"], answer:"isn't", explain:"Tekil + olumsuz → There isn't."},
        {q:"There ___ any eggs in the fridge. (yok)", options:["aren't","isn't","not"], answer:"aren't", explain:"Çoğul + olumsuz → There aren't."},
        {q:"There ___ many people at the bus stop.", options:["are","is","be"], answer:"are", explain:"people çoğuldur → There are."}
      ]},
    {uid:"2-15", type:"grammar", icon:"📖", title:"Gramer: Soru Kelimeleri (What, Where, When...)",
      intro:"Bilgi istemek için soru kelimeleri kullanırız. Soru kelimesi cümlenin en başına gelir.",
      rule:"<b>What</b> = ne, <b>Where</b> = nerede/nereye, <b>When</b> = ne zaman, <b>Who</b> = kim, <b>Why</b> = neden, <b>How</b> = nasıl, <b>How much</b> = ne kadar (fiyat). Örnek: \"<b>Where</b> is the bank?\" = \"Banka <b>nerede</b>?\"",
      structure:[["Soru kelimesi","Anlam","Örnek"],["What","ne","What is this?"],["Where","nerede","Where is the station?"],["When","ne zaman","When is the bus?"],["Who","kim","Who is he?"],["Why","neden","Why are you sad?"],["How","nasıl","How are you?"],["How much","ne kadar","How much is it?"]],
      examples:[{en:"Where do you live?",tr:"Nerede yaşıyorsun?"},{en:"When is your birthday?",tr:"Doğum günün ne zaman?"},{en:"Who is that man?",tr:"Şu adam kim?"},{en:"Why are you tired?",tr:"Neden yorgunsun?"},{en:"How much is this bag?",tr:"Bu çanta ne kadar?"}],
      exercises:[
        {q:"___ is the bus stop? — It's over there.", options:["Where","When","Who"], answer:"Where", explain:"Yer soruyoruz → Where (nerede)."},
        {q:"___ is your birthday? — In May.", options:["When","Where","What"], answer:"When", explain:"Zaman soruyoruz → When (ne zaman)."},
        {q:"___ is that woman? — She is my aunt.", options:["Who","What","Where"], answer:"Who", explain:"Kişi soruyoruz → Who (kim)."},
        {q:"___ are you sad? — Because I am tired.", options:["Why","How","When"], answer:"Why", explain:"Sebep soruyoruz → Why (neden). Cevap 'Because' (çünkü) ile başlar."},
        {q:"___ is this? — It's a phone.", options:["What","Who","Where"], answer:"What", explain:"Bir şeyi soruyoruz → What (ne)."},
        {q:"___ are you? — I am fine, thanks.", options:["How","What","Who"], answer:"How", explain:"Hâl hatır soruyoruz → How (nasıl)."},
        {q:"How ___ is this coffee? — Three pounds.", options:["much","many","old"], answer:"much", explain:"Fiyat sorarken: How much (ne kadar)."}
      ]}
  ]
},
{
  id:3, cefr:"A2", name:"Seviye 3 — Temel Üstü", desc:"Zamanları öğren: şimdiki, geçmiş, gelecek ve karşılaştırma.",
  units:[
    {uid:"3-1", type:"grammar", icon:"📖", title:"Gramer: Şimdiki Zaman (Present Continuous)",
      intro:"Tam şu anda yapılan işi anlatır. \"Şu an okuyorum\" gibi.",
      rule:"<b>am/is/are</b> + fiil + <b>-ing</b>. I am reading. She is cooking. They are playing.",
      structure:[["Özne","Yapı","Örnek"],["I","am + ...ing","I am reading"],["He/She/It","is + ...ing","She is cooking"],["You/We/They","are + ...ing","They are playing"]],
      examples:[{en:"I am reading a book.",tr:"Kitap okuyorum."},{en:"She is cooking now.",tr:"O şu an yemek yapıyor."},{en:"They are playing.",tr:"Onlar oynuyorlar."},{en:"We are working now.",tr:"Şu an çalışıyoruz."}],
      exercises:[
        {q:"I ___ reading.", options:["am","is","are"], answer:"am", explain:"I ile am + ...ing."},
        {q:"She ___ cooking.", options:["is","am","are"], answer:"is", explain:"She ile is + ...ing."},
        {q:"They ___ playing.", options:["are","is","am"], answer:"are", explain:"They ile are + ...ing."},
        {q:"He is ___ now. (work)", options:["working","work","works"], answer:"working", explain:"fiil + -ing: working."},
        {q:"We ___ watching TV now.", options:["are","is","am"], answer:"are", explain:"We ile are + ...ing."},
        {q:"Look! It ___ raining.", options:["is","are","am"], answer:"is", explain:"It ile is + ...ing."},
        {q:"She is ___ a letter. (write)", options:["writing","writeing","writes"], answer:"writing", explain:"-e ile biten fiilde e düşer: write → writing."}
      ]},
    {uid:"3-2", type:"grammar", icon:"📖", title:"Gramer: Geçmiş Zaman (was / were)",
      intro:"\"Olmak\" fiilinin geçmiş hali. \"Dün evdeydim\" gibi.",
      rule:"I/He/She/It + <b>was</b>. You/We/They + <b>were</b>. I was happy. They were here.",
      structure:[["Özne","Fiil","Örnek"],["I / He / She / It","was","I was at home"],["You / We / They","were","They were tired"]],
      examples:[{en:"I was at home.",tr:"Evdeydim."},{en:"She was a teacher.",tr:"O öğretmendi."},{en:"They were tired.",tr:"Onlar yorgundu."},{en:"We were happy.",tr:"Biz mutluyduk."}],
      exercises:[
        {q:"I ___ at home yesterday.", options:["was","were","am"], answer:"was", explain:"I ile was."},
        {q:"They ___ tired.", options:["were","was","are"], answer:"were", explain:"They ile were."},
        {q:"She ___ a teacher.", options:["was","were","is"], answer:"was", explain:"She ile was."},
        {q:"We ___ happy.", options:["were","was","are"], answer:"were", explain:"We ile were."},
        {q:"You ___ late yesterday.", options:["were","was","are"], answer:"were", explain:"You ile were."},
        {q:"The weather ___ very nice last week.", options:["was","were","is"], answer:"was", explain:"'The weather' = it → was."},
        {q:"My parents ___ in Izmir last summer.", options:["were","was","are"], answer:"were", explain:"'My parents' = they → were."}
      ]},
    {uid:"3-3", type:"grammar", icon:"📖", title:"Gramer: Geçmiş Zaman (-ed)",
      intro:"Düzenli fiillerin geçmiş hali. Sona -ed eklenir.",
      rule:"Düzenli fiil + <b>-ed</b>: play → play<b>ed</b>, work → work<b>ed</b>, like → lik<b>ed</b> (-e ile bitene sadece -d). \"I played football\" = \"Futbol oynadım.\"",
      structure:[["Şimdi","Geçmiş"],["play","played"],["work","worked"],["watch","watched"],["like","liked"]],
      examples:[{en:"I played football.",tr:"Futbol oynadım."},{en:"She worked hard.",tr:"O çok çalıştı."},{en:"We watched a film.",tr:"Bir film izledik."},{en:"They liked the food.",tr:"Yemeği beğendiler."}],
      exercises:[
        {q:"I ___ football yesterday. (play)", options:["played","play","plaied"], answer:"played", explain:"play → played."},
        {q:"She ___ hard. (work)", options:["worked","work","worken"], answer:"worked", explain:"work → worked."},
        {q:"We ___ a film. (watch)", options:["watched","watch","watcheded"], answer:"watched", explain:"watch → watched."},
        {q:"They ___ the food. (like)", options:["liked","likeed","like"], answer:"liked", explain:"like → liked."},
        {q:"I ___ my mother yesterday. (call)", options:["called","call","calld"], answer:"called", explain:"call → called."},
        {q:"We ___ the house last week. (clean)", options:["cleaned","clean","cleant"], answer:"cleaned", explain:"clean → cleaned."},
        {q:"She ___ in London for a year. (live)", options:["lived","liveed","live"], answer:"lived", explain:"-e ile biten fiile sadece -d: live → lived."}
      ]},
    {uid:"3-4", type:"grammar", icon:"📖", title:"Gramer: Düzensiz Fiiller",
      intro:"Bazı fiiller geçmişte -ed almaz; tamamen değişir. Bunları ezberlemek gerekir.",
      rule:"go → <b>went</b>, have → <b>had</b>, see → <b>saw</b>, eat → <b>ate</b>, come → <b>came</b>, do → <b>did</b>.",
      structure:[["Şimdi","Geçmiş","Anlam"],["go","went","gitmek"],["eat","ate","yemek"],["see","saw","görmek"],["have","had","sahip olmak"],["come","came","gelmek"]],
      examples:[{en:"I went to school.",tr:"Okula gittim."},{en:"She ate an apple.",tr:"O bir elma yedi."},{en:"We saw a film.",tr:"Bir film izledik."},{en:"He had a car.",tr:"Onun arabası vardı."}],
      exercises:[
        {q:"I ___ to school. (go)", options:["went","goed","go"], answer:"went", explain:"go → went."},
        {q:"She ___ an apple. (eat)", options:["ate","eated","eat"], answer:"ate", explain:"eat → ate."},
        {q:"We ___ a film. (see)", options:["saw","seed","see"], answer:"saw", explain:"see → saw."},
        {q:"He ___ a car. (have)", options:["had","haved","has"], answer:"had", explain:"have → had."},
        {q:"They ___ home late last night. (come)", options:["came","comed","come"], answer:"came", explain:"come → came."},
        {q:"I ___ my homework yesterday. (do)", options:["did","doed","do"], answer:"did", explain:"do → did."},
        {q:"We ___ to the sea last summer. (go)", options:["went","goed","go"], answer:"went", explain:"go → went."}
      ]},
    {uid:"3-5", type:"grammar", icon:"📖", title:"Gramer: Gelecek Zaman (will / going to)",
      intro:"İleride olacak işleri anlatır. İki yol vardır.",
      rule:"<b>will</b> + fiil = anlık karar, söz veya tahmin: I will help you. <b>be going to</b> + fiil = plan: I am going to travel.",
      structure:[["Yapı","Kullanım","Örnek"],["will + fiil","karar/söz/tahmin","It will rain"],["be going to + fiil","plan","I am going to study"]],
      examples:[{en:"I will help you.",tr:"Sana yardım edeceğim."},{en:"It will rain.",tr:"Yağmur yağacak."},{en:"I am going to travel.",tr:"Seyahat edeceğim (planlı)."},{en:"She is going to cook.",tr:"O yemek yapacak (planlı)."}],
      exercises:[
        {q:"I ___ help you. (söz veriyorum)", options:["will","going","am"], answer:"will", explain:"Anlık karar/söz: will."},
        {q:"It ___ rain. (tahmin)", options:["will","going","is"], answer:"will", explain:"Tahmin: will."},
        {q:"I am ___ to travel. (plan)", options:["going","will","go"], answer:"going", explain:"Plan: be going to."},
        {q:"She is going to ___. (cook)", options:["cook","cooks","cooking"], answer:"cook", explain:"going to'dan sonra fiil yalın."},
        {q:"We are going to ___ my aunt tomorrow. (visit)", options:["visit","visits","visiting"], answer:"visit", explain:"going to'dan sonra fiil yalın."},
        {q:"The phone is ringing. — I ___ answer it! (anlık karar)", options:["will","am going","going"], answer:"will", explain:"Anlık karar: will."},
        {q:"They ___ going to buy a new car. (plan)", options:["are","will","is"], answer:"are", explain:"They ile be going to: are going to."}
      ]},
    {uid:"3-6", type:"grammar", icon:"📖", title:"Gramer: Karşılaştırma (bigger, better)",
      intro:"İki şeyi karşılaştırırken kullanılır. \"daha büyük\" gibi.",
      rule:"Kısa sıfat + <b>-er</b> + <b>than</b>: big → big<b>ger</b> than. Uzun sıfatlarda <b>more</b>: more beautiful. İstisnalar: good → <b>better</b>, bad → <b>worse</b>.",
      structure:[["Sıfat","Karşılaştırma"],["big","bigger"],["small","smaller"],["old","older"],["good","better"],["bad","worse"]],
      examples:[{en:"An elephant is bigger than a cat.",tr:"Fil kediden daha büyük."},{en:"This is better than that.",tr:"Bu şundan daha iyi."},{en:"A mouse is smaller than a dog.",tr:"Fare köpekten daha küçük."}],
      exercises:[
        {q:"An elephant is ___ than a cat. (big)", options:["bigger","biger","more big"], answer:"bigger", explain:"big → bigger (g iki kez)."},
        {q:"This is ___ than that. (good)", options:["better","gooder","more good"], answer:"better", explain:"good → better (istisna)."},
        {q:"A mouse is ___ than a dog. (small)", options:["smaller","smallier","more small"], answer:"smaller", explain:"small → smaller."},
        {q:"Today is ___ than yesterday. (bad)", options:["worse","badder","more bad"], answer:"worse", explain:"bad → worse (istisna)."},
        {q:"A car is ___ than a bicycle. (fast)", options:["faster","more fast","fastest"], answer:"faster", explain:"Kısa sıfat + -er: fast → faster."},
        {q:"This dress is ___ than that one. (beautiful)", options:["more beautiful","beautifuler","most beautiful"], answer:"more beautiful", explain:"Uzun sıfatlarda more: more beautiful."},
        {q:"My brother is older ___ me.", options:["than","that","then"], answer:"than", explain:"Karşılaştırmada 'than' (-den/-dan) kullanılır."}
      ]},

    {uid:"3-10", type:"grammar", icon:"📖", title:"Gramer: Geçmiş Zaman Olumsuz & Soru (didn't / Did...?)",
      intro:"Geçmişte \"yapmadım\" demek ve soru sormak için did kullanırız. Geniş zamandaki do/does gibidir.",
      rule:"Olumsuz: özne + <b>didn't</b> + fiil (yalın): I <b>didn't</b> go. Soru: <b>Did</b> + özne + fiil (yalın)?: <b>Did</b> you eat? Dikkat: did varken fiil geçmiş hale girmez. \"I didn't went\" yanlış, \"I didn't <b>go</b>\" doğru.",
      structure:[["Olumlu","Olumsuz","Soru"],["I went","I didn't go","Did you go?"],["She ate","She didn't eat","Did she eat?"],["They played","They didn't play","Did they play?"]],
      examples:[{en:"I didn't sleep well.",tr:"İyi uyumadım."},{en:"She didn't come to work.",tr:"O işe gelmedi."},{en:"Did you see my glasses?",tr:"Gözlüğümü gördün mü?"},{en:"Did they call you?",tr:"Seni aradılar mı?"}],
      exercises:[
        {q:"I ___ go to work yesterday.", options:["didn't","don't","wasn't"], answer:"didn't", explain:"Geçmişte olumsuz: didn't + fiil."},
        {q:"___ you eat breakfast this morning?", options:["Did","Do","Were"], answer:"Did", explain:"Geçmişte soru: Did you...?"},
        {q:"She didn't ___ the film. (like)", options:["like","liked","likes"], answer:"like", explain:"didn't'ten sonra fiil yalın: like."},
        {q:"Did he ___ you yesterday? (call)", options:["call","called","calls"], answer:"call", explain:"Did ile fiil yalın kalır: call."},
        {q:"We ___ see him at the party last night.", options:["didn't","doesn't","weren't"], answer:"didn't", explain:"Geçmiş olumsuz: didn't see."},
        {q:"Did you go to the market? — Yes, I ___.", options:["did","went","do"], answer:"did", explain:"Kısa cevap: Yes, I did. / No, I didn't."},
        {q:"They didn't ___ home early. (come)", options:["come","came","comes"], answer:"come", explain:"didn't'ten sonra düzensiz fiil de yalın: come (came değil)."}
      ]},

    {uid:"3-13", type:"grammar", icon:"📖", title:"Gramer: Nesne Zamirleri (me, him, her...)",
      intro:"Cümlede işi yapan değil, işten etkilenen kişiyi anlatırken zamir değişir. \"Beni, onu, bizi\" gibi.",
      rule:"<b>I → me</b> (beni/bana), <b>you → you</b> (seni/sana), <b>he → him</b> (onu, erkek), <b>she → her</b> (onu, kadın), <b>it → it</b>, <b>we → us</b> (bizi/bize), <b>they → them</b> (onları). Fiilden veya edattan sonra gelir: Call <b>me</b>. Look at <b>them</b>.",
      structure:[["Özne","Nesne","Örnek"],["I","me","Help me (bana yardım et)"],["he","him","I know him (onu tanıyorum)"],["she","her","Call her (onu ara)"],["we","us","Wait for us (bizi bekle)"],["they","them","I love them (onları seviyorum)"]],
      examples:[{en:"Please call me tomorrow.",tr:"Lütfen yarın beni ara."},{en:"I see him every day.",tr:"Onu her gün görüyorum."},{en:"My daughter visits us on Sundays.",tr:"Kızım pazar günleri bizi ziyaret eder."},{en:"These flowers are for you.",tr:"Bu çiçekler senin için."}],
      exercises:[
        {q:"This is my son. I love ___ very much.", options:["him","he","his"], answer:"him", explain:"Fiilden sonra nesne: he → him."},
        {q:"Where is Ayşe? I can't see ___.", options:["her","she","hers"], answer:"her", explain:"she → her (onu)."},
        {q:"Can you help ___? (bize)", options:["us","we","our"], answer:"us", explain:"we → us (bizi/bize)."},
        {q:"My grandchildren are here. I play with ___.", options:["them","they","their"], answer:"them", explain:"Edattan sonra nesne: they → them."},
        {q:"Please call ___ tomorrow. (beni)", options:["me","I","my"], answer:"me", explain:"I → me (beni/bana)."},
        {q:"Ali is my neighbour. I talk to ___ every day.", options:["him","her","them"], answer:"him", explain:"Ali erkek → him."},
        {q:"This cake is for ___. (senin için)", options:["you","your","yours"], answer:"you", explain:"you hem özne hem nesne olarak aynıdır: for you."}
      ]},

{
  id:4, cefr:"B1", name:"Seviye 4 — Orta", desc:"Deneyimlerini, planlarını ve fikirlerini anlat: present perfect, koşul cümleleri, tavsiye ve zorunluluk.",
  units:[
    {uid:"4-1", type:"grammar", icon:"📖", title:"Gramer: Present Perfect (have/has + V3)",
      intro:"Geçmişte olmuş ama etkisi şimdi de süren olayları ya da hayat tecrübelerini anlatır. \"Hiç Londra'ya gittin mi?\" gibi.",
      rule:"<b>have/has</b> + fiilin 3. hali (V3). Düzenli fiillerde V3 = -ed: work → work<b>ed</b>. Düzensizler ezberlenir: go → <b>gone</b>, see → <b>seen</b>, eat → <b>eaten</b>, be → <b>been</b>. <b>ever</b> = hiç (soruda), <b>never</b> = hiç (olumsuz anlam), <b>already</b> = çoktan, <b>yet</b> = henüz.",
      structure:[["Özne","Yapı","Örnek"],["I/You/We/They","have + V3","I have finished"],["He/She/It","has + V3","She has gone"],["Soru","Have/Has ... + V3?","Have you ever been to Rome?"],["Olumsuz","haven't/hasn't + V3","He hasn't called yet"]],
      examples:[{en:"I have lost my keys.",tr:"Anahtarlarımı kaybettim (hâlâ yoklar)."},{en:"She has never seen snow.",tr:"O hiç kar görmedi."},{en:"Have you ever been to London?",tr:"Hiç Londra'da bulundun mu?"},{en:"We have already eaten.",tr:"Biz çoktan yedik."},{en:"He hasn't called yet.",tr:"O henüz aramadı."}],
      exercises:[
        {q:"I ___ finished my work.", options:["have","has","am"], answer:"have", explain:"I ile have + V3."},
        {q:"She ___ gone to the market.", options:["has","have","is"], answer:"has", explain:"She ile has + V3."},
        {q:"Have you ever ___ to Paris? (be)", options:["been","was","be"], answer:"been", explain:"be fiilinin 3. hali: been."},
        {q:"We have ___ this film before. (see)", options:["seen","saw","see"], answer:"seen", explain:"see → saw → seen. Present perfect'te 3. hal: seen."},
        {q:"He hasn't called ___.", options:["yet","already","ever"], answer:"yet", explain:"Olumsuz cümlenin sonunda 'yet' (henüz)."},
        {q:"I have ___ eaten sushi. (hiç)", options:["never","yet","ever"], answer:"never", explain:"Olumlu cümlede 'hiç' anlamı için never: I have never eaten..."},
        {q:"They have ___ left. The house is empty. (çoktan)", options:["already","yet","never"], answer:"already", explain:"çoktan = already."}
      ]},
    {uid:"4-2", type:"vocab", icon:"💼", title:"İş & Ofis", desc:"İş hayatında sık geçen kelimeler.", words:[
      {en:"Office", tr:"Ofis", ex:"I work in an office.", exTr:"Bir ofiste çalışıyorum."},
      {en:"Meeting", tr:"Toplantı", ex:"The meeting is at ten.", exTr:"Toplantı saat onda."},
      {en:"Boss", tr:"Patron", ex:"My boss is very busy.", exTr:"Patronum çok meşgul."},
      {en:"Colleague", tr:"İş arkadaşı", ex:"My colleagues are friendly.", exTr:"İş arkadaşlarım cana yakın."},
      {en:"Salary", tr:"Maaş", ex:"The salary is paid every month.", exTr:"Maaş her ay ödenir."},
      {en:"Customer", tr:"Müşteri", ex:"The customer is waiting.", exTr:"Müşteri bekliyor."},
      {en:"Contract", tr:"Sözleşme", ex:"Please sign the contract.", exTr:"Lütfen sözleşmeyi imzalayın."},
      {en:"Invoice", tr:"Fatura", ex:"We sent the invoice yesterday.", exTr:"Faturayı dün gönderdik."},
      {en:"Deadline", tr:"Son teslim tarihi", ex:"The deadline is Friday.", exTr:"Son teslim tarihi cuma."},
      {en:"Job interview", tr:"İş görüşmesi", ex:"I have a job interview tomorrow.", exTr:"Yarın iş görüşmem var."},
      {en:"Experience", tr:"Deneyim", ex:"She has a lot of experience.", exTr:"Onun çok deneyimi var."},
      {en:"Overtime", tr:"Fazla mesai", ex:"We worked overtime last week.", exTr:"Geçen hafta fazla mesai yaptık."}
    ]},
    {uid:"4-3", type:"grammar", icon:"📖", title:"Gramer: Geçmişte Süren Zaman (was/were + -ing)",
      intro:"Geçmişte belli bir anda devam eden işi anlatır. \"Dün akşam saat 8'de yemek yapıyordum\" gibi.",
      rule:"<b>was/were</b> + fiil + <b>-ing</b>. I/he/she/it + <b>was</b>, you/we/they + <b>were</b>. Süren bir iş kısa bir olayla kesilince: <b>when</b> + basit geçmiş zaman: I was cooking <b>when</b> the phone rang. İki iş aynı anda sürüyorsa: <b>while</b>.",
      structure:[["Özne","Yapı","Örnek"],["I/He/She/It","was + ...ing","I was sleeping"],["You/We/They","were + ...ing","They were talking"],["Olumsuz","wasn't/weren't + ...ing","She wasn't working"],["Soru","Was/Were ... + ...ing?","Were you sleeping?"]],
      examples:[{en:"I was cooking at 8 o'clock.",tr:"Saat 8'de yemek yapıyordum."},{en:"They were watching TV.",tr:"Onlar televizyon izliyorlardı."},{en:"I was sleeping when the phone rang.",tr:"Telefon çaldığında uyuyordum."},{en:"She was reading while he was cooking.",tr:"Adam yemek yaparken kadın kitap okuyordu."}],
      exercises:[
        {q:"I ___ sleeping at midnight last night.", options:["was","were","am"], answer:"was", explain:"I ile was + ...ing."},
        {q:"They ___ playing in the garden at 5 pm yesterday.", options:["were","was","are"], answer:"were", explain:"They ile were + ...ing (geçmiş zaman: yesterday)."},
        {q:"She was ___ a book. (read)", options:["reading","read","reads"], answer:"reading", explain:"was + fiil + -ing: reading."},
        {q:"I was cooking when the phone ___.", options:["rang","was ringing","rings"], answer:"rang", explain:"Araya giren kısa olay basit geçmiş zamanla anlatılır: rang."},
        {q:"We ___ watching TV when you called.", options:["were","was","are"], answer:"were", explain:"We ile were + ...ing."},
        {q:"___ you sleeping when I called?", options:["Were","Was","Did"], answer:"Were", explain:"you ile soru: Were you ...ing?"},
        {q:"He ___ working yesterday. He was at home. (değildi)", options:["wasn't","weren't","didn't"], answer:"wasn't", explain:"He ile olumsuz: wasn't + ...ing."}
      ]},
    {uid:"4-4", type:"vocab", icon:"🏘️", title:"Mahalle & Hizmetler", desc:"Mahalledeki yerler ve hizmetler.", words:[
      {en:"Post office", tr:"Postane", ex:"I need to go to the post office.", exTr:"Postaneye gitmem gerekiyor."},

      {en:"Petrol station", tr:"Benzin istasyonu", ex:"Is there a petrol station near here?", exTr:"Buralarda benzin istasyonu var mı?"},
      {en:"Dry cleaner's", tr:"Kuru temizleme", ex:"I took my coat to the dry cleaner's.", exTr:"Montumu kuru temizlemeye götürdüm."}

    {uid:"4-5", type:"grammar", icon:"📖", title:"Gramer: If (Birinci Koşul Cümlesi)",
      intro:"Gerçekleşmesi mümkün bir koşulu ve sonucunu anlatır. \"Yağmur yağarsa evde kalırız\" gibi.",
      rule:"<b>If</b> + geniş zaman, <b>will</b> + fiil: If it rain<b>s</b>, we <b>will</b> stay at home. Dikkat: if'li kısımda will kullanılmaz; \"If it will rain\" yanlıştır. Kısımların yeri değişebilir: We will stay at home if it rains.",
      structure:[["If kısmı (koşul)","Sonuç kısmı"],["If it rains,","we will stay at home."],["If you study,","you will pass."],["If she is tired,","she won't come."]],
      examples:[{en:"If it rains, I will take an umbrella.",tr:"Yağmur yağarsa şemsiye alırım."},{en:"If you are hungry, I will cook.",tr:"Açsan yemek yaparım."},{en:"If we hurry, we won't miss the bus.",tr:"Acele edersek otobüsü kaçırmayız."},{en:"I will call you if I am late.",tr:"Geç kalırsam seni ararım."}],
      exercises:[
        {q:"If it ___, we will stay at home. (rain)", options:["rains","will rain","rained"], answer:"rains", explain:"If kısmında geniş zaman: rains."},
        {q:"If you study, you ___ pass the exam.", options:["will","are","did"], answer:"will", explain:"Sonuç kısmında will + fiil."},
        {q:"If I ___ tired, I will go to bed early.", options:["am","will be","was"], answer:"am", explain:"If kısmında will kullanılmaz: If I am tired."},
        {q:"She will ___ you if she has time. (help)", options:["help","helps","helped"], answer:"help", explain:"will'den sonra fiil yalın: help."},
        {q:"If we don't hurry, we ___ miss the bus.", options:["will","do","are"], answer:"will", explain:"Sonuç kısmı: will miss."},
        {q:"If he ___ the bus, he will be late. (miss)", options:["misses","will miss","miss"], answer:"misses", explain:"If kısmında geniş zaman; he ile -es: misses."},
        {q:"If it is cold, I ___ go out. (çıkmayacağım)", options:["won't","don't will","am not"], answer:"won't", explain:"will not = won't. Sonuç kısmında olumsuz: won't + fiil."}
      ]},
    {uid:"4-6", type:"vocab", icon:"📰", title:"Haberler & Fikirler", desc:"Haberleri konuşmak ve fikrini söylemek.", words:[
      {en:"News", tr:"Haberler", ex:"I watch the news every evening.", exTr:"Her akşam haberleri izlerim."},

      {en:"Maybe", tr:"Belki", ex:"Maybe you are right.", exTr:"Belki haklısın."}
    ]},
    {uid:"4-7", type:"grammar", icon:"📖", title:"Gramer: should / must / have to",

{ id:2, cefr:"A1+", name:"Seviye 2 — Temel", desc:"Cümle kurmaya başla: fiiller, çoğullar, edatlar ve günlük yaşam.", units:[
  {uid:"it2-1", type:"grammar", icon:"📖", title:"Gramer: Çoğullar",

    structure:[["Olumlu","Olumsuz"],["Parlo italiano","Non parlo italiano"],["Ho tempo","Non ho tempo"]],
    examples:[{en:"Non parlo inglese.",tr:"İngilizce konuşmam."},{en:"Non ho tempo.",tr:"Zamanım yok."},{en:"Non capisco.",tr:"Anlamıyorum."}],

  {uid:"it2-15", type:"grammar", icon:"📖", title:"Gramer: Şimdiki zaman (-ere / -ire fiilleri)",
    intro:"-ere ve -ire ile biten fiiller de düzenli çekilir. Örnek: prendere (almak), dormire (uyumak).",
    rule:"-ere: <b>-o, -i, -e, -iamo, -ete, -ono</b> (prendo, prendi, prende...). -ire: <b>-o, -i, -e, -iamo, -ite, -ono</b> (dormo, dormi, dorme...). Bazı -ire fiilleri araya <b>-isc-</b> alır: capire → io <b>capisco</b>.",
    structure:[["Özne","prendere","dormire"],["io","prendo","dormo"],["tu","prendi","dormi"],["lui/lei","prende","dorme"],["noi","prendiamo","dormiamo"],["voi","prendete","dormite"],["loro","prendono","dormono"]],
    examples:[{en:"Prendo un caffè.",tr:"Bir kahve alıyorum."},{en:"Lei dorme molto.",tr:"O çok uyur."},{en:"Leggi il giornale?",tr:"Gazete okur musun?"},{en:"Non capisco.",tr:"Anlamıyorum."}],
    exercises:[
      {q:"Io ___ un caffè. (prendere)", options:["prendo","prendi","prende"], answer:"prendo", explain:"io → -o: prendo."},

      {q:"Tu ___ il giornale? (leggere)", options:["leggi","leggo","legge"], answer:"leggi", explain:"tu → -i: leggi."},

      {q:"Loro ___ a Roma. (vivere)", options:["vivono","viviamo","vive"], answer:"vivono", explain:"loro → -ono: vivono."},
      {q:"Voi ___ bene? (dormire)", options:["dormite","dormiamo","dormono"], answer:"dormite", explain:"voi + -ire → -ite: dormite."},
      {q:"Anlamıyorum: Non ___. (capire)", options:["capisco","capo","capiscono"], answer:"capisco", explain:"capire -isc- alır: io capisco."}
    ]}
]},
{ id:3, cefr:"A2", name:"Seviye 3 — Temel Üstü", desc:"Zamanlar: geçmiş, gelecek, modal fiiller ve karşılaştırma.", units:[
  {uid:"it3-1", type:"grammar", icon:"📖", title:"Gramer: Geçmiş zaman — avere ile (passato prossimo)",
    intro:"Geçmişte biten işler için passato prossimo. Çoğu fiil 'avere' + geçmiş ortaç ile kurulur.",
    rule:"avere (ho/hai/ha/abbiamo/avete/hanno) + geçmiş ortaç. Ortaç: <b>-are→-ato</b>, <b>-ere→-uto</b>, <b>-ire→-ito</b>. \"Ho mangiato\" = \"yedim\".",
    structure:[["Mastar","Ortaç"],["parlare","parlato"],["mangiare","mangiato"],["credere","creduto"],["dormire","dormito"]],
    examples:[{en:"Ho mangiato la pizza.",tr:"Pizza yedim."},{en:"Hai parlato con Deniz?",tr:"Deniz'le konuştun mu?"},{en:"Abbiamo dormito bene.",tr:"İyi uyuduk."}],
    exercises:[
      {q:"Yedim: Ho ___ (mangiare).", options:["mangiato","mangiare","mangio"], answer:"mangiato", explain:"-are → -ato: mangiato."},
      {q:"Konuştun mu? Hai ___? (parlare)", options:["parlato","parlare","parli"], answer:"parlato", explain:"-are → -ato: parlato."},
      {q:"Uyuduk: Abbiamo ___ (dormire).", options:["dormito","dormire","dormo"], answer:"dormito", explain:"-ire → -ito: dormito."},
      {q:"-are fiilinin geçmiş ortacı hangi ekle biter?", options:["-ato","-uto","-ito"], answer:"-ato", explain:"-are → -ato."},
      {q:"Ekmek aldım: Ho ___ il pane. (comprare)", options:["comprato","compruto","comprito"], answer:"comprato", explain:"-are → -ato: comprato."},
      {q:"Anladın mı? Hai ___? (capire)", options:["capito","caputo","capato"], answer:"capito", explain:"-ire → -ito: capito."},
      {q:"Onlar çok çalıştı: ___ lavorato molto.", options:["Hanno","Sono","Avete"], answer:"Hanno", explain:"loro + avere: hanno lavorato."}
    ]},
  {uid:"it3-2", type:"grammar", icon:"📖", title:"Gramer: Geçmiş zaman — essere ile",
    intro:"Bazı fiiller (gitmek, gelmek gibi hareket) 'essere' ile kurulur ve özneye göre uyum sağlar.",
    rule:"essere (sono/sei/è/siamo/siete/sono) + ortaç. Erkek: <b>-o</b>, kadın: <b>-a</b>. \"Sono andato\" (erkek), \"Sono andata\" (kadın) = \"gittim\".",
    structure:[["Özne","Örnek"],["io (kadın)","Sono andata"],["io (erkek)","Sono andato"],["lei","È andata"],["noi","Siamo andati"]],
    examples:[{en:"Sono andata a casa.",tr:"Eve gittim (kadın)."},{en:"Lei è arrivata.",tr:"O geldi (kadın)."},{en:"Siamo andati al bar.",tr:"Bara gittik."}],
    exercises:[
      {q:"Eve gittim (kadın): Sono ___ a casa. (andare)", options:["andata","andato","andare"], answer:"andata", explain:"Kadın için -a: andata."},
      {q:"Hareket fiilleri passato prossimo'da hangi yardımcıyı alır?", options:["essere","avere","fare"], answer:"essere", explain:"Hareket/durum: essere."},
      {q:"O geldi (kadın): Lei ___ arrivata.", options:["è","ha","hai"], answer:"è", explain:"essere: è."},
      {q:"Bara gittik: ___ andati al bar.", options:["Siamo","Abbiamo","Avete"], answer:"Siamo", explain:"noi + essere: siamo."},
      {q:"O (erkek) geldi: Lui è ___.", options:["arrivato","arrivata","arrivati"], answer:"arrivato", explain:"Erkek tekil: -o → arrivato."},
      {q:"Evdeydim (kadın): Sono ___ a casa. (stare)", options:["stata","stato","state"], answer:"stata", explain:"stare → stato/stata. Kadın: stata."},
      {q:"Kızlar İtalya'ya gitti: Le ragazze sono ___ in Italia.", options:["andate","andati","andata"], answer:"andate", explain:"Dişil çoğul: -e → andate."}
    ]},
  {uid:"it3-3", type:"grammar", icon:"📖", title:"Gramer: Gelecek zaman (futuro)",
    intro:"Gelecekte olacak işler için futuro semplice.",
    rule:"parlare → io <b>parlerò</b>, tu <b>parlerai</b>, lui/lei <b>parlerà</b>, noi <b>parleremo</b>, voi <b>parlerete</b>, loro <b>parleranno</b>.",

    exercises:[

    rule:"Eril tekil <b>-o</b>, dişil tekil <b>-a</b>, eril çoğul <b>-i</b>, dişil çoğul <b>-e</b>: bello, bella, belli, belle.",

  {uid:"it3-6", type:"grammar", icon:"📖", title:"Gramer: Karşılaştırma (più ... di)",
    intro:"İki şeyi karşılaştırırken 'più ... di' (daha ... -den) kullanılır.",
    rule:"<b>più</b> + sıfat + <b>di</b>: \"Roma è più grande di Pisa\" = \"Roma Pisa'dan daha büyük\". Daha az için <b>meno</b>. (di + il = <b>del</b>: più forte del tè.)",
    structure:[["Yapı","Örnek"],["più ... di","più grande di"],["meno ... di","meno caro di"]],
    examples:[{en:"Roma è più grande di Pisa.",tr:"Roma Pisa'dan daha büyük."},{en:"Il caffè è più forte del tè.",tr:"Kahve çaydan daha sert."}],
    exercises:[
      {q:"daha büyük: ___ grande", options:["più","meno","molto"], answer:"più", explain:"daha = più."},
      {q:"Roma Pisa'dan daha büyük: Roma è più grande ___ Pisa.", options:["di","da","a"], answer:"di", explain:"karşılaştırmada -den = di."},
      {q:"daha az pahalı: ___ caro", options:["meno","più","tanto"], answer:"meno", explain:"daha az = meno."},
      {q:"Kahve çaydan daha sert: Il caffè è più forte ___ tè.", options:["del","di","dal"], answer:"del", explain:"di + il = del: del tè."},
      {q:"Tren otobüsten daha hızlı: Il treno è ___ veloce dell'autobus.", options:["più","meno","tanto"], answer:"più", explain:"daha = più."},
      {q:"Pisa Roma'dan daha küçük (daha az büyük): Pisa è ___ grande di Roma.", options:["meno","più","molto"], answer:"meno", explain:"daha az = meno."}
    ]},

  {uid:"it3-10", type:"grammar", icon:"📖", title:"Gramer: Dönüşlü fiiller (mi alzo, mi chiamo)",

  {uid:"it3-13", type:"grammar", icon:"📖", title:"Gramer: Birleşik edatlar (al, nel, del...)",

    rule:"a + il = <b>al</b>, a + la = <b>alla</b>, di + il = <b>del</b>, in + il = <b>nel</b>, in + la = <b>nella</b>, da + il = <b>dal</b>, su + il = <b>sul</b>. Sesli harften önce: <b>all', dell', nell', dall', sull'</b>. <b>da</b> birinin yanına gitmek için de kullanılır: vado dal medico.",
    structure:[["Edat","+ il","+ la","+ l'"],["a","al","alla","all'"],["di","del","della","dell'"],["in","nel","nella","nell'"],["da","dal","dalla","dall'"],["su","sul","sulla","sull'"]],
    examples:[{en:"Vado al bar.",tr:"Bara gidiyorum."},{en:"Sono all'aeroporto.",tr:"Havalimanındayım."},{en:"Il latte è nel frigorifero.",tr:"Süt buzdolabında."},{en:"Vado dal medico.",tr:"Doktora gidiyorum."}],
    exercises:[

      {q:"Kızın evi: La casa ___ ragazza.", options:["della","del","dalla"], answer:"della", explain:"-in (sahiplik): di + la = della."},
      {q:"İstasyona gidiyorum: Vado ___ stazione.", options:["alla","al","nella"], answer:"alla", explain:"a + la = alla (stazione dişil)."}

  {uid:"it4-2", type:"grammar", icon:"📖", title:"Gramer: Geçmişte süreklilik (imperfetto)",
    intro:"Imperfetto, geçmişteki alışkanlıkları, tasvirleri ve devam eden durumları anlatır. Türkçedeki '-ardı / -iyordu' gibidir.",
    rule:"Mastarın sonundaki -re atılır, <b>-vo, -vi, -va, -vamo, -vate, -vano</b> eklenir: parlare → <b>parlavo</b>, avere → <b>avevo</b>, dormire → <b>dormivo</b>. Düzensiz: essere → <b>ero, eri, era, eravamo, eravate, erano</b>; fare → <b>facevo</b>.",
    structure:[["Özne","parlare","essere"],["io","parlavo","ero"],["tu","parlavi","eri"],["lui/lei","parlava","era"],["noi","parlavamo","eravamo"],["voi","parlavate","eravate"],["loro","parlavano","erano"]],
    examples:[{en:"Da bambina giocavo in giardino.",tr:"Çocukken bahçede oynardım."},{en:"Era una bella giornata.",tr:"Güzel bir gündü."},{en:"Mia madre faceva il pane.",tr:"Annem ekmek yapardı."},{en:"Avevamo un cane.",tr:"Bir köpeğimiz vardı."}],
    exercises:[
      {q:"Çocukken çok oynardım: Da bambina ___ molto. (giocare)", options:["giocavo","giocava","giocavamo"], answer:"giocavo", explain:"io → -vo: giocavo."},
      {q:"Annem hep ekmek yapardı: Mia madre ___ sempre il pane. (fare)", options:["faceva","facevo","facevano"], answer:"faceva", explain:"fare düzensiz: facevo, facevi, faceva..."},
      {q:"Güzel bir gündü: ___ una bella giornata. (essere)", options:["Era","Ero","Eri"], answer:"Era", explain:"Tasvir, 3. tekil: era."},
      {q:"Sen hep yorgundun: Tu ___ sempre stanca. (essere)", options:["eri","era","ero"], answer:"eri", explain:"tu → eri."},
      {q:"Onların bir köpeği vardı: Loro ___ un cane. (avere)", options:["avevano","avevamo","aveva"], answer:"avevano", explain:"loro → -vano: avevano."},
      {q:"Her akşam televizyon izlerdim: ___ la TV ogni sera. (guardare)", options:["Guardavo","Guardava","Guardato"], answer:"Guardavo", explain:"Alışkanlık, io → guardavo."},
      {q:"Gençken İstanbul'da otururduk: Da giovani ___ a Istanbul. (abitare)", options:["abitavamo","abitavano","abitavate"], answer:"abitavamo", explain:"noi → -vamo: abitavamo."},
      {q:"Imperfetto hangi durumda kullanılır?", options:["Geçmişteki alışkanlıklar","Gelecek planları","Emir vermek"], answer:"Geçmişteki alışkanlıklar", explain:"Imperfetto: geçmişteki alışkanlık, tasvir ve süreklilik."}
    ]},

  {uid:"it4-4", type:"grammar", icon:"📖", title:"Gramer: Imperfetto mi, passato prossimo mu?",
    intro:"İki geçmiş zaman birlikte kullanılır: biri 'sahneyi', diğeri 'olayı' anlatır.",
    rule:"<b>Passato prossimo</b>: bir kez olup biten olay (ieri, l'anno scorso, all'improvviso). <b>Imperfetto</b>: arka plan, tasvir, alışkanlık (sempre, ogni giorno, da bambina, mentre). \"<b>Mentre cucinavo</b>, <b>è arrivato</b> mio figlio\" = Ben yemek yaparken oğlum geldi.",
    structure:[["Zaman","Ne için?","Örnek"],["Passato prossimo","Bitmiş, tek olay","Ieri ho comprato una borsa."],["Imperfetto","Alışkanlık","Da bambina andavo al mare."],["Imperfetto","Arka plan / tasvir","Pioveva ed era tardi."],["İkisi birlikte","Sahne + olay","Mentre leggevo, ha squillato il telefono."]],
    examples:[{en:"Mentre cucinavo, è arrivato mio figlio.",tr:"Ben yemek yaparken oğlum geldi."},{en:"Da bambina andavo al mare ogni estate.",tr:"Çocukken her yaz denize giderdim."},{en:"L'anno scorso sono andata a Roma.",tr:"Geçen yıl Roma'ya gittim."}],
    exercises:[
      {q:"Dün akşam pizza yedim ve sonra yattım: Ieri sera ___ una pizza e poi sono andata a letto.", options:["ho mangiato","mangiavo","mangerò"], answer:"ho mangiato", explain:"Bitmiş, sıralı olaylar: passato prossimo."},
      {q:"Çocukken her yaz denize giderdim: Da bambina ___ al mare ogni estate.", options:["andavo","sono andata","andrò"], answer:"andavo", explain:"Alışkanlık (ogni estate): imperfetto."},
      {q:"Ben yemek yaparken telefon çaldı: Mentre ___, ha squillato il telefono.", options:["cucinavo","ho cucinato","cucinerò"], answer:"cucinavo", explain:"mentre + arka plandaki eylem: imperfetto."},
      {q:"Kitap okuyordum, birden telefon çaldı: Leggevo un libro quando all'improvviso ___ il telefono.", options:["ha squillato","squillava","squillerà"], answer:"ha squillato", explain:"Birden olan tek olay: passato prossimo."},
      {q:"Küçükken saçlarım uzundu: Quando ero piccola, ___ i capelli lunghi.", options:["avevo","ho avuto","avrò"], answer:"avevo", explain:"Geçmişteki tasvir: imperfetto."},
      {q:"Geçen yıl bir haftalığına Roma'ya gittim (kadın): L'anno scorso ___ a Roma per una settimana.", options:["sono andata","andavo","vado"], answer:"sono andata", explain:"Sınırlı süre, bitmiş olay: passato prossimo."},
      {q:"Bir kez olup biten olay için hangisi?", options:["Passato prossimo","Imperfetto","Futuro"], answer:"Passato prossimo", explain:"Tek, bitmiş olay: passato prossimo."},
      {q:"Hava, saat, yaş gibi arka plan tasviri için hangisi?", options:["Imperfetto","Passato prossimo","Futuro"], answer:"Imperfetto", explain:"Tasvir ve arka plan: imperfetto."}
    ]},

  {uid:"it4-6", type:"grammar", icon:"📖", title:"Gramer: Gelecek zaman — düzensiz fiiller",
    intro:"Futuro'da en sık kullanılan fiillerin bir kısmı düzensizdir. Ekler aynıdır (-ò, -ai, -à, -emo, -ete, -anno), sadece kök değişir.",
    rule:"essere → <b>sarò</b>, avere → <b>avrò</b>, andare → <b>andrò</b>, fare → <b>farò</b>, venire → <b>verrò</b>, vedere → <b>vedrò</b>, potere → <b>potrò</b>. \"Domani <b>sarò</b> a casa\" = Yarın evde olacağım.",
    structure:[["Mastar","io","noi"],["essere","sarò","saremo"],["avere","avrò","avremo"],["andare","andrò","andremo"],["fare","farò","faremo"],["venire","verrò","verremo"],["vedere","vedrò","vedremo"]],
    examples:[{en:"Domani sarò a casa.",tr:"Yarın evde olacağım."},{en:"Quest'estate andremo in Italia.",tr:"Bu yaz İtalya'ya gideceğiz."},{en:"Verrò da te sabato.",tr:"Cumartesi sana geleceğim."},{en:"Ci vedremo presto!",tr:"Yakında görüşeceğiz!"}],
    exercises:[
      {q:"Yarın evde olacağım: Domani ___ a casa. (essere)", options:["sarò","sono","sarà"], answer:"sarò", explain:"essere → sarò (io)."},
      {q:"Gelecek hafta vaktim olacak: La settimana prossima ___ tempo. (avere)", options:["avrò","averò","ho"], answer:"avrò", explain:"avere → avrò (e düşer)."},
      {q:"Bu yaz İtalya'ya gideceğiz: Quest'estate ___ in Italia. (andare)", options:["andremo","anderemo","andiamo"], answer:"andremo", explain:"andare → andremo (noi)."},
      {q:"Akşam alışveriş yapacağım: Stasera ___ la spesa. (fare – futuro)", options:["farò","farerò","faccio"], answer:"farò", explain:"fare → farò."},
      {q:"Cumartesi sana geleceğim: Sabato ___ da te. (venire – futuro)", options:["verrò","venirò","vengo"], answer:"verrò", explain:"venire → verrò (çift r)."},
      {q:"Yakında görüşeceğiz: Ci ___ presto! (vedere – futuro)", options:["vedremo","vederemo","vediamo"], answer:"vedremo", explain:"vedere → vedremo."},
      {q:"Mutlu olacaksın: Tu ___ contenta. (essere – futuro)", options:["sarai","sarà","sei"], answer:"sarai", explain:"tu → sarai."},
      {q:"Onlar yarın gelecek: Loro ___ domani. (venire – futuro)", options:["verranno","veniranno","vengono"], answer:"verranno", explain:"loro → verranno."}
    ]},
  {uid:"it4-7", type:"grammar", icon:"📖", title:"Gramer: Kibar rica (vorrei, potrebbe)",
    intro:"Condizionale (şart kipi) ile rica ve istekler daha kibar olur. Dükkânda, restoranda, otelde her gün lazım.",
    rule:"<b>Vorrei</b> = isterdim (kibar 'istiyorum'). <b>Potrei</b> = -ebilir miyim? <b>Potrebbe</b> = -ebilir misiniz? (resmi). <b>Mi piacerebbe</b> = çok isterdim / hoşuma giderdi. <b>Dovresti</b> = -malısın (tavsiye). volere: vorrei, vorresti, vorrebbe, <b>vorremmo</b>, vorreste, vorrebbero.",
    structure:[["İfade","Anlam","Örnek"],["Vorrei","isterdim","Vorrei un caffè."],["Potrei...?","-ebilir miyim?","Potrei aprire la finestra?"],["Potrebbe...?","-ebilir misiniz?","Potrebbe aiutarmi?"],["Mi piacerebbe","çok isterdim","Mi piacerebbe vedere Roma."],["Dovresti","-malısın","Dovresti riposare."]],
    examples:[{en:"Vorrei un caffè, per favore.",tr:"Bir kahve rica ediyorum."},{en:"Potrebbe aiutarmi?",tr:"Bana yardım edebilir misiniz?"},{en:"Mi piacerebbe visitare Venezia.",tr:"Venedik'i gezmeyi çok isterdim."},{en:"Vorremmo un tavolo per due.",tr:"İki kişilik bir masa istiyoruz."}],
    exercises:[
      {q:"Kibarca bir kahve iste: ___ un caffè, per favore.", options:["Vorrei","Vorrò","Vuole"], answer:"Vorrei", explain:"Kibar istek: vorrei."},
      {q:"Bana yardım edebilir misiniz? (resmi): ___ aiutarmi?", options:["Potrebbe","Potrei","Potremmo"], answer:"Potrebbe", explain:"Resmi 'siz' (Lei) → potrebbe."},
      {q:"Pencereyi açabilir miyim? ___ aprire la finestra?", options:["Potrei","Potrebbe","Potresti"], answer:"Potrei", explain:"io → potrei."},
      {q:"Roma'yı görmek çok hoşuma giderdi: Mi ___ vedere Roma.", options:["piacerebbe","piace","piacciono"], answer:"piacerebbe", explain:"'-ardı' anlamı: mi piacerebbe."},
      {q:"İki kişilik bir masa isterdik: ___ un tavolo per due.", options:["Vorremmo","Vorrei","Vorreste"], answer:"Vorremmo", explain:"noi → vorremmo."},
      {q:"Doktora gitmelisin: ___ andare dal medico.", options:["Dovresti","Dovrei","Dovrebbero"], answer:"Dovresti", explain:"tu → dovresti (tavsiye)."},
      {q:"Condizionale di cortesia ne işe yarar?", options:["Kibar rica ve istek","Geçmişi anlatmak","Emir vermek"], answer:"Kibar rica ve istek", explain:"Vorrei, potrebbe... ricayı kibarlaştırır."}
    ]},

  {uid:"it4-9", type:"grammar", icon:"📖", title:"Gramer: Nesne zamirleri (lo / la / li / le)",
    intro:"Bir ismi tekrar etmemek için 'onu / onları' anlamında nesne zamiri kullanılır.",
    rule:"<b>lo</b> = onu (eril), <b>la</b> = onu (dişil), <b>li</b> = onları (eril), <b>le</b> = onları (dişil). Ayrıca <b>mi</b> (beni), <b>ti</b> (seni), <b>ci</b> (bizi), <b>vi</b> (sizi). Zamir çekimli fiilden <b>önce</b> gelir: \"Il caffè? <b>Lo</b> bevo.\" = Kahve mi? Onu içerim.",
    structure:[["İsim","Zamir","Örnek"],["il caffè (eril)","lo","Lo bevo."],["la pizza (dişil)","la","La mangio."],["i biscotti (eril çoğul)","li","Li compro."],["le mele (dişil çoğul)","le","Le prendo."]],
    examples:[{en:"Il caffè? Lo bevo ogni mattina.",tr:"Kahve mi? Onu her sabah içerim."},{en:"Maria? Sì, la conosco.",tr:"Maria mı? Evet, onu tanıyorum."},{en:"Ti chiamo domani.",tr:"Seni yarın ararım."}],
    exercises:[
      {q:"Kahve mi? Onu her sabah içerim: Il caffè? ___ bevo ogni mattina.", options:["Lo","La","Li"], answer:"Lo", explain:"caffè eril tekil → lo."},
      {q:"Pizza mı? Onu bu akşam yerim: La pizza? ___ mangio stasera.", options:["La","Lo","Le"], answer:"La", explain:"pizza dişil tekil → la."},
      {q:"Bisküviler mi? Onları süpermarketten alırım: I biscotti? ___ compro al supermercato.", options:["Li","Le","Lo"], answer:"Li", explain:"biscotti eril çoğul → li."},
      {q:"Elmalar mı? Onları ben alırım: Le mele? ___ prendo io.", options:["Le","Li","La"], answer:"Le", explain:"mele dişil çoğul → le."},
      {q:"Maria mı? Evet, onu tanıyorum: Maria? Sì, ___ conosco.", options:["la","lo","li"], answer:"la", explain:"Maria kadın → la."},
      {q:"Beni duyuyor musun? ___ senti?", options:["Mi","Ti","Ci"], answer:"Mi", explain:"beni = mi."},
      {q:"Seni yarın ararım: ___ chiamo domani.", options:["Ti","Mi","Vi"], answer:"Ti", explain:"seni = ti."},
      {q:"Nesne zamiri çekimli fiile göre nereye gelir?", options:["Fiilden önce","Fiilden sonra","Cümlenin sonuna"], answer:"Fiilden önce", explain:"Lo bevo, la conosco: zamir fiilden önce."}
    ]},
  {uid:"it4-10", type:"grammar", icon:"📖", title:"Gramer: Birleşik zamirler (me lo, glielo)",
    intro:"'Onu bana', 'onu sana', 'onu ona' demek için iki zamir birleşir. Başlangıç için en sık kalıpları öğrenelim.",
    rule:"mi → <b>me</b>, ti → <b>te</b>, ci → <b>ce</b>, vi → <b>ve</b> olur ve lo/la'nın önüne gelir: <b>me lo</b>, <b>te la</b>, <b>ce lo</b>. 'Ona' (gli / le) + lo/la → tek kelime: <b>glielo</b>, <b>gliela</b>. \"<b>Me lo</b> dai?\" = Onu bana verir misin?",
    structure:[["Kime?","+ lo (eril)","+ la (dişil)"],["bana (mi)","me lo","me la"],["sana (ti)","te lo","te la"],["ona (gli / le)","glielo","gliela"],["bize (ci)","ce lo","ce la"],["size (vi)","ve lo","ve la"]],
    examples:[{en:"Il libro? Me lo dai?",tr:"Kitap mı? Onu bana verir misin?"},{en:"Il caffè? Te lo porto io.",tr:"Kahve mi? Onu sana ben getiririm."},{en:"La verità? Gliela dico domani.",tr:"Gerçek mi? Onu ona yarın söylerim."}],
    exercises:[
      {q:"Kitabı bana verir misin? Il libro? ___ dai?", options:["Me lo","Mi lo","Lo me"], answer:"Me lo", explain:"mi → me + lo: me lo."},
      {q:"Kahveyi sana getiririm: Il caffè? ___ porto.", options:["Te lo","Ti lo","Lo te"], answer:"Te lo", explain:"ti → te + lo: te lo."},
      {q:"Onu ona (erkeğe) söylerim: ___ dico.", options:["Glielo","Gli lo","Lo gli"], answer:"Glielo", explain:"gli + lo = glielo (tek kelime)."},
      {q:"Onu ona (kadına) söylerim: ___ dico.", options:["Glielo","Le lo","Lo le"], answer:"Glielo", explain:"le + lo da glielo olur."},
      {q:"Pizzayı sana ben getiririm: La pizza? ___ porto io.", options:["Te la","Te lo","Ti la"], answer:"Te la", explain:"pizza dişil: te + la = te la."},
      {q:"mi + lo birleşince ne olur?", options:["me lo","mi lo","lo mi"], answer:"me lo", explain:"mi → me olur: me lo."},
      {q:"Anahtarı bize verir misin? La chiave? ___ dai?", options:["Ce la","Ci la","Ce lo"], answer:"Ce la", explain:"ci → ce; chiave dişil → la: ce la."}
    ]},
