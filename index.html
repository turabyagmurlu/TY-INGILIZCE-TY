function catForUnit(t){ if(/Vücut|Sağlık/.test(t)) return "Vücut"; if(/Hava|Mevsim/.test(t)) return "Doğa & Hava"; if(/Alışveriş|Ulaşım|Mahalle|Otel/.test(t)) return "Şehir"; if(/Rutin|Ev İşleri/.test(t)) return "Fiiller"; if(/Duygu/.test(t)) return "Sıfatlar"; if(/Selam|Tanış/.test(t)) return "Selamlaşma"; if(/Sayı|Renk/.test(t)) return "Sayılar & Renkler"; if(/Aile/.test(t)) return "Aile"; if(/Yiyecek/.test(t)) return "Yiyecek"; if(/Ev/.test(t)) return "Ev"; if(/Zaman/.test(t)) return "Zaman"; if(/Seyahat/.test(t)) return "Şehir"; return "Diğer"; }
function indexCurriculum(){
  ALL_UNITS = []; VOCAB_POOL = []; DICT = [];
  LEVELS.forEach(lv=>lv.units.forEach(u=>{ u._level=lv; ALL_UNITS.push(u); if(u.type==="vocab" && u.words) u.words.forEach(w=>VOCAB_POOL.push(w)); }));
  const seen=new Set();
  function add(w){ const k=w.en.toLowerCase(); if(seen.has(k)) return; seen.add(k); DICT.push(w); }
  LEVELS.forEach(lv=>lv.units.forEach(u=>{ if(u.type==="vocab" && u.words) u.words.forEach(w=>add({en:w.en,tr:w.tr,ex:w.ex,exTr:w.exTr,cat:catForUnit(u.title)})); }));
  DICTIONARY_EXTRA.forEach(add);
  DICT.sort((a,b)=>a.en.toLowerCase().localeCompare(b.en.toLowerCase(),"en"));
}
function findUnit(uid){ return ALL_UNITS.find(u=>u.uid===uid); }
function levelById(id){ return LEVELS.find(l=>l.id===id); }
function levelCompleted(lv){ return lv.units.every(u=>isDone(u.uid)); }
function levelDoneById(id){ const lv=levelById(id); return !!lv && levelCompleted(lv); }
function levelUnlocked(idx){
  if(idx<=0) return true;
  if(state.unlocks && state.unlocks[LEVELS[idx].id]) return true;
  // Önceki seviyeye sonradan yeni ünite eklense de, zaten çalışılmaya başlanmış seviye kilitlenmesin
  if(LEVELS[idx].units.some(u=>isDone(u.uid))) return true;
  return levelCompleted(LEVELS[idx-1]);
}

function snapshotActive(){ return {completedLessons:state.completedLessons, wordsLearned:state.wordsLearned, grammarLearned:state.grammarLearned, reviewWords:state.reviewWords, bestScores:state.bestScores, unlocks:state.unlocks, dictLearned:state.dictLearned, earnedBadges:state.earnedBadges, perfectQuiz:state.perfectQuiz, unitProgress:state.unitProgress, lastUid:state.lastUid, quizSave:state.quizSave||null, notes:state.notes||{}}; }
function applyLangData(o){ o=o||defaultLangData(); state.completedLessons=o.completedLessons||[]; state.wordsLearned=o.wordsLearned||0; state.grammarLearned=o.grammarLearned||0; state.reviewWords=o.reviewWords||[]; state.bestScores=o.bestScores||{}; state.unlocks=o.unlocks||{}; state.dictLearned=o.dictLearned||[]; state.earnedBadges=o.earnedBadges||[]; state.perfectQuiz=!!o.perfectQuiz;
  // Ünite adım takibi (eski kayıtlarda yok → boş başlar; bitmiş üniteler completedLessons'tan anlaşılır)
  const up=o.unitProgress; state.unitProgress=(up&&typeof up==="object"&&!Array.isArray(up))?up:{}; state.lastUid=typeof o.lastUid==="string"?o.lastUid:null;
  const qs=o.quizSave; state.quizSave=(qs&&typeof qs==="object"&&typeof qs.key==="string"&&Array.isArray(qs.questions)&&qs.questions.length&&qs.questions.every(q=>q&&Array.isArray(q.options)&&typeof q.answer==="string")&&qs.qIndex>=0&&qs.qIndex<qs.questions.length)?qs:null;
  // Notlar (eski kayıtlarda yok → boş): {anahtar: {text, updatedAt}}, bozuk kayıtlar atlanır
  const nt=o.notes, notes={}; if(nt&&typeof nt==="object"&&!Array.isArray(nt)) Object.keys(nt).forEach(k=>{ const n=nt[k]; if(n&&typeof n==="object"&&typeof n.text==="string"&&n.text.trim()) notes[k]={text:n.text, updatedAt:+n.updatedAt||0}; });
  state.notes=notes; }
function saveState(){ try{ if(state.lang){ state.langStore[state.lang]=snapshotActive(); } localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function setLanguage(lang, opts){ opts=opts||{}; if(!LANGS[lang]) lang="en";

  state.lang=lang;

function dateKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function computeStreak(){ const set=new Set(state.studyDates); let s=0,cur=new Date();
  if(!set.has(dateKey(cur))) cur=addDays(cur,-1);
  while(set.has(dateKey(cur))){ s++; cur=addDays(cur,-1); } return s; }
function registerStudyToday(){ const t=dateKey(); if(!state.studyDates.includes(t)) state.studyDates.push(t);

let currentScreen="";
let VOICES=[];
function refreshVoices(){ if("speechSynthesis" in window){ VOICES=window.speechSynthesis.getVoices()||[]; } }
if("speechSynthesis" in window){ refreshVoices();
  const onVC=()=>{ const had=VOICES.length; refreshVoices(); if(currentScreen==="settings" && VOICES.length!==had) renderSettings(true); };
  if(window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged",onVC); else window.speechSynthesis.onvoiceschanged=onVC;
  // iOS Safari "voiceschanged" olayını her zaman göndermez; birkaç kez yeniden dene
  [300,1000,2500].forEach(t=>setTimeout(onVC,t)); }
// Apple cihazlardaki şaka/efekt sesleri (Albert, Bad News, Zarvox...) yaşlı kullanıcı için anlaşılmaz; listeden çıkar
const NOVELTY_VOICES=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Junior|Ralph|Fred|Kathy|Princess|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/i;
function langVoices(){ const p=SPEAK_LANG.slice(0,2); return VOICES.filter(v=>new RegExp("^"+p,"i").test(v.lang) && !NOVELTY_VOICES.test(v.name||"")); }
function pickVoice(){ const vs=langVoices();
  if(state.settings.voiceURI){ const v=vs.find(x=>x.voiceURI===state.settings.voiceURI); if(v) return v; }
  const exact=vs.filter(v=>v.lang && v.lang.replace("_","-").toLowerCase()===SPEAK_LANG.toLowerCase());
  const pool=exact.length?exact:vs;
  return pool.find(v=>/enhanced|premium|natural/i.test(v.name))||pool.find(v=>v.default)||pool.find(v=>/google|samantha|alice|federica/i.test(v.name))||pool[0]||null; }
function speakSeq(texts){ if(!("speechSynthesis" in window)){ showToast("Bu cihazda sesli okuma yok."); return; }
  texts=(texts||[]).map(t=>t==null?"":String(t).trim()).filter(Boolean);
  prAbort(); // dinlerken 🔊'ya basılırsa önce mikrofonu kapat (uygulama kendi sesini duymasın)
  const ss=window.speechSynthesis; if(!VOICES.length) refreshVoices();
  ss.cancel(); if(ss.paused) ss.resume();
  const v=pickVoice();
  texts.forEach(t=>{ const u=new SpeechSynthesisUtterance(t); u.lang=SPEAK_LANG; u.rate=state.settings.rate||0.85; if(v) u.voice=v; ss.speak(u); }); }
function speak(text){ speakSeq([text]); }
// Kelime + örnek cümle: önce kelimenin kendisi, sonra cümle
function speakWord(w){ if(!w) return; speakSeq(w.ex && w.ex!==w.en ? [w.en, w.ex] : [w.en]); }

/* ===== TEST MOTORU ===== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(a,n){ return shuffle(a).slice(0,n); }
// Yanlış şıklar: aynı anlama gelen başka bir kelime "yanlış" diye çıkmasın (iki doğru şık olmasın)
function distractors(field, answer, n, word){ const other=field==="en"?"tr":"en"; const low=x=>String(x||"").trim().toLowerCase();
  const seen=new Set([low(answer)]); const out=[];
  for(const w of shuffle(VOCAB_POOL)){ const v=w[field]; if(!v || seen.has(low(v))) continue;
    if(word && low(w[other])===low(word[other])) continue;
    seen.add(low(v)); out.push(v); if(out.length>=n) break; } return out; }
function buildVocabQuiz(words, count){
  const n=count||Math.min(6,Math.max(4,words.length));
  const chosen=sample(words,Math.min(n,words.length)); while(chosen.length<n){ chosen.push(words[Math.floor(Math.random()*words.length)]); }
  const types=["en2tr","tr2en","listen"];
  return chosen.map(w=>{ const t=types[Math.floor(Math.random()*types.length)];
    if(t==="tr2en"){ const o=shuffle([w.en,...distractors("en",w.en,2,w)]); return {kind:"text",prompt:"\""+w.tr+"\" "+(state.lang==="it"?"İtalyancası":"İngilizcesi")+" nedir?",options:o,answer:w.en,explain:"\""+w.tr+"\" = \""+w.en+"\".",word:w}; }
    if(t==="listen"){ const o=shuffle([w.tr,...distractors("tr",w.tr,2,w)]); return {kind:"listen",audio:w.en,prompt:"🔊 Dinle ve Türkçesini seç:",options:o,answer:w.tr,explain:"Duyduğun: \""+w.en+"\" = \""+w.tr+"\".",word:w}; }
    const o=shuffle([w.tr,...distractors("tr",w.tr,2,w)]); return {kind:"text",prompt:"\""+w.en+"\" ne demek?",options:o,answer:w.tr,explain:"\""+w.en+"\" = \""+w.tr+"\".",word:w};
  });
}
function buildGrammarQuiz(unit){ return (unit.exercises||[]).filter(e=>e && e.options && e.options.length).map(e=>({kind:"text",prompt:e.q,options:shuffle(e.options.slice()),answer:e.answer,explain:e.explain||""})); }
function buildLevelTest(lv){
  let qs=[];
  lv.units.forEach(u=>{
    if(u.type==="grammar"){ const g=buildGrammarQuiz(u); if(g.length) qs.push(g[Math.floor(Math.random()*g.length)]); }
    else if(u.words && u.words.length){ qs=qs.concat(buildVocabQuiz(u.words,2)); }
  });
  return shuffle(qs).slice(0, Math.min(10, qs.length));
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
/* ===== BAYRAKLAR =====
   Windows bayrak emojisi çizemez ("GB", "IT" harfleri çıkar); bu yüzden çevrimdışı çalışan satır içi SVG.
   flag(kod) → erişilebilir <span role="img" aria-label="...">; flag(kod,true) → yanında dil adı yazıyorsa dekoratif. */
const FLAG_SVG={
  en:{label:"Birleşik Krallık bayrağı", svg:'<svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" focusable="false"><rect width="60" height="30" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" stroke="#C8102E" stroke-width="2"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg>'},
  it:{label:"İtalya bayrağı", svg:'<svg viewBox="0 0 3 2" preserveAspectRatio="none" focusable="false"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#CE2B37"/></svg>'}
};
function flag(code, decorative){ const f=FLAG_SVG[code]; if(!f) return "";
  return decorative ? `<span class="flag" aria-hidden="true">${f.svg}</span>` : `<span class="flag" role="img" aria-label="${f.label}">${f.svg}</span>`; }
/* Üst başlık: uygulama adı + çalışılan dil (TY İngilizce / TY İtalyanca), aktif ekran işareti */
function updateHeader(){ const L=state.lang&&LANGS[state.lang];
  const t=document.querySelector("#appTitle .h1-txt"); if(t) t.innerHTML=L?`${flag(state.lang,true)} <span class="h1-name">${esc(L.name)}</span>`:`<span class="h1-name">Dil Öğren</span>`;
  const h=document.getElementById("appTitle"); if(h) h.setAttribute("aria-label", L?"TY "+L.name:"TY Dil Öğren");
  const b=document.getElementById("topLang"); if(b){ b.querySelector(".ib-ico").innerHTML=L?flag(state.lang,true):"🌐"; b.setAttribute("aria-label", L?"Dil: "+L.name+" — değiştir":"Dil seç"); }
  document.title=L?"TY "+L.name:"TY İngilizce";
  const map={home:"goHome",dict:"openDict",settings:"goSettings",picker:"langPicker"};
  document.querySelectorAll("header.top .icon-btn").forEach(x=>{ if(map[currentScreen]===x.dataset.act) x.setAttribute("aria-current","page"); else x.removeAttribute("aria-current"); }); }
let toastTimer=null;
function showToast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2300); }
function isDone(uid){ return state.completedLessons.includes(uid); }
function addReviewWord(w){ if(!state.reviewWords.some(x=>x.en===w.en)){ state.reviewWords.push({en:w.en,tr:w.tr,ex:w.ex,exTr:w.exTr}); saveState(); showToast("Tekrar listesine eklendi: "+w.en);} else showToast("Zaten listede."); }
function removeReviewWord(en){ state.reviewWords=state.reviewWords.filter(x=>x.en!==en); saveState(); }
function applySettings(){ const k=state.settings.fontScale||1; document.documentElement.style.setProperty("--fs",(19*k)+"px"); document.documentElement.style.setProperty("--k",String(k)); document.documentElement.classList.toggle("fs-xl",k>=1.25); }
function confetti(){ const c=["#4F7CAC","#F2C14E","#2e9e5b","#d9534f","#9b59b6"];
  for(let i=0;i<70;i++){ const e=document.createElement("div"); e.className="confetti"; e.style.left=Math.random()*100+"vw"; e.style.background=c[i%c.length]; e.style.transform="rotate("+(Math.random()*360)+"deg)"; document.body.appendChild(e);
    const f=600+Math.random()*900, x=Math.random()*120-60; e.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:"translate("+x+"px,100vh) rotate(720deg)",opacity:.9}],{duration:f+1200,easing:"cubic-bezier(.2,.6,.4,1)"}); setTimeout(()=>e.remove(),f+1300); } }
function celebrate(n){ if(!n.length) return; confetti(); showToast("🎉 Yeni rozet: "+n.map(b=>b.name).join(", ")); }

const UNIT_INFO={
  // İngilizce kelime dersleri
  "1-1":"İngilizce'de 'Hello' her zaman kullanılır. 'Good morning' sabah, 'Good evening' akşam içindir. 'How are you?' hal hatır sormaktır; kısa cevabı 'I am fine' (İyiyim).",

  "2-8":"Gün ve zaman kelimeleri: 'today' bugün, 'tomorrow' yarın, 'yesterday' dün.",
  "3-7":"Seyahatte gereken kelimeler ve kalıplar. Bir yeri sormak için 'Where is...?' kullanılır.",
  // İtalyanca kelime dersleri
  "it1-1":"'Ciao' hem merhaba hem hoşça kal demektir (samimi). 'Buongiorno' sabah/gündüz, 'Buonasera' akşam kullanılır. 'Come stai?' = nasılsın.",
  "it1-3":"Adını söylemek: 'Mi chiamo ...' (adım ...). Sormak: 'Come ti chiami?'. Tanışınca 'Piacere' (memnun oldum).",
  "it1-5":"1'den 10'a sayılar: uno, due, tre, quattro, cinque ... dieci.",
  "it1-6":"Temel renkler. İtalyanca'da renk genelde ismin sonuna gelir ve cinsiyete uyar: 'libro rosso' = kırmızı kitap.",

  "it1-10":"Sohbette çok geçen kalıplar. 'A dopo' (sonra görüşürüz), 'Per favore' (lütfen), 'Di dove sei?' (nerelisin?), 'Non lo so' (bilmiyorum), 'Sono turco' (Türküm).",
  "it2-2":"Temel yiyecek ve içecekler: pane (ekmek), acqua (su), caffè (kahve), latte (süt), formaggio (peynir).",
  "it2-5":"Evdeki eşyalar: tavolo (masa), sedia (sandalye), porta (kapı), finestra (pencere), letto (yatak).",
  "it2-8":"Gün ve zaman: oggi (bugün), domani (yarın), ieri (dün), lunedì (pazartesi), sabato, domenica.",
  "it2-9":"Günlük rutin eylemleri: mi alzo (kalkarım), colazione (kahvaltı), lezione (ders), compiti (ödev), cena (akşam yemeği).",
  "it3-7":"Seyahat kelimeleri: aeroporto (havalimanı), biglietto (bilet), treno (tren), albergo (otel). 'Dov'è...?' = ... nerede.",
  "it3-8":"Duygu ve sıfatlar: felice (mutlu), triste (üzgün), stanco (yorgun), contento (memnun), bello (güzel)."
};
function infoFor(u){
  if(UNIT_INFO[u.uid]) return UNIT_INFO[u.uid];
  const ws=(u.words||[]).slice(0,5).map(w=>w.en).join(", ");
  return "Bu derste şu kelimeleri öğreneceksin: "+ws+".";
}
let ctx={};

/* ===== ÜNİTE İLERLEMESİ (adım adım) =====
   state.unitProgress[uid] = {done:{adım:1}, cur:"adım", pos:{flash:n, practice:n}, last:{score,total,passed}}
   Geçilmiş ünite = completedLessons (asıl kaynak). */
const STEPS={
  vocab:[{k:"lesson",n:"Ezberle",go:"Ezberlemeye devam et"},{k:"flash",n:"Kartlar",go:"Kartlara devam et"},{k:"practice",n:"Telaffuz",go:"Telaffuza devam et"},{k:"quiz",n:"Test",go:"Teste geç"}],
  grammar:[{k:"rule",n:"Kural",go:"Kurala devam et"},{k:"examples",n:"Örnekler",go:"Örneklere devam et"},{k:"quiz",n:"Alıştırma",go:"Alıştırmaya geç"}]
};
function unitSteps(u){ return STEPS[u.type==="grammar"?"grammar":"vocab"]; }
function stepIdx(u,k){ return unitSteps(u).findIndex(s=>s.k===k); }
function upGet(uid){ const r=state.unitProgress[uid]; return (r&&typeof r==="object")?r:{}; }
function upRec(uid){ let r=state.unitProgress[uid]; if(!r||typeof r!=="object"){ r=state.unitProgress[uid]={}; } if(!r.done||typeof r.done!=="object") r.done={}; return r; }
function stepDone(u,k){ if(isDone(u.uid)) return true; if(k==="quiz") return false; const d=upGet(u.uid).done; return !!(d&&d[k]); }
function markStep(uid,k){ const r=upRec(uid); r.done[k]=1; saveState(); }
function setCur(u,k,pos){ const r=upRec(u.uid); r.cur=k; if(pos!=null){ if(!r.pos||typeof r.pos!=="object") r.pos={}; r.pos[k]=pos; } state.lastUid=u.uid; saveState(); }
function stepPos(u,k){ const p=upGet(u.uid).pos; return (!stepDone(u,k) && p && typeof p==="object" && +p[k]>0)?+p[k]:0; }
function lastAttempt(u){ const r=upGet(u.uid); if(r.last) return r.last; const b=state.bestScores[u.uid]; return b!=null?{score:b,total:quizTotal(u),passed:isDone(u.uid)}:null; }
function failedAttempt(u){ if(isDone(u.uid)) return false; const a=lastAttempt(u); return !!a && !a.passed; }
function unitStarted(u){ const r=upGet(u.uid); return !!(r.cur || (r.done && Object.keys(r.done).length)); }
/* Kaldığı yerden devam: nerede kaldıysa orası; yoksa ilk yapılmamış adım. */
function nextStepFor(u){ if(isDone(u.uid)) return null; if(failedAttempt(u)) return "quiz";
  const r=upGet(u.uid); if(r.cur && stepIdx(u,r.cur)>=0 && !stepDone(u,r.cur)) return r.cur;
  const s=unitSteps(u).find(x=>!stepDone(u,x.k)); return s?s.k:"quiz"; }
function resumeLabel(u){ const k=nextStepFor(u); if(!k) return "📖 Dersi aç";
  { const ri=resumeInfo(quizKey(u.type==="grammar"?"grammar":"vocab",u.uid)); if(ri) return `⏸ ${u.type==="grammar"?"Alıştırmaya":"Teste"} devam et (${ri.done}/${ri.total})`; }
  if(failedAttempt(u)) return u.type==="grammar"?"🔁 Alıştırmayı tekrar çöz":"🔁 Testi tekrar çöz";
  if(!unitStarted(u)) return "▶️ Derse başla";
  const s=unitSteps(u)[stepIdx(u,k)];
  let extra=""; const ps=stepPos(u,k); if((k==="flash"||k==="practice") && ps>0 && u.words) extra=` (${Math.min(ps+1,u.words.length)}/${u.words.length})`;
  return "▶️ "+s.go+extra; }
function resumeUnit(uid){ const u=findUnit(uid); if(!u){ goHome(); return; } const k=nextStepFor(u); if(!k){ openUnit(uid); return; } goStep(uid,k); }
function unitStatusHtml(u){
  if(isDone(u.uid)){ const best=state.bestScores[u.uid], tot=quizTotal(u); return `<span class="st st-ok">✓ Geçtin${best!=null?` · ${tot?Math.min(best,tot)+"/"+tot:best}`:""}</span>`; }
  if(failedAttempt(u)){ const a=lastAttempt(u); return `<span class="st st-bad">Tekrar dene${a&&a.total?` · ${a.score}/${a.total}`:""}</span>`; }
  if(unitStarted(u)){ const k=nextStepFor(u), i=stepIdx(u,k), st=unitSteps(u); return `<span class="st st-go">Devam: ${i+1}/${st.length} ${esc(st[i].n)}</span>`; }
  return `<span class="st st-new">Başlanmadı</span>`; }
function unitCheckHtml(u){
  if(isDone(u.uid)) return `<div class="check done" aria-label="Geçti">✓</div>`;
  if(failedAttempt(u)) return `<div class="check retry" aria-label="Tekrar gerekli">!</div>`;
  if(unitStarted(u)){ const st=unitSteps(u), n=st.filter(s=>stepDone(u,s.k)).length; return `<div class="check part" aria-label="${n}/${st.length} adım">${n}/${st.length}</div>`; }
  return `<div class="check"></div>`; }
/* Adım çubuğu: her ünite ekranında "neredeyim, ne bitti" */
let pendingNote="";
function stepperHtml(u,cur){ const st=unitSteps(u), ci=stepIdx(u,cur);
  const note=pendingNote; pendingNote="";
  return `${note?`<div class="step-note" role="status">${note}</div>`:""}
    <div class="step-pos">Adım ${ci+1} / ${st.length}: <b>${esc(st[ci].n)}</b></div>
    <div class="stepper" id="unitSteps">${st.map((s,i)=>{ const ok=stepDone(u,s.k), c=i===ci;
      return `<button class="step${ok?" ok":""}${c?" cur":""}" data-act="step" data-uid="${u.uid}" data-k="${s.k}" ${c?'aria-current="step"':""} aria-label="Adım ${i+1}: ${esc(s.n)}${ok?" (bitti)":""}"><span class="n">${ok?"✓":i+1}</span><br>${esc(s.n)}</button>`; }).join("")}</div>`; }
function unitBarHtml(u,cur){ return `<div class="card unit-bar"><div class="ub-title">${u.icon} ${esc(u.title)}</div>${stepperHtml(u,cur)}</div>`; }
function refreshStepper(u,cur){ const el=document.getElementById("unitSteps"); if(!el) return; const box=el.parentNode;
  const pos=box.querySelector(".step-pos"); const tmp=document.createElement("div"); tmp.innerHTML=stepperHtml(u,cur);
  if(pos) pos.replaceWith(tmp.querySelector(".step-pos")); el.replaceWith(tmp.querySelector("#unitSteps")); }
/* Dersten (Ezberle / Kural-Örnekler) sonraki adıma geçerken ders adımlarını bitmiş say */
function leaveLesson(uid){ if(!ctx.unit || ctx.unit.uid!==uid) return;
  if(currentScreen==="vocab") markStep(uid,"lesson");
  else if(currentScreen==="grammar"){ const r=upRec(uid); r.done.rule=1; r.done.examples=1; saveState(); } }
function jumpTo(id){ const t=document.getElementById(id); if(t){ try{ t.scrollIntoView({behavior:"smooth",block:"start"}); }catch(_){ t.scrollIntoView(); } } }
function goStep(uid,k){ const u=findUnit(uid); if(!u){ goHome(); return; }
  const resumePos=stepPos(u,k);
  switch(k){
    case "lesson": if(currentScreen==="vocab" && ctx.unit===u) jumpTo("ezberCard"); else renderVocab(u); break;
    case "rule": if(currentScreen==="grammar" && ctx.unit===u){ jumpTo("ruleBox"); grammarAt(u,"rule"); } else renderGrammar(u); break;
    case "examples": if(!(currentScreen==="grammar" && ctx.unit===u)) renderGrammar(u); grammarAt(u,"examples"); jumpTo(document.getElementById("exCard")?"exCard":"ruleBox"); break;
    case "flash": renderFlash(uid,resumePos); break;
    case "practice": renderPractice(uid,resumePos); break;
    case "quiz": if(currentScreen==="quiz" && ctx.unit===u) return; renderQuizIntro(uid,u.type==="grammar"?"grammar":"vocab"); break;
  } }
/* Gramer dersinde kural ve örnekler aynı ekranda: hangisindeyse onu işaretle */
function grammarAt(u,k){ if(k==="examples"){ const r=upRec(u.uid); r.done.rule=1; } setCur(u,k); refreshStepper(u,k); }

/* ===== GEZİNME (telefonun "geri" tuşu) =====
   Ana sayfa dışındaki her ekran geçmişe tek bir kayıt ekler; böylece Android'de "geri"
   uygulamadan çıkmak yerine ana sayfaya döner. */
function nav(screen){ currentScreen=screen; prAbort();
  if(state.lang){ try{ if(!(history.state && history.state.inner)) history.pushState({inner:true},""); }catch(e){} } }
function goHome(){ try{ if(history.state && history.state.inner){ history.back(); return; } }catch(e){} renderHome(); }
window.addEventListener("popstate",()=>{ prAbort(); if("speechSynthesis" in window) window.speechSynthesis.cancel(); if(state.lang) renderHome(); else renderLangPicker(); });
function quizTotal(u){ if(!u) return 0; if(u.type==="grammar") return buildGrammarQuiz(u).length; const n=(u.words||[]).length; return n?Math.min(6,Math.max(4,n)):0; }

/* ===== ANA SAYFA ===== */
function renderHome(){ currentScreen="home";
  const totalU=ALL_UNITS.length, doneU=ALL_UNITS.filter(u=>isDone(u.uid)).length;
  const studiedToday=state.studyDates.includes(dateKey());
  // önerilen sıradaki ünite
  let nextU=null, nextLevelLocked=false;
  for(let i=0;i<LEVELS.length;i++){ const lv=LEVELS[i];
    const u=lv.units.find(x=>!isDone(x.uid));
    if(u){ if(levelUnlocked(i)){ nextU=u; } else { nextLevelLocked=true; } break; }
  }
  // Yarım kalan (en son çalışılan) ünite varsa önce ona devam
  const lastU=state.lastUid && findUnit(state.lastUid);
  if(lastU && !isDone(lastU.uid) && levelUnlocked(LEVELS.indexOf(lastU._level)) && (unitStarted(lastU)||failedAttempt(lastU))) nextU=lastU;
  const names=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"]; const today=new Date(); let week="";
  for(let i=6;i>=0;i--){ const d=addDays(today,-i); const k=dateKey(d); const on=state.studyDates.includes(k); const dn=(d.getDay()+6)%7;
    week+=`<div class="day"><div class="dot ${on?"on":""} ${i===0?"today":""}">${on?"✓":d.getDate()}</div><div class="lbl">${names[dn]}</div></div>`; }

  let html=`
    <div class="card">
      <h2>Hoş geldin! 👋</h2>
      <p class="muted">Seviye seviye ilerle. Önce kelimeler, sonra gramer. Acele yok. 💛</p>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <div class="streak-badge">🔥 ${state.streak} gün seri</div>
        <div class="muted">${studiedToday?"Bugün çalıştın! ✅":"Bugünün dersini henüz yapmadın."}</div>
      </div>
      ${studiedToday?"":`<div class="daily">⏰ <b>Bugünün 10 dakikası seni bekliyor.</b> ${state.reviewWords.length?`Önce tekrar listendeki ${state.reviewWords.length} kelimeye bak, sonra kaldığın dersten devam et.`:"Aşağıdan kaldığın dersten devam et."}
        ${state.reviewWords.length?`<button class="btn btn-accent" data-act="review">🔁 ${state.reviewWords.length} kelimeyi tekrar et</button>`:""}</div>`}
      <button class="btn btn-soft" data-act="langPicker"><span>🌐 Dil: ${flag(state.lang,true)} ${esc(LANGS[state.lang].name)} — Değiştir</span></button>
    </div>`;

  if(nextU){
    const nk=nextStepFor(nextU), started=unitStarted(nextU), failed=failedAttempt(nextU), la=lastAttempt(nextU);
    html+=`<div class="card continue-card">
      <h3>${started||failed?"Kaldığın Yerden Devam Et":"Sıradaki Ders"}</h3>
      <p style="font-size:20px;font-weight:700;color:var(--primary-dark);margin-bottom:2px;">${nextU.icon} ${esc(nextU.title)}</p>
      <p class="muted">${nextU._level.name} · ${nextU.type==="grammar"?"Gramer dersi":"Kelime dersi"}</p>
      ${failed&&la?`<p class="st-line">Son deneme: <b>${la.score}/${la.total||quizTotal(nextU)}</b> · Geçmek için en az <b>${passMark(la.total||quizTotal(nextU))}</b> doğru gerekli.</p>`:""}
      ${started||failed?stepperHtml(nextU,nk):""}
      <button class="btn btn-primary" data-act="resume" data-uid="${nextU.uid}">${resumeLabel(nextU)}</button>
    </div>`;
  } else if(!nextLevelLocked){
    html+=`<div class="card"><h3>🎉 Tüm dersleri bitirdin!</h3><p class="muted">Karışık tekrar ile bilgini taze tut.</p>
      <button class="btn btn-accent" data-act="mixReview">🔀 Karışık Tekrar</button></div>`;
  }

  // seviyeler
  LEVELS.forEach((lv,idx)=>{
    const unlocked=levelUnlocked(idx);
    const done=lv.units.filter(u=>isDone(u.uid)).length;
    const colorVar = idx===0?"--l1":idx===1?"--l2":idx===2?"--l3":"--l4", pillVar = colorVar+"d";
    html+=`<div class="level-card" style="border-top-color:var(${colorVar});">
      <div class="level-head">
        <span class="cefr" style="background:var(${pillVar});">${esc(lv.cefr)}</span>
        <span class="lv-title">${esc(lv.name)}</span>
        <span class="lv-prog">${done}/${lv.units.length} ünite ${unlocked?"":"· 🔒 Kilitli"}</span>
      </div>
      <div class="lv-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${lv.units.length}" aria-valuenow="${done}" aria-label="${done}/${lv.units.length} ünite bitti"><span style="width:${Math.round(done/lv.units.length*100)}%;background:var(${colorVar});"></span></div>
      ${done===lv.units.length?`<p class="lv-done">✓ Bu seviye tamam!</p>`:""}
      <p class="muted" style="margin-top:6px;">${esc(lv.desc)}</p>`;
    if(!unlocked){
      html+=`<div class="locked-note">🔒 Bu seviye, bir önceki seviyeyi bitirince açılır. Yine de denemek istersen aşağıdan açabilirsin.</div>
        <button class="btn btn-ghost" data-act="unlock" data-id="${lv.id}">🔓 Bu seviyeyi yine de aç</button>`;
    } else {
      html+=`<ul class="unit-list">`;
      lv.units.forEach(u=>{
        const tag = u.type==="grammar"?`<span class="type-tag g">📖 Gramer</span>`:`<span class="type-tag v">🔤 Kelime</span>`;
        const isNext = nextU===u;
        html+=`<li class="unit-item${isNext?" is-next":""}" data-act="resume" data-uid="${u.uid}" role="button" tabindex="0">
          <div class="unit-ico">${u.icon}</div>
          <div class="unit-meta"><div class="t">${esc(u.title)}</div><div class="u-tags">${tag}${unitStatusHtml(u)}${isNext?`<span class="st st-next">▶ Sıradaki</span>`:""}</div></div>
          ${unitCheckHtml(u)}
        </li>`;
      });
      html+=`</ul>
        <button class="btn btn-soft" data-act="levelTest" data-id="${lv.id}">📝 ${esc(lv.cefr)} Seviye Testi (karışık)</button>`;
    }
    html+=`</div>`;

const MIC_OFF_LANG={}; // "language-not-supported" veren dil (ör. cihaz İtalyanca tanımıyor)

/* --- Puanlama (saf fonksiyonlar) --- */
const PR_NUM={
  en:{ones:["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"],
      tens:["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"]},
  it:{ones:["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"],
      tens:["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"]}
};
function prNumWord(n,lang){ const L=PR_NUM[lang==="it"?"it":"en"];
  if(n<20) return L.ones[n];
  if(n<100){ const t=L.tens[Math.floor(n/10)], o=n%10; if(!o) return t;
    if(lang==="it") return ((o===1||o===8)?t.slice(0,-1):t)+L.ones[o];
    return t+" "+L.ones[o]; }
  if(n===100) return lang==="it"?"cento":"one hundred";
  if(lang!=="it" && n<1000){ const h=Math.floor(n/100), r=n%100; return L.ones[h]+" hundred"+(r?" "+prNumWord(r,lang):""); }
  return String(n); }
const PR_ART={en:new Set(["a","an","the"]),it:new Set(["il","lo","la","l","i","gli","le","un","una","uno"])};
const PR_FILLERS=new Set(["uh","um","umm","eh","ehm","ah","hmm","mm"]);
const PR_ABBR={en:{mr:"mister",mrs:"missus",dr:"doctor",okay:"ok"},it:{}};
/* Metni karşılaştırılabilir kelime dizisine çevirir: küçük harf, noktalama yok, aksan yok,
   İngilizce kısaltmalar açılır (I'm → i am), rakamlar yazıya (3 → three / tre), İtalyanca l'acqua → l acqua */
function prNorm(s,lang){ lang=lang==="it"?"it":"en";
  let t=String(s==null?"":s).normalize("NFC").toLowerCase().replace(/[’‘`´ʼ]/g,"'").replace(/\([^)]*\)/g," ").replace(/(\d)[:.]00\b/g,"$1").replace(/&/g,lang==="it"?" e ":" and ");
  if(lang==="en"){
    t=t.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/\bshan't\b/g,"shall not").replace(/\bain't\b/g,"is not").replace(/\blet's\b/g,"let us")
       .replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'m\b/g," am").replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'d\b/g," would").replace(/'s\b/g," is")
       .replace(/'/g,"");
  } else { t=t.replace(/'/g," "); }
  t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
  const out=[]; t.split(" ").forEach(w=>{ if(!w||PR_FILLERS.has(w)) return;
    if(/^\d+$/.test(w)){ const n=parseInt(w,10); if(n<=999) prNumWord(n,lang).split(" ").forEach(x=>out.push(x)); else out.push(w); return; }
    const m=w.match(/^(\d+)(st|nd|rd|th)$/); if(m){ out.push(m[1]); return; }
    out.push(PR_ABBR[lang][w]||w); });
  return out; }
function prLev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=new Array(n+1), c=new Array(n+1); for(let j=0;j<=n;j++) p[j]=j;
  for(let i=1;i<=m;i++){ c[0]=i; for(let j=1;j<=n;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); } const x=p; p=c; c=x; }
  return p[n]; }
function prSim(a,b){ if(a===b) return 1; const L=Math.max(a.length,b.length); return L?1-prLev(a,b)/L:1; }
/* Tek hedef ↔ tek duyulan: kelimeleri sırayla hizala (kelime başına Levenshtein benzerliği),
   puan = hedef kapsaması (artikeller az ağırlıklı) − fazladan kelime cezası */
function prScoreOne(target,heard,lang){ const PR_ARTICLES=PR_ART[lang==="it"?"it":"en"], open=/\.\.\.|…/.test(target);
  const T=prNorm(target,lang), H=prNorm(heard,lang);
  if(!T.length) return {score:0,bad:[]};
  if(!H.length) return {score:0,bad:T.filter(w=>!PR_ARTICLES.has(w))};
  const m=T.length,n=H.length, wt=w=>PR_ARTICLES.has(w)?0.4:1, dp=[];
  for(let i=0;i<=m;i++) dp.push(new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){ const s=prSim(T[i-1],H[j-1]);
    dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1], s>=0.5?dp[i-1][j-1]+s*wt(T[i-1]):0); }
  const got=new Array(m).fill(0), usedH=new Set(); let i=m,j=n;
  while(i>0&&j>0){ const s=prSim(T[i-1],H[j-1]);
    if(s>=0.5 && Math.abs(dp[i][j]-(dp[i-1][j-1]+s*wt(T[i-1])))<1e-9){ got[i-1]=s; usedH.add(j-1); i--; j--; }
    else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--; }
  let tw=0,sw=0; T.forEach((w,k)=>{ tw+=wt(w); sw+=got[k]*wt(w); });
  const extra=H.filter((w,k)=>!usedH.has(k)&&!PR_ARTICLES.has(w)).length;
  let score=sw/tw-(open?0:Math.min(0.2,0.05*extra));
  let bad=T.filter((w,k)=>!PR_ARTICLES.has(w)&&got[k]<0.75);
  // "ice cream" ↔ "icecream", "good bye" ↔ "goodbye": boşluksuz karşılaştırma
  const J=prSim(T.join(""),H.join(""));
  if(T.length!==H.length && J>=0.9 && J>score){ score=J; bad=[]; }
  return {score:Math.max(0,Math.min(1,score)),bad}; }
/* target: hedef metin ("a / b" alternatifleri olabilir); heardList: tanınan alternatifler.
   Döner: {score 0..1, grade "good"|"near"|"bad", bad:[normalize edilmiş yanlış kelimeler], heard, target} */
function pronScore(target,heardList,lang){ const tgts=String(target==null?"":target).split("/").map(s=>s.trim()).filter(Boolean);
  const hs=(Array.isArray(heardList)?heardList:[heardList]).map(h=>String(h==null?"":h).trim()).filter(Boolean);
  let best={score:0,bad:prNorm(tgts[0]||"",lang).filter(w=>!PR_ART[lang==="it"?"it":"en"].has(w)),heard:hs[0]||"",target:tgts[0]||""};
  hs.forEach(h=>tgts.forEach(t=>{ const r=prScoreOne(t,h,lang); if(r.score>best.score+1e-9) best={score:r.score,bad:r.bad,heard:h,target:t}; }));
  best.grade=(best.score>=0.85 && !best.bad.length)?"good":(best.score>=0.6?"near":"bad");
  return best; }

/* --- Ses tanıma oturumu: aynı anda tek oturum, çift dokunma korumalı, 7 sn güvenlik durdurması --- */
let PRS=null;
const PR_TIMEOUT=7000;
function prBtnIdle(s){ const b=s&&s.btn; if(b&&b.isConnected){ b.classList.remove("listening"); b.innerHTML=b.dataset.label||"🎤 Söyle ve Kontrol Et"; } }
function prAbort(){ const s=PRS; if(!s) return; PRS=null; clearTimeout(s.timer); clearTimeout(s.killer); clearTimeout(s.startT);
  try{ if(s.rec) s.rec.abort(); }catch(e){} prBtnIdle(s);
  if(s.box&&s.box.isConnected&&s.box.classList.contains("listening")){ s.box.className="mic-state"; s.box.textContent="Hazır olduğunda tekrar 🎤'a bas."; } }
function prLangName(){ return prLang()==="it"?"İtalyanca":"İngilizce"; }
const PR_PERM_HELP=`<ul class="mr-help">
  <li><b>Bilgisayar (Chrome / Edge):</b> adres çubuğunun solundaki 🔒 kilit simgesine bas → <b>Mikrofon</b> → <b>İzin ver</b>. Sonra sayfayı yenile.</li>
  <li><b>Android telefon:</b> Chrome ⋮ menü → Ayarlar → Site ayarları → Mikrofon → bu siteye izin ver. Uygulama olarak yüklüyse: simgeye basılı tut → Uygulama bilgisi → İzinler → Mikrofon → İzin ver.</li>
  <li><b>iPhone:</b> Ayarlar → Safari → Mikrofon → İzin Ver.</li></ul>`;
function prErrorInfo(code){ switch(code){

  case "not-allowed": return {msg:"Mikrofon izni verilmedi.", act:"Mikrofona izin vermek için:", html:PR_PERM_HELP};
  case "service-not-allowed": return {msg:"Bu cihazda ses tanıma hizmeti kapalı.", act:"iPhone'da Ayarlar → Genel → Klavye → Dikte'yi açabilirsin. Şimdilik kelimeyi dinle, sesli söyle ve “Ben Söyledim, Devam”a bas.", fatal:true};
  case "network": return {msg:"Ses tanıma için internet gerekiyor (Chrome ve Edge sesi internette çözümler).", act:"İnternet bağlantını kontrol edip tekrar dene."};
  case "language-not-supported": return {msg:"Bu cihaz "+prLangName()+" ses tanımayı desteklemiyor.", act:"Kelimeyi dinle, sesli söyle ve “Ben Söyledim, Devam”a bas.", fatal:true, lang:true};

/* Hedef metinde yanlış söylenen kelimeleri <mark> ile göster */
function prMarkTarget(target,bad,lang){ const badSet=new Set(bad||[]);
  return String(target).split(/(\s+)/).map(p=>{ if(!p.trim()) return p; return prNorm(p,lang).some(x=>badSet.has(x))?`<mark class="miss">${esc(p)}</mark>`:esc(p); }).join(""); }
/* opts: {target, box, btn, small, uid, key, nextHtml, onGood(res), onFatal(info)} */
function pronStart(opts){ const now=Date.now();
  if(PRS){ if(PRS.btn===opts.btn){ if(now-PRS.t0<700) return true; prStopUser(); return true; } prAbort(); }
  if(!micAvailable()||!opts.box) return false;
  const box=opts.box, btn=opts.btn;
  const s={opts,box,btn,lang:prLang(),t0:now,finals:null,interim:"",err:null,userStop:false,rec:null}; PRS=s;
  if(btn){ if(!btn.dataset.label) btn.dataset.label=btn.innerHTML; btn.classList.add("listening"); btn.innerHTML=opts.small?"⏹":"⏹ Dinliyorum… Durdur"; }
  box.className="mic-state listening"; box.innerHTML="🎤 <span class='pulse'>Hazırlanıyor…</span>";
  // Uygulamanın kendi sesi mikrofona girmesin: konuşmayı kes, kısa bir süre bekle
  let wait=0; try{ if("speechSynthesis" in window){ const ss=window.speechSynthesis; if(ss.speaking||ss.pending) wait=350; ss.cancel(); } }catch(e){}
  s.startT=setTimeout(()=>prBegin(s),wait);

function prBegin(s){ if(PRS!==s) return; let rec;

  rec.onstart=()=>{ if(PRS!==s) return; if(!s.box.isConnected){ prAbort(); return; } s.box.innerHTML="🎤 <span class='pulse'>Dinliyorum… şimdi söyle</span><div class='mic-live'></div>"; };
  rec.onresult=(e)=>{ if(PRS!==s) return; if(!s.box.isConnected){ prAbort(); return; } const fin=[]; let interim="", allFinal=true;
    for(let i=0;i<e.results.length;i++){ const r=e.results[i]; if(!r||!r.length) continue;
      if(r.isFinal) fin.push(r); else { allFinal=false; interim+=((r[0]&&r[0].transcript)||"")+" "; } }
    if(fin.length) s.finals=fin;
    const live=(fin.map(r=>r[0].transcript).join(" ")+" "+interim).replace(/\s+/g," ").trim(); if(live) s.interim=live;
    const lv=s.box.querySelector(".mic-live"); if(lv) lv.textContent=live?"“"+live+"”":"";
    if(fin.length && allFinal){ try{ rec.stop(); }catch(_){} } };
  rec.onerror=(ev)=>{ if(PRS!==s) return; s.err=(ev&&ev.error)||"unknown"; };
  rec.onend=()=>{ if(PRS!==s) return; prFinish(s); };
  try{ rec.start(); }catch(e){ prFinish(s,"start-failed"); return; }
  s.timer=setTimeout(()=>{ if(PRS!==s) return; s.timedOut=true; try{ rec.stop(); }catch(_){}
    s.killer=setTimeout(()=>{ if(PRS===s){ try{ rec.abort(); }catch(_){} prFinish(s); } },1500); },PR_TIMEOUT); }
function prStopUser(){ const s=PRS; if(!s) return; s.userStop=true;
  if(!s.rec){ prAbort(); return; }
  try{ s.rec.stop(); }catch(_){}
  clearTimeout(s.killer); s.killer=setTimeout(()=>{ if(PRS===s){ try{ s.rec.abort(); }catch(_){} prFinish(s); } },1500); }
function prCandidates(s){ const f=s.finals;
  if(f&&f.length){ const out=[], n=Math.max(...f.map(r=>r.length));
    for(let j=0;j<n;j++) out.push(f.map(r=>((r[j]||r[0]).transcript)||"").join(" ").trim());
    return out.filter(Boolean); }
  return s.interim?[s.interim]:[]; }
function prFinish(s,forcedErr){ if(PRS!==s) return; PRS=null; clearTimeout(s.timer); clearTimeout(s.killer); prBtnIdle(s);
  const box=s.box, o=s.opts; if(!box||!box.isConnected) return;
  const cands=forcedErr?[]:prCandidates(s);
  if(cands.length){ prShowResult(s,pronScore(o.target,cands,s.lang)); return; }
  let code=forcedErr||s.err||"no-speech"; if(code==="aborted" && s.timedOut) code="no-speech";
  if(s.userStop && (code==="aborted"||code==="no-speech")){ box.className="mic-state"; box.textContent="Durduruldu. Hazır olduğunda tekrar 🎤'a bas."; return; }
  const info=prErrorInfo(code);
  if(info.fatal){ if(info.lang) MIC_OFF_LANG[SPEAK_LANG]=true; else MIC_OFF=true; if(o.onFatal){ o.onFatal(info); return; } }
  box.className="mic-state warn"; box.innerHTML=`<div class="mr-title">⚠️ ${esc(info.msg)}</div><div>${esc(info.act)}</div>${info.html||""}`; }
function prShowResult(s,res){ const o=s.opts, box=s.box, pct=Math.round(res.score*100), tgt=res.target||o.target;

  const heard=`<div class="mr-heard">Duyduğum: <b>“${esc(res.heard)}”</b> <span class="muted">· benzerlik %${pct}</span></div>`;
  const badOrig=[]; String(tgt).split(/\s+/).forEach(p=>{ if(prNorm(p,s.lang).some(x=>res.bad.includes(x))) badOrig.push(p.replace(/[.,!?;:…"“”¿¡]+/g,"")); });
  if(res.grade==="good"){ box.className="mic-state good";
    box.innerHTML=`<div class="mr-title">✓ Çok iyi! Doğru söyledin.</div>${heard}${o.nextHtml||""}`;
    if(o.onGood) o.onGood(res); }
  else if(res.grade==="near"){ box.className="mic-state near";
    box.innerHTML=`<div class="mr-title">🙂 Neredeyse${badOrig.length?" — şu kelimeye dikkat: <b>"+esc(badOrig.join(", "))+"</b>":" — sadece hedefi söyle."}</div>
      <div class="mr-target">Hedef: ${prMarkTarget(tgt,res.bad,s.lang)}</div>${heard}<div class="muted">🔊 Tekrar dinle, sonra yavaşça yeniden 🎤.</div>`; }
  else { box.className="mic-state bad";
    box.innerHTML=`<div class="mr-title">✗ Tekrar dene</div><div class="mr-target">Hedef: ${prMarkTarget(tgt,res.bad,s.lang)}</div>${heard}<div class="muted">Önce 🔊 Dinle'ye bas, sonra kelime kelime, yavaşça söyle. 💪</div>`; }
  const nb=box.querySelector("[data-focus]"); if(nb){ try{ nb.focus({preventScroll:true}); }catch(_){} } }

/* ----- YARIM KALAN TEST ----- */
function quizKey(mode,id){ return mode+":"+(id==null?"":id); }
function ctxKey(){ return quizKey(ctx.mode, ctx.unit?ctx.unit.uid:(ctx.level?ctx.level.id:(ctx.fromReview?"review":"all"))); }
function saveQuizProgress(){ try{ if(!ctx||!ctx.questions) return; state.quizSave={key:ctxKey(), mode:ctx.mode, questions:ctx.questions, qIndex:ctx.qIndex, correct:ctx.correct, answered:!!ctx.answered, savedAt:Date.now()}; saveState(); }catch(e){} }
function clearQuizProgress(){ if(state.quizSave){ state.quizSave=null; saveState(); } }
function savedQuiz(key){ const q=state.quizSave; return (q && q.key===key)?q:null; }
function resumeInfo(key){ const q=savedQuiz(key); if(!q) return null; const done=q.qIndex+(q.answered?1:0); return {q, done, total:q.questions.length}; }
// Kayıt varsa ctx'i oradan kur; cevaplanmış son soruda kaldıysa bir sonrakine geç
function tryResume(key, base){ const q=savedQuiz(key); if(!q) return false;
  ctx=Object.assign(base,{questions:q.questions, qIndex:q.qIndex, correct:q.correct||0, answered:false, resumed:true});
  if(q.answered){ if(ctx.qIndex>=ctx.questions.length-1){ finishQuiz(); return true; } ctx.qIndex++; }
  saveQuizProgress(); drawQuiz(); showToast("Kaldığın yerden devam: Soru "+(ctx.qIndex+1)+" / "+ctx.questions.length); return true; }
function restartQuiz(){ const m=ctx.mode; clearQuizProgress();
  if(m==="vocab"||m==="grammar") startQuiz(ctx.unit.uid, m, true); else if(m==="leveltest") startLevelTest(ctx.level.id, true); else startMixReview(ctx.fromReview, true); }
function startQuiz(uid,kind,fresh){ const u=findUnit(uid); if(!u){ goHome(); return; } leaveLesson(uid);
  if(fresh) { if(savedQuiz(quizKey(kind,uid))) clearQuizProgress(); }
  else { setCur(u,"quiz"); if(tryResume(quizKey(kind,uid), {unit:u, mode:kind})) return; }
  const questions = kind==="grammar" ? buildGrammarQuiz(u) : ((u.words&&u.words.length)?buildVocabQuiz(u.words):[]);
  if(!questions.length){ showToast("Bu ders için soru yok."); return; }
  setCur(u,"quiz"); ctx={unit:u, mode:kind, questions, qIndex:0, correct:0, answered:false}; saveQuizProgress(); drawQuiz(); }
function startLevelTest(id,fresh){ const lv=levelById(id); if(!lv) return;
  if(!fresh && tryResume(quizKey("leveltest",lv.id), {unit:null, level:lv, mode:"leveltest"})) return;
  const qs=buildLevelTest(lv);
  if(!qs.length){ showToast("Bu seviye için soru yok."); return; }
  ctx={unit:null, level:lv, mode:"leveltest", questions:qs, qIndex:0, correct:0, answered:false}; saveQuizProgress(); drawQuiz(); }
function startMixReview(fromReview,fresh){ fromReview=!!fromReview;
  if(!fresh && tryResume(quizKey("mix",fromReview?"review":"all"), {unit:null, mode:"mix", fromReview})) return;
  let pool=[];
  if(fromReview) pool=state.reviewWords.filter(w=>w && w.en && w.tr);
  else { ALL_UNITS.forEach(u=>{ if(u.type==="vocab" && isDone(u.uid) && u.words) pool=pool.concat(u.words); }); if(pool.length<4) pool=VOCAB_POOL; }
  if(!pool.length){ showToast("Test için kelime yok."); return; }
  ctx={unit:null, mode:"mix", fromReview, questions:buildVocabQuiz(pool, Math.min(8,Math.max(4,pool.length))), qIndex:0, correct:0, answered:false}; saveQuizProgress(); drawQuiz(); }
function drawQuiz(){ const q=ctx.questions[ctx.qIndex], n=ctx.questions.length, pct=Math.round(ctx.qIndex/n*100); nav("quiz");
  const unitQ=(ctx.mode==="vocab"||ctx.mode==="grammar") && ctx.unit;
  app.innerHTML=`${unitQ?unitBarHtml(ctx.unit,"quiz"):""}<div class="card"><div class="counter">Soru ${ctx.qIndex+1} / ${n}</div>
    <div class="progressbar"><span style="width:${pct}%"></span></div><h3>${esc(q.prompt)}</h3>
    ${q.kind==="listen"?`<button class="btn btn-accent" data-act="replayAudio">🔊 Tekrar Dinle</button>`:""}
    <div id="opts" style="margin-top:10px;">${q.options.map((o,i)=>`<button class="opt" data-act="answer" data-i="${i}"><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="qfeedback"></div><div id="qnext"></div></div>
    <div class="card quiz-exit"><button class="btn btn-soft" data-act="goHome">Ara ver, Ana Sayfa</button><p class="muted center" style="margin:6px 0 0;">Cevapların kaydediliyor. Döndüğünde kaldığın sorudan devam edersin.</p>${ctx.resumed?`<button class="btn btn-ghost" data-act="restartQuiz">↺ Testi baştan başlat</button>`:""}</div>`;
  if(q.kind==="listen"){ const myQ=q; setTimeout(()=>{ if(currentScreen==="quiz" && ctx.questions && ctx.questions[ctx.qIndex]===myQ && !ctx.answered) speak(myQ.audio); },350); } window.scrollTo(0,0); }
function answerQuiz(i){ if(ctx.answered) return; ctx.answered=true; const q=ctx.questions[ctx.qIndex]; const correct=q.options[i]===q.answer;
  document.querySelectorAll("#opts .opt").forEach((b,idx)=>{ b.disabled=true; if(q.options[idx]===q.answer) b.classList.add("correct"); else if(idx===i) b.classList.add("wrong"); });
  if(correct) ctx.correct++;
  saveQuizProgress();
  let addedRev=false; if(!correct && q.word && q.word.en && !state.reviewWords.some(x=>x.en===q.word.en)){ const w=q.word; state.reviewWords.push({en:w.en,tr:w.tr,ex:w.ex,exTr:w.exTr}); saveState(); addedRev=true; }
  const fb=document.getElementById("qfeedback"); fb.className="feedback "+(correct?"good":"bad");
  fb.innerHTML=correct?"✓ Doğru! Aferin. 👏":"✗ Doğru cevap: <b>"+esc(q.answer)+"</b>."+(q.explain?"<br>"+esc(q.explain):"")+(addedRev?"<br><small>🔁 Bu kelime tekrar listene eklendi.</small>":"");
  const last=ctx.qIndex>=ctx.questions.length-1;
  const nx=document.getElementById("qnext"); nx.innerHTML=`<button class="btn btn-primary" data-act="nextQuiz">${last?"Sonucu Gör":"Sonraki Soru ➡️"}</button>`;
  // Açıklama ve "Sonraki" düğmesi ekranın altında kalmasın
  try{ nx.scrollIntoView({block:"nearest",behavior:"smooth"}); }catch(e){ nx.scrollIntoView(false); } }
function nextQuiz(){ if(ctx.qIndex<ctx.questions.length-1){ ctx.qIndex++; ctx.answered=false; saveQuizProgress(); drawQuiz(); } else finishQuiz(); }
function passMark(n){ return Math.max(1, Math.ceil(n*0.67)); }
function finishQuiz(){ const n=ctx.questions.length, score=ctx.correct, perfect=score===n; if(savedQuiz(ctxKey())) state.quizSave=null; registerStudyToday(); nav("result");
  let firstTime=false, levelJustDone=false; const u=ctx.unit;
  const unitQuiz=(ctx.mode==="vocab"||ctx.mode==="grammar") && !!u, need=passMark(n), passed=score>=need;
  if(unitQuiz){ const r=upRec(u.uid); r.last={score, total:n, passed}; r.cur="quiz"; state.lastUid=u.uid; }
  if(unitQuiz && !passed){
    const prevB=state.bestScores[u.uid]; if(prevB==null||score>prevB) state.bestScores[u.uid]=score; saveState();
    app.innerHTML=`${unitBarHtml(u,"quiz")}<div class="card center"><h2>📚 Biraz daha çalışalım</h2>
      <p style="font-size:24px;font-weight:800;">${score} / ${n} doğru</p>
      <p class="muted">Üniteyi geçmek için en az <b>${need} doğru</b> gerekiyor. Dersi bir kez daha gözden geçir, sonra testi tekrar çöz. 💛</p>
      ${isDone(u.uid)?`<p class="muted">Bu üniteyi daha önce geçmiştin; tamamlanmış olarak kalıyor.</p>`:""}</div>
      <div class="card"><button class="btn btn-primary" data-act="startQuiz" data-uid="${u.uid}" data-kind="${ctx.mode}">🔁 Testi Tekrar Çöz</button>
      <button class="btn btn-accent" data-act="openUnit" data-uid="${u.uid}">📖 Dersi Tekrar Gözden Geçir</button>
      <button class="btn btn-soft" data-act="goHome">Ana Sayfa</button></div>`; window.scrollTo(0,0); return; }
  if(unitQuiz){
    firstTime=!isDone(u.uid); const lvWasDone=levelCompleted(u._level);
    if(firstTime){ state.completedLessons.push(u.uid); if(u.type==="vocab"&&u.words) state.wordsLearned+=u.words.length; if(u.type==="grammar") state.grammarLearned+=1; }
    const prev=state.bestScores[u.uid]; if(prev==null||score>prev) state.bestScores[u.uid]=score;
    levelJustDone = !lvWasDone && levelCompleted(u._level);
  }
  if(perfect) state.perfectQuiz=true; saveState(); const newly=checkBadges(); if(perfect||firstTime) confetti(); celebrate(newly);
  // sıradaki ünite önerisi
  let nextU=null;
  let nextLevel=null, nextLevelOpen=false;
  if(u){ const lv=u._level; const idx=lv.units.findIndex(x=>x.uid===u.uid);
    // Seviyede önce bitmemiş sıradaki üniteyi öner, yoksa sıradaki üniteyi
    const after=lv.units.slice(idx+1); nextU=after.find(x=>!isDone(x.uid))||lv.units.find(x=>!isDone(x.uid))||after[0]||null;
    if(!nextU){ const li=LEVELS.indexOf(lv); if(li>=0 && li<LEVELS.length-1){ nextLevel=LEVELS[li+1]; nextLevelOpen=levelUnlocked(li+1); if(nextLevelOpen) nextU=nextLevel.units.find(x=>!isDone(x.uid))||nextLevel.units[0]||null; } } }
  const title = ctx.mode==="leveltest"?"🏁 Seviye Testi Bitti!":(ctx.mode==="mix"?"🔀 Karışık Tekrar Bitti!":(levelJustDone?"🏆 "+esc(u._level.name)+" bitti!":"🎉 Üniteyi tamamladın!"));
  let actions="";
  if(levelJustDone && u) actions+=`<p class="center" style="font-weight:700;color:var(--good);">Tebrikler! Bu seviyenin bütün derslerini bitirdin.${nextLevel?" Sıradaki seviye açıldı.":""}</p>
    <button class="btn btn-accent" data-act="levelTest" data-id="${u._level.id}">📝 ${esc(u._level.cefr)} Seviye Testini Çöz</button>`;
  if(nextU) actions+=`<button class="btn btn-primary" data-act="openUnit" data-uid="${nextU.uid}">▶️ Sıradaki Ders: ${nextU.icon} ${esc(nextU.title)}</button>`;

  if((ctx.mode==="vocab"||ctx.mode==="grammar")&&u) actions+=`<button class="btn btn-soft" data-act="startQuiz" data-uid="${u.uid}" data-kind="${ctx.mode}">🔁 Tekrar Çöz</button>`;
  actions+=`<button class="btn btn-soft" data-act="goHome">Ana Sayfa</button>`;
  app.innerHTML=`${unitQuiz?unitBarHtml(u,"quiz"):""}<div class="card center"><h2>${title}</h2>
    <p style="font-size:24px;font-weight:800;">${score} / ${n} doğru</p>
    ${unitQuiz?`<p class="st-line">✓ Bu ünitenin bütün adımları bitti.</p>`:""}
    <p class="muted">${perfect?"Mükemmel, hepsi doğru! 🌟":(score>=Math.ceil(n*0.6)?"Güzel iş! Biraz daha tekrarla harika olacak.":"Sorun değil — tekrar etmek öğrenmenin yoludur. 💛")}</p>
    ${state.streak>0?`<div class="streak-badge">🔥 ${state.streak} gün seri</div>`:""}</div>
    <div class="card">${actions}</div>`; window.scrollTo(0,0); }

/* ----- YEDEKLE / TAŞI ----- */
const BK_PREFIX="TY1", BK_APP="TY-INGILIZCE", BK_FORMAT=1;
function bkFresh(){ return {code:"", input:"", pending:null, msg:"", msgType:""}; }
let bk=bkFresh();
function bkHash(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(16).padStart(8,"0"); }
function bkB64Enc(str){ const b=new TextEncoder().encode(str); let bin=""; for(let i=0;i<b.length;i+=0x8000) bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(bin); }
function bkB64Dec(b64){ const bin=atob(b64); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return new TextDecoder("utf-8",{fatal:true}).decode(b); }
function bkCurrentState(){ saveState(); return JSON.parse(JSON.stringify(state)); }
function bkEnvelope(){ return {app:BK_APP, format:BK_FORMAT, created:new Date().toISOString(), state:bkCurrentState()}; }
function bkMakeCode(){ const json=JSON.stringify(bkEnvelope()); return BK_PREFIX+":"+bkHash(json)+":"+bkB64Enc(json); }
function bkErr(m){ const e=new Error(m); e.userMsg=m; return e; }
const BK_ERR_BROKEN="Kod eksik veya bozuk görünüyor. Kodun tamamını (baştan sona) kopyalayıp tekrar yapıştır.";
/* Kod ya da dosya metnini çözer, doğrular; {state, created} döner. Hata olursa anlaşılır mesajla fırlatır. */
function bkParse(text){
  let t=String(text||"").trim();
  if(!t) throw bkErr("Önce yedek kodunu yapıştır veya bir yedek dosyası seç.");
  let env;
  if(t.charAt(0)==="{"){ // .json dosyası
    try{ env=JSON.parse(t); }catch(e){ throw bkErr("Bu dosya okunamadı. Uygulamadan indirdiğin yedek dosyasını seç."); }
    if(!env || env.app!==BK_APP) throw bkErr("Bu dosya bu uygulamanın yedeği değil.");
    if(env.checksum && env.state && bkHash(JSON.stringify(env.state))!==env.checksum) throw bkErr("Yedek dosyası bozulmuş veya değiştirilmiş. Yeni bir yedek dosyası indirip tekrar dene.");
  } else {
    t=t.replace(/\s+/g,"");
    const m=/^TY(\d+):([0-9a-f]{8}):([A-Za-z0-9+/=]+)$/i.exec(t);
    if(!m){ if(!/^TY\d+:/i.test(t)) throw bkErr("Bu bir yedek kodu değil. Yedek kodu “TY1:” ile başlar. Kodun tamamını kopyaladığından emin ol."); throw bkErr(BK_ERR_BROKEN); }
    if(+m[1]>BK_FORMAT) throw bkErr("Bu yedek uygulamanın daha yeni bir sürümünden. Önce uygulamayı güncelle (sayfayı yenile), sonra tekrar dene.");
    let json; try{ json=bkB64Dec(m[3]); }catch(e){ throw bkErr(BK_ERR_BROKEN); }
    if(bkHash(json)!==m[2].toLowerCase()) throw bkErr(BK_ERR_BROKEN);
    try{ env=JSON.parse(json); }catch(e){ throw bkErr(BK_ERR_BROKEN); }
  }
  if(!env || typeof env!=="object") throw bkErr(BK_ERR_BROKEN);
  if((env.format||1)>BK_FORMAT) throw bkErr("Bu yedek uygulamanın daha yeni bir sürümünden. Önce uygulamayı güncelle (sayfayı yenile), sonra tekrar dene.");
  const s=env.state;
  const okLang=o=>o && typeof o==="object" && (!("completedLessons" in o) || Array.isArray(o.completedLessons));
  if(!s || typeof s!=="object" || Array.isArray(s) || !s.langStore || typeof s.langStore!=="object"
     || !Object.keys(s.langStore).every(k=>okLang(s.langStore[k]))
     || ("studyDates" in s && !Array.isArray(s.studyDates)))
    throw bkErr("Bu yedeğin içinde ilerleme bilgisi bulunamadı.");
  return {state:s, created:env.created||null};
}
/* Geri yüklenecek durumu uygulamanın açılışta kullandığı normalizasyondan geçirir. */
function bkNormalize(raw){ const s=normalizeState(JSON.parse(JSON.stringify(raw)));
  const arr=v=>Array.isArray(v)?v:[], obj=v=>(v&&typeof v==="object"&&!Array.isArray(v))?v:{};
  Object.keys(s.langStore).forEach(k=>{ const o=Object.assign(defaultLangData(), obj(s.langStore[k]));
    o.completedLessons=arr(o.completedLessons); o.reviewWords=arr(o.reviewWords); o.dictLearned=arr(o.dictLearned); o.earnedBadges=arr(o.earnedBadges);
    o.bestScores=obj(o.bestScores); o.unlocks=obj(o.unlocks); o.wordsLearned=+o.wordsLearned||0; o.grammarLearned=+o.grammarLearned||0; o.perfectQuiz=!!o.perfectQuiz;
    s.langStore[k]=o; });
  s.studyDates=arr(s.studyDates).filter(d=>typeof d==="string");
  if(s.lang && !LANGS[s.lang]) s.lang=null;
  return s; }
function bkStreakOf(dates){ const set=new Set(dates||[]); let n=0, cur=new Date(); if(!set.has(dateKey(cur))) cur=addDays(cur,-1); while(set.has(dateKey(cur))){ n++; cur=addDays(cur,-1); } return n; }
function bkFmtDate(k){ if(!k) return "—"; const p=String(k).slice(0,10).split("-"); return p.length===3?p[2]+"."+p[1]+"."+p[0]:"—"; }
function bkStats(s){ const out={}; Object.keys(LANGS).forEach(l=>{ const o=(s.langStore&&s.langStore[l])||{};
    out[l]={units:(o.completedLessons||[]).length, words:(+o.wordsLearned||0)+((o.dictLearned||[]).length)}; });
  const dates=(s.studyDates||[]).slice().sort();
  return {langs:out, streak:bkStreakOf(dates), last:dates[dates.length-1]||null}; }
function bkCompareHtml(p){ const a=bkStats(bkCurrentState()), b=bkStats(p.state);
  const langs=Object.keys(LANGS).filter(l=>a.langs[l].units||a.langs[l].words||b.langs[l].units||b.langs[l].words);
  if(!langs.length) langs.push("en");
  const row=(lbl,x,y)=>`<tr><td style="padding:6px 4px;">${lbl}</td><td style="padding:6px 4px;text-align:center;">${x}</td><td style="padding:6px 4px;text-align:center;font-weight:700;">${y}</td></tr>`;
  let rows="";
  langs.forEach(l=>{ rows+=`<tr><td colspan="3" style="padding:8px 4px 2px;font-weight:700;">${flag(l,true)} ${esc(LANGS[l].name)}</td></tr>`
    +row("Bitirilen ünite",a.langs[l].units,b.langs[l].units)+row("Öğrenilen kelime",a.langs[l].words,b.langs[l].words); });
  rows+=row("Seri (gün)",a.streak,b.streak)+row("Son çalışma",bkFmtDate(a.last),bkFmtDate(b.last));
  return `<table style="width:100%;border-collapse:collapse;margin:8px 0;">
    <tr style="border-bottom:1px solid var(--line);"><th></th><th style="padding:6px 4px;">Bu cihazda</th><th style="padding:6px 4px;">Yedekte</th></tr>${rows}</table>`; }
function backupSectionHtml(){
  const ta="width:100%;padding:12px;font-size:15px;border:2px solid var(--line);border-radius:14px;margin:6px 0 10px;font-family:monospace;word-break:break-all;background:var(--card);color:inherit;";
  const msg=bk.msg?`<div class="feedback ${bk.msgType==="good"?"good":"bad"}" id="bkMsg" role="alert" style="margin:8px 0;">${esc(bk.msg)}</div>`:"";
  if(bk.pending){

    <p class="muted">İlerlemen sadece bu cihazda saklanır. Telefondan bilgisayara (ya da tersi) taşımak için burada yedek al, diğer cihazda “Yedeği geri yükle” bölümüne yapıştır.</p>
    <button class="btn btn-primary" data-act="bkMake">🔑 Yedek kodu oluştur</button>
    ${bk.code?`<textarea id="bkCode" readonly rows="4" style="${ta}" aria-label="Yedek kodu">${esc(bk.code)}</textarea>
      <button class="btn btn-accent" data-act="bkCopy">📋 Kopyala</button>
      <p class="muted">Kopyaladıktan sonra kendine WhatsApp'tan veya e-postayla gönderebilirsin.</p>`:""}
    <button class="btn btn-soft" data-act="bkDownload">💾 Dosya olarak indir</button>
    <label class="set-lbl" style="margin-top:16px;">Yedeği geri yükle</label>
    <p class="muted">Diğer cihazda aldığın kodu aşağıya yapıştır ya da yedek dosyasını seç.</p>
    <textarea id="bkInput" rows="3" style="${ta}" placeholder="Yedek kodunu buraya yapıştır (TY1: ile başlar)" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(bk.input)}</textarea>
    ${msg}
    <button class="btn btn-accent" data-act="bkCheck">📥 Kodu yükle</button>
    <label class="btn btn-ghost" style="cursor:pointer;">📂 Yedek dosyası seç<input type="file" id="bkFile" accept=".json,application/json,text/plain" style="display:none;"></label></div>`;
}
function bkRefresh(focusSel){ const box=document.getElementById("bkBox"); if(!box){ renderSettings(); return; }
  box.outerHTML=backupSectionHtml(); const nb=document.getElementById("bkBox");
  const f=focusSel&&document.querySelector(focusSel); (f||nb).scrollIntoView({block:"center"}); }
function bkTry(text){ const inp=document.getElementById("bkInput"); if(inp) bk.input=inp.value;
  try{ bk.pending=bkParse(text); bk.msg=""; }catch(e){ bk.pending=null; bk.msg=e.userMsg||BK_ERR_BROKEN; bk.msgType="bad"; }
  bkRefresh(bk.pending?null:"#bkMsg"); }
function bkApply(){ if(!bk.pending) return;
  state=bkNormalize(bk.pending.state);
  if(state.lang){ setLanguage(state.lang,{skipSaveOld:true}); }
  else { LEVELS=LANGS.en.levels; DICTIONARY_EXTRA=LANGS.en.dictExtra; indexCurriculum(); }
  state.streak=computeStreak(); saveState(); applySettings();
  bk=bkFresh(); showToast("Yedek yüklendi ✓");
  if(state.lang) goHome(); else renderLangPicker(); }
function bkCopy(){ const ta=document.getElementById("bkCode"); if(!ta) return;
  const manual=()=>{ ta.focus(); ta.select(); try{ ta.setSelectionRange(0,ta.value.length); }catch(e){}
    let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    showToast(ok?"Kod kopyalandı ✓":"Kod seçildi. Basılı tutup “Kopyala”ya dokun."); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(()=>showToast("Kod kopyalandı ✓"), manual); }
  else manual(); }
function bkDownload(){ const st=bkCurrentState();
  const env={app:BK_APP, format:BK_FORMAT, created:new Date().toISOString(), checksum:bkHash(JSON.stringify(st)), state:st};
  const name="ty-ingilizce-yedek-"+dateKey()+".json";
  try{ const url=URL.createObjectURL(new Blob([JSON.stringify(env,null,1)],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); showToast("Yedek dosyası indirildi: "+name);
  }catch(e){ showToast("Dosya indirilemedi. “Yedek kodu oluştur”u kullan."); } }
function bkReadFile(input){ const f=input.files&&input.files[0]; if(!f) return;
  if(f.size>5*1024*1024){ bk.msg="Bu dosya çok büyük; yedek dosyası değil."; bk.msgType="bad"; bkRefresh("#bkMsg"); return; }
  const r=new FileReader(); r.onload=()=>bkTry(String(r.result||""));
  r.onerror=()=>{ bk.msg="Dosya okunamadı. Tekrar dene."; bk.msgType="bad"; bkRefresh("#bkMsg"); };
  r.readAsText(f); input.value=""; }

const DICT_CATS=["Selamlaşma","Sayılar & Renkler","Aile","Vücut","Hayvanlar","Doğa & Hava","Yiyecek","Ev","Zaman","Fiiller","Sıfatlar","Şehir","Diğer"];

function dictFind(en){ return DICT.find(x=>x.en===en); }
// Aramada büyük/küçük harf ve Türkçe karakter farkını yok say (İ/ı/i, ş/s, ç/c, ğ/g, ö/o, ü/u; İtalyanca aksanlar)
function fold(s){ return String(s||"").replace(/[İIı]/g,"i").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ş/g,"s").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function dictFiltered(){ let a=DICT.slice();
  if(dictState.cat!=="Tümü") a=a.filter(w=>w.cat===dictState.cat);
  const q=fold(dictState.q);
  if(q) a=a.filter(w=>fold(w.en).includes(q)||fold(w.tr).includes(q));
  return a; }

    case "noteDel": notesDelKey=d.key; renderNotes(true); break;

    case "noteDelYes": noteDelete(d.key); notesDelKey=null; renderNotes(true); showToast("Not silindi."); break;
    case "notesToggle": npToggleCompact(); break;
    case "hwToggle": npTogglePad(); break;
    case "hwLang": npSetLang(d.lang); break;
    case "hwUndo": npUndoStroke(); break;
    case "hwClear": npClearPad(); break;
    case "hwNewline": npNewline(); break;
    case "hwConvert": npConvert(false); break;
    case "hwAlt": npPickAlt(+d.i); break;
    case "hwUndoInsert": npUndoInsert(); break;
    case "resetAll": if(confirm("Tüm ilerleme silinsin mi? Geri alınamaz.")){ const keepLang=state.lang||"en", keepSet=state.settings; state=defaultState(); state.settings=keepSet; setLanguage(keepLang,{skipSaveOld:true}); state.streak=0; saveState(); applySettings(); showToast("Sıfırlandı."); goHome(); } break;
  }
});
document.addEventListener("keydown",(e)=>{ if((e.key==="Enter"||e.key===" ") && e.target && e.target.matches && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); } });
document.addEventListener("input",(e)=>{ if(e.target && e.target.id==="dictSearch"){ dictState.q=e.target.value; updateDictList(); } });
document.addEventListener("change",(e)=>{ if(e.target && e.target.id==="bkFile") bkReadFile(e.target); });

/* ===== BAŞLAT ===== */
if(state.lang && !LANGS[state.lang]) state.lang=null;
try{ if(history.state && history.state.inner) history.replaceState(null,""); }catch(e){}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
if(state.lang){ setLanguage(state.lang, {skipSaveOld:true}); }
else { LEVELS=LANGS.en.levels; DICTIONARY_EXTRA=LANGS.en.dictExtra; indexCurriculum(); }
state.streak=computeStreak(); saveState();
applySettings();
try{ new MutationObserver(updateHeader).observe(app,{childList:true}); }catch(e){}
if(state.lang){ renderHome(); } else { renderLangPicker(); }
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
