<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4F7CAC" />
<meta name="color-scheme" content="light" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="TY İngilizce" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>TY İngilizce</title>
<style>
  :root{
    --bg:#F7F4EF; --primary:#44709e; --primary-dark:#3c5f87;
    --accent:#F2C14E; --accent-dark:#d9a52f; --text:#222222; --card:#ffffff;
    --good:#2e9e5b; --good-bg:#e7f6ec; --bad:#c0392b; --bad-bg:#fbe9e8;
    --muted:#626262; --line:#ece6dc; --shadow:0 6px 18px rgba(60,50,30,.10);
    --radius:18px; --fs:19px; --k:1; --focus:#1f4e80;
    color-scheme:light;
    --l1:#4F7CAC; --l2:#2e9e5b; --l3:#9b59b6;
    --l1d:#3c5f87; --l2d:#237a46; --l3d:#7d3f9a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
    background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden;}
  button,input,[data-act]{touch-action:manipulation;}
  button,input,textarea,select{font-family:inherit;color:var(--text);}
  input,textarea,select{background:#fff;}
  /* Klavye ile gezinmede her yerde görünür odak halkası */
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .btn:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.opt:focus-visible,.speak:focus-visible,.reveal-btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
  input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:0;border-color:var(--primary) !important;}
  /* Bayraklar: Windows bayrak emojisi göstermediği için satır içi SVG */
  .flag{display:inline-block;width:1.4em;height:.95em;border-radius:3px;overflow:hidden;vertical-align:-0.12em;box-shadow:0 0 0 1px rgba(0,0,0,.18);flex:0 0 auto;line-height:0;}
  .flag svg{display:block;width:100%;height:100%;}
  .wrap{max-width:720px;margin:0 auto;
    padding:14px max(16px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));}
  /* Başlık çentiğin altında kalmasın: yapışınca durum çubuğu alanını da kaplar */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-14px 0 14px;
    position:sticky;top:0;background:var(--bg);z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px;border-bottom:1px solid var(--line);}
  header.top h1{font-size:20px;margin:0;color:var(--primary-dark);min-width:0;line-height:1.2;display:flex;align-items:center;gap:8px;}
  header.top h1 .h1-logo{display:inline-flex;align-items:center;justify-content:center;background:var(--primary-dark);color:#fff;border-radius:9px;font-size:14px;font-weight:800;padding:4px 7px;letter-spacing:.5px;flex:0 0 auto;}
  header.top h1 .h1-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .top-actions{display:flex;gap:6px;flex:0 0 auto;}
  .icon-btn{background:#fff;border:2px solid var(--line);color:var(--primary-dark);border-radius:12px;
    padding:8px 12px;font-size:16px;cursor:pointer;font-weight:600;min-width:44px;min-height:44px;}
  .top-actions .icon-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 6px;min-width:52px;line-height:1.1;}
  .top-actions .icon-btn .ib-lbl{font-size:12px;font-weight:700;white-space:nowrap;}
  .top-actions .icon-btn .ib-ico{font-size:17px;line-height:1.2;height:20px;display:flex;align-items:center;}
  .icon-btn:hover{border-color:var(--primary);}
  .icon-btn[aria-current="page"]{border-color:var(--primary);background:#eef2f6;}
  .hidden{display:none !important;}

  .card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
  h2{font-size:calc(25px*var(--k));margin:0 0 12px;color:var(--primary-dark);}
  h3{font-size:calc(20px*var(--k));margin:0 0 8px;}
  p{margin:0 0 12px;}
  .muted{color:var(--muted);font-size:.88em;}
  .center{text-align:center;}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;
    padding:16px 20px;font-size:calc(20px*var(--k));font-weight:700;cursor:pointer;width:100%;margin-top:8px;transition:transform .06s ease, filter .15s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#3a2e00;}
  .btn-accent:hover{background:var(--accent-dark);}
  .btn-soft{background:#eef2f6;color:var(--primary-dark);}
  .btn-soft:hover{background:#e2e9f0;}
  .btn-ghost{background:transparent;border:2px solid var(--line);color:var(--primary-dark);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  .lang-choices{display:grid;gap:12px;margin:14px 0 4px;}
  .lang-choice{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text);font-size:calc(20px*var(--k));font-weight:800;min-height:64px;}
  .lang-choice:hover{border-color:var(--primary);background:#f7fafd;}
  .lang-choice.current{border-color:var(--primary);background:#eef4fa;}
  .lang-choice .flag{font-size:calc(30px*var(--k));border-radius:5px;}
  .lang-choice .lc-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;}
  .lang-choice .lc-sub{font-size:calc(15px*var(--k));font-weight:600;color:var(--muted);}
  .lang-choice .lc-go{color:var(--primary-dark);font-size:calc(15px*var(--k));font-weight:700;white-space:nowrap;}
  .btn-row .btn{flex:1;min-width:130px;}

  .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{flex:1;min-width:84px;background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow);}
  .stat .num{font-size:calc(28px*var(--k));font-weight:800;color:var(--primary);}
  .stat .lbl{font-size:calc(13px*var(--k));color:var(--muted);}
  .streak-badge{background:var(--accent);color:#3a2e00;border-radius:12px;padding:10px 16px;display:inline-block;font-weight:800;font-size:calc(18px*var(--k));}

  .week{display:flex;gap:6px;justify-content:space-between;margin-top:6px;}
  .day{flex:1;text-align:center;}
  .day .dot{width:38px;height:38px;border-radius:50%;margin:4px auto 2px;display:flex;align-items:center;justify-content:center;background:#eef2f6;color:var(--muted);font-size:calc(18px*var(--k));font-weight:700;}
  .day .dot.on{background:var(--good);color:#fff;}
  .day .dot.today{outline:3px solid var(--accent);}
  .day .lbl{font-size:calc(12px*var(--k));color:var(--muted);}

  /* level card */
  .level-card{border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);background:#fff;border-top:6px solid var(--primary);}
  .level-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .level-head .lv-title{font-size:calc(21px*var(--k));font-weight:800;color:var(--primary-dark);}
  .cefr{font-size:calc(13px*var(--k));font-weight:800;color:#fff;background:var(--primary);border-radius:999px;padding:3px 10px;}
  .lv-prog{font-size:calc(14px*var(--k));color:var(--muted);margin-left:auto;}
  .locked-note{background:#fff7e6;border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:calc(15px*var(--k));color:#7a5a00;}

  .unit-list{list-style:none;padding:0;margin:10px 0 0;}
  .unit-item{display:flex;align-items:center;gap:12px;background:#fbf9f5;border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer;border:2px solid transparent;}
  .unit-item:hover{border-color:var(--primary);}
  .unit-ico{font-size:calc(24px*var(--k));flex:0 0 auto;width:38px;text-align:center;}
  .unit-meta{flex:1;min-width:0;overflow-wrap:break-word;}
  .unit-meta .t{font-weight:700;font-size:calc(17px*var(--k));}
  .type-tag{font-size:calc(12px*var(--k));font-weight:700;border-radius:999px;padding:2px 8px;margin-right:6px;}
  .type-tag.g{background:#efe6f7;color:#6f3fa0;}
  .type-tag.v{background:#e6eef7;color:#34618c;}
  .badge-score{font-size:calc(12px*var(--k));background:var(--good-bg);color:#1d7a42;border-radius:999px;padding:2px 8px;font-weight:700;}
  .check{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:flex;align-items:center;justify-content:center;background:#eef2f6;color:var(--muted);font-size:calc(16px*var(--k));font-weight:700;}
  .check.done{background:var(--good);color:#fff;}

  /* grammar */
  .gtable{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:calc(17px*var(--k));}
  .gtable th,.gtable td{border:1px solid var(--line);padding:9px 10px;text-align:left;}
  .gtable th{background:#eef2f6;color:var(--primary-dark);}
  .rule-box{background:#f3f7fb;border-left:5px solid var(--primary);border-radius:10px;padding:12px 14px;margin:8px 0 12px;font-size:calc(17px*var(--k));}
  .ex-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .ex-row:last-child{border-bottom:none;}
  .ex-main{flex:1;min-width:0;overflow-wrap:break-word;}
  .ex-en{font-weight:700;font-size:calc(18px*var(--k));}
  .ex-tr{color:var(--primary-dark);font-size:calc(15px*var(--k));}

  /* word rows */
  .word-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .word-row:last-child{border-bottom:none;}
  .word-main{flex:1;min-width:0;overflow-wrap:break-word;}
  .word-en{font-size:calc(21px*var(--k));font-weight:700;}
  .word-tr{font-size:calc(17px*var(--k));color:var(--primary-dark);}
  .word-ex{font-size:calc(15px*var(--k));color:var(--muted);margin-top:2px;}
  .speak{flex:0 0 auto;width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);font-size:calc(24px*var(--k));cursor:pointer;}
  .speak:active{transform:scale(.94);}
  .speak.sm{width:46px;height:46px;font-size:calc(20px*var(--k));}

  /* flashcard */
  .flash{perspective:1200px;margin:10px 0 4px;}
  .flash-inner{position:relative;display:grid;width:100%;min-height:220px;cursor:pointer;transition:transform .55s;transform-style:preserve-3d;}
  .flash.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-face{grid-area:1/1;position:relative;min-height:220px;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow-wrap:break-word;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius);padding:20px;text-align:center;}
  .flash-front{background:var(--primary);color:#fff;}
  .flash-back{background:var(--accent);color:#3a2e00;transform:rotateY(180deg);}
  .flash-face .big{font-size:calc(34px*var(--k));font-weight:800;}
  .flash-face .sub{font-size:calc(17px*var(--k));margin-top:12px;opacity:.96;}
  .flash-hint{text-align:center;color:var(--muted);font-size:calc(15px*var(--k));margin:8px 0 12px;}
  .counter{text-align:center;color:var(--muted);font-size:calc(16px*var(--k));margin-bottom:8px;}

  /* quiz */
  .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:2px solid #dfe5ec;border-radius:14px;padding:15px 16px;font-size:calc(19px*var(--k));margin-bottom:11px;cursor:pointer;}
  .opt:hover{border-color:var(--primary);}
  .opt.correct{background:var(--good-bg);border-color:var(--good);}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);}
  .opt{color:var(--text);}
  .opt:disabled{cursor:default;color:var(--text);opacity:1;}
  .opt:disabled:not(.correct):not(.wrong){opacity:.7;}
  .feedback{border-radius:14px;padding:14px;margin-top:6px;font-size:calc(17px*var(--k));}
  .feedback.good{background:var(--good-bg);color:#1d7a42;}
  .feedback.bad{background:var(--bad-bg);color:#a8312d;}
  .progressbar{background:#e7e1d7;border-radius:999px;height:14px;overflow:hidden;margin:10px 0;}
  .progressbar > span{display:block;height:100%;background:var(--accent);width:0;transition:width .35s;}

  .empty{color:var(--muted);text-align:center;padding:22px 0;}
  .review-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);}

  .badges{display:flex;flex-wrap:wrap;gap:10px;}
  .badge{flex:1 1 140px;background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow);opacity:.45;filter:grayscale(1);}
  .badge.on{opacity:1;filter:none;border:2px solid var(--accent);}
  .badge .b-ico{font-size:calc(34px*var(--k));}
  .badge .b-name{font-weight:700;font-size:calc(15px*var(--k));margin-top:4px;}
  .badge .b-desc{font-size:calc(13px*var(--k));color:var(--muted);}

  .seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px;}
  .seg button{flex:1;min-width:90px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:calc(16px*var(--k));cursor:pointer;font-weight:600;}
  .seg button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  label.set-lbl{font-weight:700;display:block;margin-top:8px;}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:14px 20px;border-radius:14px;box-shadow:var(--shadow);font-size:calc(17px*var(--k));opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:92%;text-align:center;}
  .toast.show{opacity:1;}
  .mic-state{border-radius:14px;padding:14px;margin-top:8px;font-size:calc(17px*var(--k));background:#eef2f6;color:var(--primary-dark);}
  .mic-state.listening{background:#fff4d6;color:#7a5a00;}
  .pulse{animation:pulse 1s infinite;}
  @keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
  .confetti{position:fixed;top:-12px;width:10px;height:16px;z-index:70;border-radius:2px;pointer-events:none;}
  .tip{background:#fff8e6;border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:12px 0 4px;font-size:calc(16px*var(--k));color:#6b5300;}
  .tip b{color:#7a5a00;}
  .goal{background:#eef5ff;border-left:5px solid var(--primary);border-radius:10px;padding:10px 14px;margin:6px 0;font-size:calc(16px*var(--k));}
  .stepper{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  button.step{border:2px solid transparent;cursor:pointer;min-height:44px;font-family:inherit;line-height:1.3;}
  button.step:hover{border-color:var(--primary);}
  button.step:focus-visible{border-color:var(--primary);outline:3px solid var(--primary);outline-offset:2px;}
  .stepper-hint{font-size:calc(13px*var(--k));color:var(--muted);margin-top:6px;text-align:center;}
  .dict-item{flex-direction:column;align-items:stretch;gap:8px;}
  .dict-actions{display:flex;gap:6px;}
  .dict-actions button{flex:1 1 0;min-width:0;line-height:1.2;min-height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--primary-dark);font-weight:700;font-size:calc(14px*var(--k));cursor:pointer;font-family:inherit;padding:6px 2px;}
  .dict-actions button.on{background:var(--good-bg);border-color:var(--good);color:#1d7a42;}
  .dict-actions button:focus-visible,.unit-item:focus-visible{outline:3px solid var(--primary);outline-offset:2px;}
  .daily{background:#fff8e6;border:2px solid var(--accent);border-radius:14px;padding:12px 14px;margin-top:10px;}
  .daily b{color:#7a5a00;}
  .step{flex:1;min-width:64px;background:#eef2f6;border-radius:12px;padding:8px 4px;text-align:center;font-size:calc(13px*var(--k));color:var(--primary-dark);font-weight:700;}
  .step .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;align-items:center;justify-content:center;font-size:calc(13px*var(--k));margin-bottom:3px;}
  /* adım takibi */
  .step.ok{background:var(--good-bg);color:#1d7a42;}
  .step.ok .n{background:var(--good);}
  .step.cur{background:var(--primary);color:#fff;border-color:var(--primary-dark);box-shadow:0 2px 8px rgba(79,124,172,.35);}
  .step.cur .n{background:#fff;color:var(--primary-dark);}
  .step.cur.ok .n{color:var(--good);}
  .step-pos{font-size:calc(14px*var(--k));color:var(--muted);margin-top:10px;}
  .step-pos b{color:var(--primary-dark);}
  .step-note{background:var(--good-bg);color:#1d7a42;border-radius:12px;padding:10px 12px;font-weight:700;font-size:calc(16px*var(--k));margin-bottom:4px;}
  .unit-bar{padding:12px 14px;}
  .unit-bar .ub-title{font-weight:800;color:var(--primary-dark);font-size:calc(17px*var(--k));overflow-wrap:break-word;}
  .unit-bar .step-pos{margin-top:2px;}
  .unit-bar .stepper{margin-top:6px;}
  .st{display:inline-block;font-size:calc(12px*var(--k));font-weight:700;border-radius:999px;padding:2px 8px;margin:2px 6px 0 0;}
  .st-ok{background:var(--good-bg);color:#1d7a42;}
  .st-bad{background:var(--bad-bg);color:#a8312d;}
  .st-go{background:#e6eef7;color:#34618c;}
  .st-new{background:#f1eee8;color:var(--muted);}
  .st-next{background:var(--accent);color:#3a2e00;}
  .st-line{font-size:calc(16px*var(--k));color:var(--primary-dark);margin:4px 0 8px;}
  .u-tags{display:flex;flex-wrap:wrap;align-items:center;}
  .u-tags .type-tag{margin-top:2px;}
  .unit-item.is-next{border-color:var(--accent);background:#fffaf0;}
  .check.part{background:#e6eef7;color:#34618c;font-size:calc(11px*var(--k));border:2px solid var(--primary);}
  .check.retry{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad);}
  .lv-bar{background:#e7e1d7;border-radius:999px;height:10px;overflow:hidden;margin:10px 0 2px;}
  .lv-bar > span{display:block;height:100%;border-radius:999px;min-width:0;}
  .lv-done{color:var(--good);font-weight:700;font-size:calc(15px*var(--k));margin:6px 0 0;}
  .continue-card{border:2px solid var(--primary);}
  .continue-card .stepper{margin-bottom:4px;}
  .ezber{background:#f5f9fc;border:2px dashed var(--primary);border-radius:14px;padding:14px;margin-bottom:11px;}
  .ezber .ez-top{display:flex;align-items:center;gap:10px;}
  .ezber .en{font-size:calc(23px*var(--k));font-weight:800;flex:1;min-width:0;overflow-wrap:break-word;line-height:1.25;}
  .reveal-btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:calc(15px*var(--k));cursor:pointer;font-weight:700;white-space:nowrap;min-height:44px;flex:0 0 auto;}
  .reveal-btn:active{transform:scale(.97);}
  .reveal-box{margin-top:10px;}
  footer{text-align:center;color:var(--muted);font-size:calc(14px*var(--k));margin-top:24px;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0 12px;}
  .table-scroll .gtable{margin:0;}
  .seg.chips{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
  .seg.chips button{flex:0 0 auto;min-width:0;white-space:nowrap;}
  .review-item .icon-btn{flex:0 0 auto;}
  .quiz-exit{margin-top:4px;}
  @media (max-width:480px){ header.top h1{font-size:15px;gap:6px;} header.top h1 .h1-logo{font-size:12px;padding:3px 6px;} .flash-face .big{font-size:calc(30px*var(--k));} .icon-btn{padding:8px 10px;font-size:15px;} .top-actions{gap:4px;} .top-actions .icon-btn{padding:4px 3px;min-width:46px;} .top-actions .icon-btn .ib-lbl{font-size:11px;} }
  @media (max-width:400px){ header.top h1 .h1-name{display:none;} }
  /* Masaüstü / geniş pencere: daha geniş sütun, daha sakin düğmeler, iki sütunlu ünite listesi */

    {en:"Buonasera", tr:"İyi akşamlar", ex:"Buonasera a tutti.", exTr:"Herkese iyi akşamlar."},
    {en:"Arrivederci", tr:"Hoşça kal / Görüşürüz", ex:"Arrivederci!", exTr:"Görüşürüz!"},
    {en:"Come stai?", tr:"Nasılsın?", ex:"Ciao, come stai?", exTr:"Merhaba, nasılsın?"},
    {en:"Sto bene", tr:"İyiyim", ex:"Sto bene, grazie.", exTr:"İyiyim, teşekkürler."}
  ]},
  {uid:"it1-2", type:"grammar", icon:"📖", title:"Gramer: essere (olmak)",
    intro:"İtalyancada 'olmak' fiili essere'dir. Özneye göre değişir.",
    rule:"io <b>sono</b>, tu <b>sei</b>, lui/lei <b>è</b>, noi <b>siamo</b>, voi <b>siete</b>, loro <b>sono</b>. Örnek: \"Io <b>sono</b> felice\" = \"Ben mutluyum\".",
    structure:[["Özne","Fiil","Örnek"],["io (ben)","sono","Io sono Deniz"],["tu (sen)","sei","Tu sei gentile"],["lui/lei (o)","è","Lei è felice"],["noi (biz)","siamo","Noi siamo qui"],["voi (siz)","siete","Voi siete pronti"],["loro (onlar)","sono","Loro sono qui"]],
    examples:[{en:"Io sono Deniz.",tr:"Ben Deniz'im."},{en:"Tu sei gentile.",tr:"Sen naziksin."},{en:"Lei è felice.",tr:"O mutlu."},{en:"Noi siamo qui.",tr:"Biz buradayız."}],
    exercises:[
      {q:"Io ___ Deniz.", options:["sono","sei","è"], answer:"sono", explain:"io ile 'sono'."},
      {q:"Tu ___ gentile.", options:["sei","sono","è"], answer:"sei", explain:"tu ile 'sei'."},
      {q:"Lei ___ felice.", options:["è","sei","sono"], answer:"è", explain:"lui/lei ile 'è'."},
      {q:"Noi ___ qui.", options:["siamo","siete","sono"], answer:"siamo", explain:"noi ile 'siamo'."}
    ]},
  {uid:"it1-3", type:"vocab", icon:"🤝", title:"Tanışma", desc:"Kendini tanıtma.", words:[
    {en:"Mi chiamo Deniz", tr:"Benim adım Deniz", ex:"Ciao, mi chiamo Deniz.", exTr:"Merhaba, benim adım Deniz."},
    {en:"Come ti chiami?", tr:"Adın ne?", ex:"Come ti chiami?", exTr:"Adın ne?"},
    {en:"Piacere", tr:"Memnun oldum", ex:"Piacere!", exTr:"Memnun oldum!"},
    {en:"Vengo dalla Turchia", tr:"Türkiye'denim", ex:"Vengo dalla Turchia.", exTr:"Türkiye'den geliyorum."},
    {en:"Grazie", tr:"Teşekkür ederim", ex:"Grazie mille!", exTr:"Çok teşekkürler!"},
    {en:"Prego", tr:"Rica ederim / Buyurun", ex:"Prego!", exTr:"Rica ederim!"}
  ]},
  {uid:"it1-4", type:"grammar", icon:"📖", title:"Gramer: Belirli artikeller (il / la)",
    intro:"İtalyancada isimlerin cinsiyeti vardır: eril ve dişil. Artikel buna göre değişir.",
    rule:"Eril tekil: genelde <b>il</b> (il libro = kitap). Dişil tekil: <b>la</b> (la casa = ev). Sesli harfle başlayan isimden önce <b>l'</b> (l'amico).",
    structure:[["Tür","Artikel","Örnek"],["Eril","il","il libro (kitap)"],["Dişil","la","la casa (ev)"],["Sesli ile başlayan","l'","l'amico (arkadaş)"]],
    examples:[{en:"il libro",tr:"kitap"},{en:"la casa",tr:"ev"},{en:"la pizza",tr:"pizza"},{en:"il caffè",tr:"kahve"}],
    exercises:[
      {q:"___ libro (eril)", options:["il","la","lo"], answer:"il", explain:"Eril tekil: il."},
      {q:"___ casa (dişil)", options:["la","il","lo"], answer:"la", explain:"Dişil tekil: la."},
      {q:"___ pizza (dişil)", options:["la","il","le"], answer:"la", explain:"pizza dişil: la pizza."},
      {q:"___ caffè (eril)", options:["il","la","le"], answer:"il", explain:"caffè eril: il caffè."}
    ]},
  {uid:"it1-5", type:"vocab", icon:"🔢", title:"Sayılar", desc:"1-10 arası sayılar.", words:[
    {en:"Uno", tr:"Bir", ex:"Ho un libro.", exTr:"Bir kitabım var."},
    {en:"Due", tr:"İki", ex:"Due caffè, per favore.", exTr:"İki kahve, lütfen."},
    {en:"Tre", tr:"Üç", ex:"Tre amici.", exTr:"Üç arkadaş."},
    {en:"Quattro", tr:"Dört", ex:"Quattro giorni.", exTr:"Dört gün."},
    {en:"Cinque", tr:"Beş", ex:"Cinque minuti.", exTr:"Beş dakika."},
    {en:"Dieci", tr:"On", ex:"Dieci euro.", exTr:"On euro."}
  ]},
  {uid:"it1-6", type:"vocab", icon:"🎨", title:"Renkler", desc:"Temel renkler.", words:[
    {en:"Rosso",tr:"Kırmızı",ex:"Il libro è rosso.",exTr:"Kitap kırmızı."},
    {en:"Blu",tr:"Mavi",ex:"Il cielo è blu.",exTr:"Gökyüzü mavi."},
    {en:"Verde",tr:"Yeşil",ex:"L'erba è verde.",exTr:"Çimen yeşil."},
    {en:"Giallo",tr:"Sarı",ex:"Il sole è giallo.",exTr:"Güneş sarı."},
    {en:"Bianco",tr:"Beyaz",ex:"Il latte è bianco.",exTr:"Süt beyaz."},
    {en:"Nero",tr:"Siyah",ex:"Il caffè è nero.",exTr:"Kahve siyah."}
  ]},
  {uid:"it1-7", type:"grammar", icon:"📖", title:"Gramer: avere (sahip olmak)",
    intro:"'Sahip olmak' fiili: avere. 'Bir ...'m var' demek için kullanılır.",
    rule:"io <b>ho</b>, tu <b>hai</b>, lui/lei <b>ha</b>, noi <b>abbiamo</b>, voi <b>avete</b>, loro <b>hanno</b>. Örnek: \"Io <b>ho</b> un cane\" = \"Bir köpeğim var\".",
    structure:[["Özne","Fiil","Örnek"],["io","ho","Io ho un libro"],["tu","hai","Tu hai una casa"],["lui/lei","ha","Lei ha un gatto"],["noi","abbiamo","Noi abbiamo tempo"],["voi","avete","Voi avete ragione"],["loro","hanno","Loro hanno fame"]],
    examples:[{en:"Io ho un cane.",tr:"Bir köpeğim var."},{en:"Lei ha un gatto.",tr:"Onun bir kedisi var."},{en:"Noi abbiamo tempo.",tr:"Zamanımız var."},{en:"Loro hanno fame.",tr:"Onlar aç."}],
    exercises:[
      {q:"Io ___ un libro.", options:["ho","hai","ha"], answer:"ho", explain:"io ile 'ho'."},
      {q:"Tu ___ una casa.", options:["hai","ho","ha"], answer:"hai", explain:"tu ile 'hai'."},
      {q:"Lei ___ un gatto.", options:["ha","hai","ho"], answer:"ha", explain:"lui/lei ile 'ha'."},
      {q:"Noi ___ tempo.", options:["abbiamo","avete","hanno"], answer:"abbiamo", explain:"noi ile 'abbiamo'."}
    ]},
  {uid:"it1-8", type:"vocab", icon:"👨‍👩‍👧", title:"Aile", desc:"Aile bireyleri.", words:[
    {en:"Madre",tr:"Anne",ex:"Mia madre è qui.",exTr:"Annem burada."},
    {en:"Padre",tr:"Baba",ex:"Mio padre lavora.",exTr:"Babam çalışıyor."},
    {en:"Sorella",tr:"Kız kardeş",ex:"Ho una sorella.",exTr:"Bir kız kardeşim var."},
    {en:"Fratello",tr:"Erkek kardeş",ex:"Ho un fratello.",exTr:"Bir erkek kardeşim var."},
    {en:"Figlio",tr:"Oğul",ex:"Mio figlio è piccolo.",exTr:"Oğlum küçük."},
    {en:"Figlia",tr:"Kız evlat",ex:"Mia figlia è felice.",exTr:"Kızım mutlu."}
  ]},
  {uid:"it1-9", type:"vocab", icon:"💬", title:"Temel İfadeler", desc:"Günlük hayatta çok kullanılan kalıplar.", words:[
    {en:"Grazie mille",tr:"Çok teşekkürler",ex:"Grazie mille!",exTr:"Çok teşekkürler!"},
    {en:"Prego",tr:"Rica ederim / Buyurun",ex:"Prego!",exTr:"Rica ederim!"},
    {en:"Mi scusi",tr:"Affedersiniz",ex:"Mi scusi, dov'è il bagno?",exTr:"Affedersiniz, tuvalet nerede?"},
    {en:"Non capisco",tr:"Anlamıyorum",ex:"Scusa, non capisco.",exTr:"Pardon, anlamıyorum."},
    {en:"Ho capito",tr:"Anladım",ex:"Sì, ho capito.",exTr:"Evet, anladım."},
    {en:"Quanto costa?",tr:"Ne kadar? / Kaç para?",ex:"Quanto costa questo?",exTr:"Bu ne kadar?"},
    {en:"Va bene",tr:"Tamam / Olur",ex:"Va bene, grazie.",exTr:"Tamam, teşekkürler."}
  ]},
  {uid:"it1-10", type:"vocab", icon:"🗣️", title:"Günlük Konuşma Kalıpları", desc:"Sohbette işine yarayacak ek kalıplar.", words:[
    {en:"A dopo", tr:"Sonra görüşürüz", ex:"Ciao, a dopo!", exTr:"Hoşça kal, sonra görüşürüz!"},
    {en:"Per favore", tr:"Lütfen", ex:"Un caffè, per favore.", exTr:"Bir kahve, lütfen."},
    {en:"Puoi aiutarmi?", tr:"Bana yardım edebilir misin?", ex:"Scusa, puoi aiutarmi?", exTr:"Pardon, bana yardım edebilir misin?"},
    {en:"Non lo so", tr:"Bilmiyorum", ex:"Mi dispiace, non lo so.", exTr:"Üzgünüm, bilmiyorum."},
    {en:"Molto bene", tr:"Çok iyi", ex:"Sto molto bene, grazie.", exTr:"Çok iyiyim, teşekkürler."},
    {en:"Di dove sei?", tr:"Nerelisin?", ex:"Ciao! Di dove sei?", exTr:"Merhaba! Nerelisin?"},
    {en:"Sono turco", tr:"Türküm (kadın: Sono turca)", ex:"Sono turco, di Istanbul.", exTr:"Türküm, İstanbulluyum."}
  ]}

{ id:2, cefr:"A1+", name:"Seviye 2 — Temel", desc:"Cümle kurmaya başla: fiiller, çoğullar, edatlar ve günlük yaşam.", units:[
  {uid:"it2-1", type:"grammar", icon:"📖", title:"Gramer: Çoğullar",
    intro:"İtalyancada çoğul, ismin son harfine göre değişir.",
    rule:"Eril <b>-o → -i</b>: libro → libri. Dişil <b>-a → -e</b>: casa → case. <b>-e</b> ile bitenler → <b>-i</b>: cane → cani.",
    structure:[["Tekil","Çoğul"],["libro (kitap)","libri"],["casa (ev)","case"],["cane (köpek)","cani"],["mela (elma)","mele"]],
    examples:[{en:"due libri",tr:"iki kitap"},{en:"tre case",tr:"üç ev"},{en:"due cani",tr:"iki köpek"}],
    exercises:[
      {q:"un libro, due ___", options:["libri","libro","libre"], answer:"libri", explain:"Eril -o → -i."},
      {q:"una casa, due ___", options:["case","casi","casa"], answer:"case", explain:"Dişil -a → -e."},
      {q:"un cane, due ___", options:["cani","cane","canes"], answer:"cani", explain:"-e → -i."},
      {q:"una mela, due ___", options:["mele","meli","mela"], answer:"mele", explain:"Dişil -a → -e."}
    ]},
  {uid:"it2-2", type:"vocab", icon:"🍎", title:"Yiyecek & İçecek", desc:"Sofradaki temel kelimeler.", words:[
    {en:"Pane",tr:"Ekmek",ex:"Il pane è buono.",exTr:"Ekmek güzel."},
    {en:"Acqua",tr:"Su",ex:"Un'acqua, per favore.",exTr:"Bir su, lütfen."},
    {en:"Caffè",tr:"Kahve",ex:"Un caffè, per favore.",exTr:"Bir kahve, lütfen."},
    {en:"Latte",tr:"Süt",ex:"Il latte è freddo.",exTr:"Süt soğuk."},
    {en:"Formaggio",tr:"Peynir",ex:"Mi piace il formaggio.",exTr:"Peyniri severim."},
    {en:"Mela",tr:"Elma",ex:"Mangio una mela.",exTr:"Bir elma yerim."}
  ]},
  {uid:"it2-3", type:"grammar", icon:"📖", title:"Gramer: Şimdiki zaman (-are fiilleri)",
    intro:"-are ile biten fiiller düzenli çekilir. Örnek: parlare (konuşmak).",
    rule:"Kök + <b>-o, -i, -a, -iamo, -ate, -ano</b>. parlare → io parlo, tu parli, lui/lei parla, noi parliamo, voi parlate, loro parlano.",
    structure:[["Özne","parlare"],["io","parlo"],["tu","parli"],["lui/lei","parla"],["noi","parliamo"],["voi","parlate"],["loro","parlano"]],
    examples:[{en:"Io parlo italiano.",tr:"İtalyanca konuşurum."},{en:"Lei parla bene.",tr:"O iyi konuşur."},{en:"Noi mangiamo la pizza.",tr:"Pizza yeriz."}],
    exercises:[
      {q:"Io ___ italiano. (parlare)", options:["parlo","parli","parla"], answer:"parlo", explain:"io → -o: parlo."},
      {q:"Tu ___ bene. (parlare)", options:["parli","parlo","parla"], answer:"parli", explain:"tu → -i: parli."},
      {q:"Lui ___ italiano. (parlare)", options:["parla","parlo","parli"], answer:"parla", explain:"lui → -a: parla."},
      {q:"Noi ___ la pizza. (mangiare)", options:["mangiamo","mangiate","mangiano"], answer:"mangiamo", explain:"noi → -iamo."}
    ]},
  {uid:"it2-4", type:"grammar", icon:"📖", title:"Gramer: Olumsuz (non)",
    intro:"Olumsuz cümle için fiilden önce 'non' konur.",
    rule:"Özne + <b>non</b> + fiil. \"Non parlo inglese\" = \"İngilizce konuşmam\". \"Non ho tempo\" = \"Zamanım yok\".",
    structure:[["Olumlu","Olumsuz"],["Parlo italiano","Non parlo italiano"],["Ho tempo","Non ho tempo"]],
    examples:[{en:"Non parlo inglese.",tr:"İngilizce konuşmam."},{en:"Non ho tempo.",tr:"Zamanım yok."},{en:"Non capisco.",tr:"Anlamıyorum."}],
    exercises:[
      {q:"İngilizce konuşmam: ___ parlo inglese.", options:["Non","No","Ne"], answer:"Non", explain:"Olumsuzluk: non."},
      {q:"Zamanım yok: Non ___ tempo.", options:["ho","hai","ha"], answer:"ho", explain:"io ile ho."},
      {q:"O et yemez: Lei non ___ carne. (mangiare)", options:["mangia","mangio","mangi"], answer:"mangia", explain:"lui/lei → mangia."}
    ]},
  {uid:"it2-5", type:"vocab", icon:"🏠", title:"Ev & Eşyalar", desc:"Evdeki eşyalar.", words:[
    {en:"Casa",tr:"Ev",ex:"La mia casa è grande.",exTr:"Evim büyük."},
    {en:"Tavolo",tr:"Masa",ex:"Il libro è sul tavolo.",exTr:"Kitap masanın üstünde."},
    {en:"Sedia",tr:"Sandalye",ex:"Una sedia rossa.",exTr:"Kırmızı bir sandalye."},
    {en:"Porta",tr:"Kapı",ex:"Apri la porta.",exTr:"Kapıyı aç."},
    {en:"Finestra",tr:"Pencere",ex:"Chiudi la finestra.",exTr:"Pencereyi kapat."},
    {en:"Letto",tr:"Yatak",ex:"Il gatto è sul letto.",exTr:"Kedi yatağın üstünde."}
  ]},
  {uid:"it2-6", type:"grammar", icon:"📖", title:"Gramer: Edatlar (in, a, su, con)",
    intro:"Yer ve durum bildiren küçük kelimeler.",
    rule:"<b>in</b> = içinde/-de (in casa), <b>a</b> = -e/-a, belirli yer (a Roma), <b>su</b> = üstünde (sul tavolo), <b>con</b> = ile (con me).",
    structure:[["Edat","Anlam","Örnek"],["in","içinde/-de","in casa"],["a","-e / belirli yer","a Roma"],["su","üstünde","sul tavolo"],["con","ile","con me"]],
    examples:[{en:"Sono a Roma.",tr:"Roma'dayım."},{en:"Il libro è sul tavolo.",tr:"Kitap masanın üstünde."},{en:"Vengo con te.",tr:"Seninle geliyorum."}],
    exercises:[
      {q:"Seninle geliyorum: Vengo ___ te.", options:["con","su","in"], answer:"con", explain:"ile = con."},
      {q:"Roma'dayım: Sono ___ Roma.", options:["a","su","con"], answer:"a", explain:"Belirli yer/şehir: a."},
      {q:"Kitap masanın üstünde: Il libro è ___ tavolo.", options:["sul","con","in"], answer:"sul", explain:"üstünde: su + il = sul."},
      {q:"Evin içinde: ___ casa.", options:["in","con","su"], answer:"in", explain:"içinde: in."}
    ]},
  {uid:"it2-7", type:"grammar", icon:"📖", title:"Gramer: Soru sözcükleri",
    intro:"Soru sormak için kullanılan kelimeler.",
    rule:"<b>Dove</b> = nerede, <b>Cosa</b> = ne, <b>Quando</b> = ne zaman, <b>Chi</b> = kim, <b>Perché</b> = neden.",
    structure:[["Soru","Anlam","Örnek"],["Dove?","nerede","Dove sei?"],["Cosa?","ne","Cosa fai?"],["Quando?","ne zaman","Quando vieni?"],["Chi?","kim","Chi è?"]],
    examples:[{en:"Dove sei?",tr:"Neredesin?"},{en:"Cosa fai?",tr:"Ne yapıyorsun?"},{en:"Chi è?",tr:"Kim o?"},{en:"Di dove sei?",tr:"Nerelisin?"}],
    exercises:[
      {q:"Neredesin? ___ sei?", options:["Dove","Chi","Quando"], answer:"Dove", explain:"nerede = Dove."},
      {q:"Ne yapıyorsun? ___ fai?", options:["Cosa","Dove","Chi"], answer:"Cosa", explain:"ne = Cosa."},
      {q:"Kim o? ___ è?", options:["Chi","Cosa","Dove"], answer:"Chi", explain:"kim = Chi."},
      {q:"Ne zaman geliyorsun? ___ vieni?", options:["Quando","Dove","Chi"], answer:"Quando", explain:"ne zaman = Quando."}
    ]},
  {uid:"it2-8", type:"vocab", icon:"📅", title:"Günler & Zaman", desc:"Haftanın günleri ve zaman.", words:[
    {en:"Oggi",tr:"Bugün",ex:"Oggi è lunedì.",exTr:"Bugün pazartesi."},
    {en:"Domani",tr:"Yarın",ex:"A domani!",exTr:"Yarın görüşürüz!"},
    {en:"Ieri",tr:"Dün",ex:"Ieri ero a casa.",exTr:"Dün evdeydim."},
    {en:"Lunedì",tr:"Pazartesi",ex:"Lavoro di lunedì.",exTr:"Pazartesi çalışırım."},
    {en:"Sabato",tr:"Cumartesi",ex:"Sabato non lavoro.",exTr:"Cumartesi çalışmam."},
    {en:"Domenica",tr:"Pazar",ex:"Domenica dormo.",exTr:"Pazar uyurum."}
  ]},
  {uid:"it2-9", type:"vocab", icon:"⏰", title:"Günlük Rutin", desc:"Carlo'nun günü metninden günlük eylemler.", words:[
    {en:"Mi alzo",tr:"Kalkarım",ex:"Mi alzo alle 7:00.",exTr:"Saat 7'de kalkarım."},
    {en:"La colazione",tr:"Kahvaltı",ex:"Faccio colazione con tè.",exTr:"Çayla kahvaltı yaparım."},
    {en:"La scuola",tr:"Okul",ex:"Vado a scuola.",exTr:"Okula giderim."},
    {en:"La lezione",tr:"Ders",ex:"Ho sei ore di lezione.",exTr:"Altı saat dersim var."},
    {en:"I compiti",tr:"Ödevler",ex:"Faccio i compiti.",exTr:"Ödevlerimi yaparım."},
    {en:"La cena",tr:"Akşam yemeği",ex:"Ceno alle 19:00.",exTr:"Saat 19'da akşam yemeği yerim."},
    {en:"Vado a letto",tr:"Yatarım / Yatmaya giderim",ex:"Vado a letto alle 22:30.",exTr:"22:30'da yatarım."}
  ]}
]},
{ id:3, cefr:"A2", name:"Seviye 3 — Temel Üstü", desc:"Zamanlar: geçmiş, gelecek, modal fiiller ve karşılaştırma.", units:[
  {uid:"it3-1", type:"grammar", icon:"📖", title:"Gramer: Geçmiş zaman — avere ile (passato prossimo)",
    intro:"Geçmişte biten işler için passato prossimo. Çoğu fiil 'avere' + geçmiş ortaç ile kurulur.",
    rule:"avere (ho/hai/ha/abbiamo/avete/hanno) + geçmiş ortaç. Ortaç: <b>-are→-ato</b>, <b>-ere→-uto</b>, <b>-ire→-ito</b>. \"Ho mangiato\" = \"yedim\".",
    structure:[["Mastar","Ortaç"],["parlare","parlato"],["mangiare","mangiato"],["credere","creduto"],["dormire","dormito"]],
    examples:[{en:"Ho mangiato la pizza.",tr:"Pizza yedim."},{en:"Hai parlato con Deniz?",tr:"Deniz'le konuştun mu?"},{en:"Abbiamo dormito bene.",tr:"İyi uyuduk."}],
    exercises:[
      {q:"Yedim: Ho ___ (mangiare).", options:["mangiato","mangiare","mangio"], answer:"mangiato", explain:"-are → -ato: mangiato."},
      {q:"Konuştun mu? Hai ___? (parlare)", options:["parlato","parlare","parli"], answer:"parlato", explain:"-are → -ato: parlato."},
      {q:"Uyuduk: Abbiamo ___ (dormire).", options:["dormito","dormire","dormo"], answer:"dormito", explain:"-ire → -ito: dormito."},
      {q:"-are fiilinin geçmiş ortacı hangi ekle biter?", options:["-ato","-uto","-ito"], answer:"-ato", explain:"-are → -ato."}
    ]},
  {uid:"it3-2", type:"grammar", icon:"📖", title:"Gramer: Geçmiş zaman — essere ile",
    intro:"Bazı fiiller (gitmek, gelmek gibi hareket) 'essere' ile kurulur ve özneye göre uyum sağlar.",
    rule:"essere (sono/sei/è/siamo/siete/sono) + ortaç. Erkek: <b>-o</b>, kadın: <b>-a</b>. \"Sono andato\" (erkek), \"Sono andata\" (kadın) = \"gittim\".",
    structure:[["Özne","Örnek"],["io (kadın)","Sono andata"],["io (erkek)","Sono andato"],["lei","È andata"],["noi","Siamo andati"]],
    examples:[{en:"Sono andata a casa.",tr:"Eve gittim (kadın)."},{en:"Lei è arrivata.",tr:"O geldi (kadın)."},{en:"Siamo andati al bar.",tr:"Bara gittik."}],
    exercises:[
      {q:"Eve gittim (kadın): Sono ___ a casa. (andare)", options:["andata","andato","andare"], answer:"andata", explain:"Kadın için -a: andata."},
      {q:"Hareket fiilleri passato prossimo'da hangi yardımcıyı alır?", options:["essere","avere","fare"], answer:"essere", explain:"Hareket/durum: essere."},
      {q:"O geldi (kadın): Lei ___ arrivata.", options:["è","ha","hai"], answer:"è", explain:"essere: è."},
      {q:"Bara gittik: ___ andati al bar.", options:["Siamo","Abbiamo","Avete"], answer:"Siamo", explain:"noi + essere: siamo."}
    ]},
  {uid:"it3-3", type:"grammar", icon:"📖", title:"Gramer: Gelecek zaman (futuro)",
    intro:"Gelecekte olacak işler için futuro semplice.",

let ALL_UNITS = [];

let DICT = [];
function catForUnit(t){ if(/Selam|Tanış/.test(t)) return "Selamlaşma"; if(/Sayı|Renk/.test(t)) return "Sayılar & Renkler"; if(/Aile/.test(t)) return "Aile"; if(/Yiyecek/.test(t)) return "Yiyecek"; if(/Ev/.test(t)) return "Ev"; if(/Zaman/.test(t)) return "Zaman"; if(/Seyahat/.test(t)) return "Şehir"; return "Diğer"; }
function indexCurriculum(){
  ALL_UNITS = []; VOCAB_POOL = []; DICT = [];
  LEVELS.forEach(lv=>lv.units.forEach(u=>{ u._level=lv; ALL_UNITS.push(u); if(u.type==="vocab" && u.words) u.words.forEach(w=>VOCAB_POOL.push(w)); }));
  const seen=new Set();
  function add(w){ const k=w.en.toLowerCase(); if(seen.has(k)) return; seen.add(k); DICT.push(w); }
  LEVELS.forEach(lv=>lv.units.forEach(u=>{ if(u.type==="vocab" && u.words) u.words.forEach(w=>add({en:w.en,tr:w.tr,ex:w.ex,exTr:w.exTr,cat:catForUnit(u.title)})); }));
  DICTIONARY_EXTRA.forEach(add);
  DICT.sort((a,b)=>a.en.toLowerCase().localeCompare(b.en.toLowerCase(),"en"));
}
function findUnit(uid){ return ALL_UNITS.find(u=>u.uid===uid); }
function levelById(id){ return LEVELS.find(l=>l.id===id); }
function levelCompleted(lv){ return lv.units.every(u=>isDone(u.uid)); }
function levelDoneById(id){ const lv=levelById(id); return !!lv && levelCompleted(lv); }
function levelUnlocked(idx){
  if(idx<=0) return true;
  if(state.unlocks && state.unlocks[LEVELS[idx].id]) return true;
  return levelCompleted(LEVELS[idx-1]);
}

function defaultLangData(){ return {completedLessons:[], wordsLearned:0, grammarLearned:0, reviewWords:[], bestScores:{}, unlocks:{}, dictLearned:[], earnedBadges:[], perfectQuiz:false, unitProgress:{}, lastUid:null, quizSave:null, notes:{}}; }

function normalizeState(s){ const d=defaultState(); const m=Object.assign(d,s);
  m.settings=Object.assign(defaultState().settings, s.settings||{});
  m.langStore=Object.assign({en:defaultLangData(), it:defaultLangData()}, s.langStore||{});
  return m; }
function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){ return normalizeState(JSON.parse(raw)); }
    // Eski sürümden (yalnızca İngilizce) göç
    const old=localStorage.getItem(OLD_KEY_V3);
    if(old){ const s=JSON.parse(old); const d=defaultState();
      d.langStore.en=Object.assign(defaultLangData(), {completedLessons:s.completedLessons||[], wordsLearned:s.wordsLearned||0, grammarLearned:s.grammarLearned||0, reviewWords:s.reviewWords||[], bestScores:s.bestScores||{}, unlocks:s.unlocks||{}, dictLearned:s.dictLearned||[], earnedBadges:s.earnedBadges||[], perfectQuiz:!!s.perfectQuiz});
      d.studyDates=s.studyDates||[]; d.streak=s.streak||0; if(s.settings) d.settings=Object.assign(d.settings, s.settings);
      d.lang="en"; return d; }
    return defaultState();
  }catch(e){ return defaultState(); }
}
function snapshotActive(){ return {completedLessons:state.completedLessons, wordsLearned:state.wordsLearned, grammarLearned:state.grammarLearned, reviewWords:state.reviewWords, bestScores:state.bestScores, unlocks:state.unlocks, dictLearned:state.dictLearned, earnedBadges:state.earnedBadges, perfectQuiz:state.perfectQuiz, unitProgress:state.unitProgress, lastUid:state.lastUid, quizSave:state.quizSave||null, notes:state.notes||{}}; }
function applyLangData(o){ o=o||defaultLangData(); state.completedLessons=o.completedLessons||[]; state.wordsLearned=o.wordsLearned||0; state.grammarLearned=o.grammarLearned||0; state.reviewWords=o.reviewWords||[]; state.bestScores=o.bestScores||{}; state.unlocks=o.unlocks||{}; state.dictLearned=o.dictLearned||[]; state.earnedBadges=o.earnedBadges||[]; state.perfectQuiz=!!o.perfectQuiz;
  // Ünite adım takibi (eski kayıtlarda yok → boş başlar; bitmiş üniteler completedLessons'tan anlaşılır)
  const up=o.unitProgress; state.unitProgress=(up&&typeof up==="object"&&!Array.isArray(up))?up:{}; state.lastUid=typeof o.lastUid==="string"?o.lastUid:null;
  const qs=o.quizSave; state.quizSave=(qs&&typeof qs==="object"&&typeof qs.key==="string"&&Array.isArray(qs.questions)&&qs.questions.length&&qs.questions.every(q=>q&&Array.isArray(q.options)&&typeof q.answer==="string")&&qs.qIndex>=0&&qs.qIndex<qs.questions.length)?qs:null;
  // Notlar (eski kayıtlarda yok → boş): {anahtar: {text, updatedAt}}, bozuk kayıtlar atlanır
  const nt=o.notes, notes={}; if(nt&&typeof nt==="object"&&!Array.isArray(nt)) Object.keys(nt).forEach(k=>{ const n=nt[k]; if(n&&typeof n==="object"&&typeof n.text==="string"&&n.text.trim()) notes[k]={text:n.text, updatedAt:+n.updatedAt||0}; });
  state.notes=notes; }
function saveState(){ try{ if(state.lang){ state.langStore[state.lang]=snapshotActive(); } localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function setLanguage(lang, opts){ opts=opts||{}; if(!LANGS[lang]) lang="en";
  if(state.lang && !opts.skipSaveOld){ state.langStore[state.lang]=snapshotActive(); }
  state.lang=lang;
  LEVELS=LANGS[lang].levels; DICTIONARY_EXTRA=LANGS[lang].dictExtra;
  SPEAK_LANG = (lang==="it") ? "it-IT" : "en-US";
  applyLangData(state.langStore[lang]);

}

function dateKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function computeStreak(){ const set=new Set(state.studyDates); let s=0,cur=new Date();
  if(!set.has(dateKey(cur))) cur=addDays(cur,-1);
  while(set.has(dateKey(cur))){ s++; cur=addDays(cur,-1); } return s; }
function registerStudyToday(){ const t=dateKey(); if(!state.studyDates.includes(t)) state.studyDates.push(t);
  state.studyDates=state.studyDates.slice(-60); state.streak=computeStreak(); saveState(); }

let currentScreen="";
let VOICES=[];
function refreshVoices(){ if("speechSynthesis" in window){ VOICES=window.speechSynthesis.getVoices()||[]; } }
if("speechSynthesis" in window){ refreshVoices();
  const onVC=()=>{ const had=VOICES.length; refreshVoices(); if(currentScreen==="settings" && VOICES.length!==had) renderSettings(true); };
  if(window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged",onVC); else window.speechSynthesis.onvoiceschanged=onVC;
  // iOS Safari "voiceschanged" olayını her zaman göndermez; birkaç kez yeniden dene
  [300,1000,2500].forEach(t=>setTimeout(onVC,t)); }
// Apple cihazlardaki şaka/efekt sesleri (Albert, Bad News, Zarvox...) yaşlı kullanıcı için anlaşılmaz; listeden çıkar
const NOVELTY_VOICES=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Junior|Ralph|Fred|Kathy|Princess|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/i;
function langVoices(){ const p=SPEAK_LANG.slice(0,2); return VOICES.filter(v=>new RegExp("^"+p,"i").test(v.lang) && !NOVELTY_VOICES.test(v.name||"")); }
function pickVoice(){ const vs=langVoices();
  if(state.settings.voiceURI){ const v=vs.find(x=>x.voiceURI===state.settings.voiceURI); if(v) return v; }
  const exact=vs.filter(v=>v.lang && v.lang.replace("_","-").toLowerCase()===SPEAK_LANG.toLowerCase());
  const pool=exact.length?exact:vs;
  return pool.find(v=>/enhanced|premium|natural/i.test(v.name))||pool.find(v=>v.default)||pool.find(v=>/google|samantha|alice|federica/i.test(v.name))||pool[0]||null; }
function speakSeq(texts){ if(!("speechSynthesis" in window)){ showToast("Bu cihazda sesli okuma yok."); return; }
  texts=(texts||[]).map(t=>t==null?"":String(t).trim()).filter(Boolean);
  const ss=window.speechSynthesis; if(!VOICES.length) refreshVoices();
  ss.cancel(); if(ss.paused) ss.resume();
  const v=pickVoice();
  texts.forEach(t=>{ const u=new SpeechSynthesisUtterance(t); u.lang=SPEAK_LANG; u.rate=state.settings.rate||0.85; if(v) u.voice=v; ss.speak(u); }); }
function speak(text){ speakSeq([text]); }
// Kelime + örnek cümle: önce kelimenin kendisi, sonra cümle
function speakWord(w){ if(!w) return; speakSeq(w.ex && w.ex!==w.en ? [w.en, w.ex] : [w.en]); }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(a,n){ return shuffle(a).slice(0,n); }
// Yanlış şıklar: aynı anlama gelen başka bir kelime "yanlış" diye çıkmasın (iki doğru şık olmasın)
function distractors(field, answer, n, word){ const other=field==="en"?"tr":"en"; const low=x=>String(x||"").trim().toLowerCase();
  const seen=new Set([low(answer)]); const out=[];
  for(const w of shuffle(VOCAB_POOL)){ const v=w[field]; if(!v || seen.has(low(v))) continue;
    if(word && low(w[other])===low(word[other])) continue;
    seen.add(low(v)); out.push(v); if(out.length>=n) break; } return out; }
function buildVocabQuiz(words, count){
  const n=count||Math.min(6,Math.max(4,words.length));
  const chosen=sample(words,Math.min(n,words.length)); while(chosen.length<n){ chosen.push(words[Math.floor(Math.random()*words.length)]); }
  const types=["en2tr","tr2en","listen"];
  return chosen.map(w=>{ const t=types[Math.floor(Math.random()*types.length)];

const STEPS={

function upRec(uid){ let r=state.unitProgress[uid]; if(!r||typeof r!=="object"){ r=state.unitProgress[uid]={}; } if(!r.done||typeof r.done!=="object") r.done={}; return r; }
function stepDone(u,k){ if(isDone(u.uid)) return true; if(k==="quiz") return false; const d=upGet(u.uid).done; return !!(d&&d[k]); }

function failedAttempt(u){ if(isDone(u.uid)) return false; const a=lastAttempt(u); return !!a && !a.passed; }
function unitStarted(u){ const r=upGet(u.uid); return !!(r.cur || (r.done && Object.keys(r.done).length)); }

  const s=unitSteps(u).find(x=>!stepDone(u,x.k)); return s?s.k:"quiz"; }

  { const ri=resumeInfo(quizKey(u.type==="grammar"?"grammar":"vocab",u.uid)); if(ri) return `⏸ ${u.type==="grammar"?"Alıştırmaya":"Teste"} devam et (${ri.done}/${ri.total})`; }

  html+=`

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
// iPhone'da ana ekrana kurulan uygulamada ses tanıma genelde çalışmaz → baştan "Ben söyledim" akışı
let MIC_OFF=(()=>{ try{ return /iP(hone|ad|od)/.test(navigator.userAgent) && (navigator.standalone===true || matchMedia("(display-mode: standalone)").matches); }catch(e){ return false; } })();
function renderPractice(uid,pos){ const u=findUnit(uid); if(!u||!u.words||!u.words.length){ goHome(); return; } leaveLesson(uid);
  ctx={unit:u, prIndex:Math.min(Math.max(0,pos||0),u.words.length-1)}; drawPractice(); }
function normalize(s){ return String(s).toLowerCase().replace(/[^a-zàáâäèéêëìíîïòóôöùúûüçğıöşü ]/gi,"").replace(/\s+/g," ").trim(); }
function drawPractice(){ const u=ctx.unit, w=u.words[ctx.prIndex], n=u.words.length, mic=!!SR && !MIC_OFF; nav("practice"); setCur(u,"practice",ctx.prIndex);
  app.innerHTML=`${unitBarHtml(u,"practice")}
    <div class="card center"><div class="counter">Telaffuz ${ctx.prIndex+1} / ${n}</div>
      <h2>${esc(w.en)}</h2><p class="word-tr">${esc(w.tr)}</p>
      <p class="muted">1) Dinle 2) Sen söyle 3) ${mic?"Mikrofona söyleyip kontrol et":"Tekrar dinle"}</p>
      <button class="btn btn-accent" data-act="speakPractice">🔊 Dinle</button>
      ${mic?`<button class="btn btn-primary" data-act="micCheck">🎤 Söyle ve Kontrol Et</button>`:`<button class="btn btn-primary" data-act="prNext">🗣️ Ben Söyledim, Devam</button>`}
      <div id="micState" class="mic-state ${mic?"":"hidden"}">Hazır olduğunda “Söyle ve Kontrol Et”e bas.</div></div>
    ${notesSlotHtml()}
    <div class="card"><button class="btn btn-soft" data-act="prNext">➡️ Sonraki Kelime</button>
      <button class="btn btn-soft" data-act="quizIntro" data-uid="${u.uid}" data-kind="vocab">📝 Teste geç (4. adım)</button>
      <button class="btn btn-soft" data-act="goHome">Ana Sayfa</button></div>`;
  notesMount(u.uid,"compact"); window.scrollTo(0,0);
}
function prNext(){ if(ctx.prIndex<ctx.unit.words.length-1){ ctx.prIndex++; drawPractice(); }
  else { const u=ctx.unit; markStep(u.uid,"practice"); pendingNote="✓ Telaffuz bitti. Şimdi son adım: Test."; renderQuizIntro(u.uid,"vocab"); } }
function micCheck(){ if(!SR||MIC_OFF){ prNext(); return; } const w=ctx.unit.words[ctx.prIndex]; const box=document.getElementById("micState"); const target=normalize(w.en);
  const rec=new SR(); rec.lang=SPEAK_LANG; rec.interimResults=false; rec.maxAlternatives=5;
  box.className="mic-state listening"; box.innerHTML="🎤 <span class='pulse'>Dinliyorum... şimdi söyle</span>"; let done=false;
  rec.onresult=(e)=>{ done=true; const alts=[]; for(let i=0;i<e.results[0].length;i++) alts.push(normalize(e.results[0][i].transcript));
    const ok=alts.some(a=>a===target||a.includes(target)||target.includes(a));
    if(ok){ box.className="mic-state"; box.style.background="var(--good-bg)"; box.style.color="#1d7a42"; box.innerHTML="✓ Çok iyi! Doğru söyledin: <b>"+esc(w.en)+"</b>"; }
    else { box.className="mic-state"; box.style.background="var(--bad-bg)"; box.style.color="#a8312d"; box.innerHTML="Duyduğum: <b>"+esc(alts[0]||"-")+"</b><br>Hedef: <b>"+esc(w.en)+"</b> — dinleyip yavaşça tekrar dene. 💪"; } };
  rec.onerror=(ev)=>{ if(done) return; done=true; const hard=ev&&["not-allowed","service-not-allowed","audio-capture","network"].includes(ev.error);
    if(hard){ MIC_OFF=true; drawPractice(); const b2=document.getElementById("micState"); if(b2){ b2.classList.remove("hidden"); b2.className="mic-state"; b2.textContent="Bu cihazda mikrofon kontrolü kullanılamıyor. Kelimeyi dinle, sesli söyle ve “Ben Söyledim, Devam”a bas."; } }
    else { box.className="mic-state"; box.textContent="Sesini duyamadım. Tekrar dene veya “Sonraki Kelime” ile devam et."; } };
  rec.onend=()=>{ if(!done){ box.className="mic-state"; box.textContent="Sesini duyamadım. Tekrar dene. 🎤"; } };
  try{ rec.start(); }catch(e){ box.textContent="Mikrofon başlatılamadı."; } }

/* ----- YARIM KALAN TEST ----- */
function quizKey(mode,id){ return mode+":"+(id==null?"":id); }
function ctxKey(){ return quizKey(ctx.mode, ctx.unit?ctx.unit.uid:(ctx.level?ctx.level.id:(ctx.fromReview?"review":"all"))); }
function saveQuizProgress(){ try{ if(!ctx||!ctx.questions) return; state.quizSave={key:ctxKey(), mode:ctx.mode, questions:ctx.questions, qIndex:ctx.qIndex, correct:ctx.correct, answered:!!ctx.answered, savedAt:Date.now()}; saveState(); }catch(e){} }
function clearQuizProgress(){ if(state.quizSave){ state.quizSave=null; saveState(); } }
function savedQuiz(key){ const q=state.quizSave; return (q && q.key===key)?q:null; }
function resumeInfo(key){ const q=savedQuiz(key); if(!q) return null; const done=q.qIndex+(q.answered?1:0); return {q, done, total:q.questions.length}; }
// Kayıt varsa ctx'i oradan kur; cevaplanmış son soruda kaldıysa bir sonrakine geç
function tryResume(key, base){ const q=savedQuiz(key); if(!q) return false;
  ctx=Object.assign(base,{questions:q.questions, qIndex:q.qIndex, correct:q.correct||0, answered:false, resumed:true});
  if(q.answered){ if(ctx.qIndex>=ctx.questions.length-1){ finishQuiz(); return true; } ctx.qIndex++; }
  saveQuizProgress(); drawQuiz(); showToast("Kaldığın yerden devam: Soru "+(ctx.qIndex+1)+" / "+ctx.questions.length); return true; }
function restartQuiz(){ const m=ctx.mode; clearQuizProgress();
  if(m==="vocab"||m==="grammar") startQuiz(ctx.unit.uid, m, true); else if(m==="leveltest") startLevelTest(ctx.level.id, true); else startMixReview(ctx.fromReview, true); }
function startQuiz(uid,kind,fresh){ const u=findUnit(uid); if(!u){ goHome(); return; } leaveLesson(uid);
  if(fresh) { if(savedQuiz(quizKey(kind,uid))) clearQuizProgress(); }
  else { setCur(u,"quiz"); if(tryResume(quizKey(kind,uid), {unit:u, mode:kind})) return; }
  const questions = kind==="grammar" ? buildGrammarQuiz(u) : ((u.words&&u.words.length)?buildVocabQuiz(u.words):[]);
  if(!questions.length){ showToast("Bu ders için soru yok."); return; }
  setCur(u,"quiz"); ctx={unit:u, mode:kind, questions, qIndex:0, correct:0, answered:false}; saveQuizProgress(); drawQuiz(); }
function startLevelTest(id,fresh){ const lv=levelById(id); if(!lv) return;
  if(!fresh && tryResume(quizKey("leveltest",lv.id), {unit:null, level:lv, mode:"leveltest"})) return;
  const qs=buildLevelTest(lv);
  if(!qs.length){ showToast("Bu seviye için soru yok."); return; }
  ctx={unit:null, level:lv, mode:"leveltest", questions:qs, qIndex:0, correct:0, answered:false}; saveQuizProgress(); drawQuiz(); }
function startMixReview(fromReview,fresh){ fromReview=!!fromReview;
  if(!fresh && tryResume(quizKey("mix",fromReview?"review":"all"), {unit:null, mode:"mix", fromReview})) return;
  let pool=[];
  if(fromReview) pool=state.reviewWords.filter(w=>w && w.en && w.tr);
  else { ALL_UNITS.forEach(u=>{ if(u.type==="vocab" && isDone(u.uid) && u.words) pool=pool.concat(u.words); }); if(pool.length<4) pool=VOCAB_POOL; }
  if(!pool.length){ showToast("Test için kelime yok."); return; }
  ctx={unit:null, mode:"mix", fromReview, questions:buildVocabQuiz(pool, Math.min(8,Math.max(4,pool.length))), qIndex:0, correct:0, answered:false}; saveQuizProgress(); drawQuiz(); }
function drawQuiz(){ const q=ctx.questions[ctx.qIndex], n=ctx.questions.length, pct=Math.round(ctx.qIndex/n*100); nav("quiz");
  const unitQ=(ctx.mode==="vocab"||ctx.mode==="grammar") && ctx.unit;
  app.innerHTML=`${unitQ?unitBarHtml(ctx.unit,"quiz"):""}<div class="card"><div class="counter">Soru ${ctx.qIndex+1} / ${n}</div>
    <div class="progressbar"><span style="width:${pct}%"></span></div><h3>${esc(q.prompt)}</h3>
    ${q.kind==="listen"?`<button class="btn btn-accent" data-act="replayAudio">🔊 Tekrar Dinle</button>`:""}
    <div id="opts" style="margin-top:10px;">${q.options.map((o,i)=>`<button class="opt" data-act="answer" data-i="${i}"><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="qfeedback"></div><div id="qnext"></div></div>
    <div class="card quiz-exit"><button class="btn btn-soft" data-act="goHome">Ara ver, Ana Sayfa</button><p class="muted center" style="margin:6px 0 0;">Cevapların kaydediliyor. Döndüğünde kaldığın sorudan devam edersin.</p>${ctx.resumed?`<button class="btn btn-ghost" data-act="restartQuiz">↺ Testi baştan başlat</button>`:""}</div>`;
  if(q.kind==="listen"){ const myQ=q; setTimeout(()=>{ if(currentScreen==="quiz" && ctx.questions && ctx.questions[ctx.qIndex]===myQ && !ctx.answered) speak(myQ.audio); },350); } window.scrollTo(0,0); }
function answerQuiz(i){ if(ctx.answered) return; ctx.answered=true; const q=ctx.questions[ctx.qIndex]; const correct=q.options[i]===q.answer;
  document.querySelectorAll("#opts .opt").forEach((b,idx)=>{ b.disabled=true; if(q.options[idx]===q.answer) b.classList.add("correct"); else if(idx===i) b.classList.add("wrong"); });
  if(correct) ctx.correct++;
  saveQuizProgress();
  let addedRev=false; if(!correct && q.word && q.word.en && !state.reviewWords.some(x=>x.en===q.word.en)){ const w=q.word; state.reviewWords.push({en:w.en,tr:w.tr,ex:w.ex,exTr:w.exTr}); saveState(); addedRev=true; }
  const fb=document.getElementById("qfeedback"); fb.className="feedback "+(correct?"good":"bad");
  fb.innerHTML=correct?"✓ Doğru! Aferin. 👏":"✗ Doğru cevap: <b>"+esc(q.answer)+"</b>."+(q.explain?"<br>"+esc(q.explain):"")+(addedRev?"<br><small>🔁 Bu kelime tekrar listene eklendi.</small>":"");
  const last=ctx.qIndex>=ctx.questions.length-1;
  const nx=document.getElementById("qnext"); nx.innerHTML=`<button class="btn btn-primary" data-act="nextQuiz">${last?"Sonucu Gör":"Sonraki Soru ➡️"}</button>`;
  // Açıklama ve "Sonraki" düğmesi ekranın altında kalmasın

function nextQuiz(){ if(ctx.qIndex<ctx.questions.length-1){ ctx.qIndex++; ctx.answered=false; saveQuizProgress(); drawQuiz(); } else finishQuiz(); }
function passMark(n){ return Math.max(1, Math.ceil(n*0.67)); }
function finishQuiz(){ const n=ctx.questions.length, score=ctx.correct, perfect=score===n; if(savedQuiz(ctxKey())) state.quizSave=null; registerStudyToday(); nav("result");
  let firstTime=false, levelJustDone=false; const u=ctx.unit;
  const unitQuiz=(ctx.mode==="vocab"||ctx.mode==="grammar") && !!u, need=passMark(n), passed=score>=need;
  if(unitQuiz){ const r=upRec(u.uid); r.last={score, total:n, passed}; r.cur="quiz"; state.lastUid=u.uid; }
  if(unitQuiz && !passed){
    const prevB=state.bestScores[u.uid]; if(prevB==null||score>prevB) state.bestScores[u.uid]=score; saveState();
    app.innerHTML=`${unitBarHtml(u,"quiz")}<div class="card center"><h2>📚 Biraz daha çalışalım</h2>
      <p style="font-size:24px;font-weight:800;">${score} / ${n} doğru</p>
      <p class="muted">Üniteyi geçmek için en az <b>${need} doğru</b> gerekiyor. Dersi bir kez daha gözden geçir, sonra testi tekrar çöz. 💛</p>
      ${isDone(u.uid)?`<p class="muted">Bu üniteyi daha önce geçmiştin; tamamlanmış olarak kalıyor.</p>`:""}</div>
      <div class="card"><button class="btn btn-primary" data-act="startQuiz" data-uid="${u.uid}" data-kind="${ctx.mode}">🔁 Testi Tekrar Çöz</button>
      <button class="btn btn-accent" data-act="openUnit" data-uid="${u.uid}">📖 Dersi Tekrar Gözden Geçir</button>
      <button class="btn btn-soft" data-act="goHome">Ana Sayfa</button></div>`; window.scrollTo(0,0); return; }
  if(unitQuiz){
    firstTime=!isDone(u.uid); const lvWasDone=levelCompleted(u._level);
    if(firstTime){ state.completedLessons.push(u.uid); if(u.type==="vocab"&&u.words) state.wordsLearned+=u.words.length; if(u.type==="grammar") state.grammarLearned+=1; }
    const prev=state.bestScores[u.uid]; if(prev==null||score>prev) state.bestScores[u.uid]=score;
    levelJustDone = !lvWasDone && levelCompleted(u._level);
  }
  if(perfect) state.perfectQuiz=true; saveState(); const newly=checkBadges(); if(perfect||firstTime) confetti(); celebrate(newly);
  // sıradaki ünite önerisi
  let nextU=null;
  let nextLevel=null, nextLevelOpen=false;
  if(u){ const lv=u._level; const idx=lv.units.findIndex(x=>x.uid===u.uid);
    // Seviyede önce bitmemiş sıradaki üniteyi öner, yoksa sıradaki üniteyi
    const after=lv.units.slice(idx+1); nextU=after.find(x=>!isDone(x.uid))||lv.units.find(x=>!isDone(x.uid))||after[0]||null;
    if(!nextU){ const li=LEVELS.indexOf(lv); if(li>=0 && li<LEVELS.length-1){ nextLevel=LEVELS[li+1]; nextLevelOpen=levelUnlocked(li+1); if(nextLevelOpen) nextU=nextLevel.units.find(x=>!isDone(x.uid))||nextLevel.units[0]||null; } } }
  const title = ctx.mode==="leveltest"?"🏁 Seviye Testi Bitti!":(ctx.mode==="mix"?"🔀 Karışık Tekrar Bitti!":(levelJustDone?"🏆 "+esc(u._level.name)+" bitti!":"🎉 Üniteyi tamamladın!"));
  let actions="";
  if(levelJustDone && u) actions+=`<p class="center" style="font-weight:700;color:var(--good);">Tebrikler! Bu seviyenin bütün derslerini bitirdin.${nextLevel?" Sıradaki seviye açıldı.":""}</p>
    <button class="btn btn-accent" data-act="levelTest" data-id="${u._level.id}">📝 ${esc(u._level.cefr)} Seviye Testini Çöz</button>`;
  if(nextU) actions+=`<button class="btn btn-primary" data-act="openUnit" data-uid="${nextU.uid}">▶️ Sıradaki Ders: ${nextU.icon} ${esc(nextU.title)}</button>`;
  else if(u && !levelJustDone) actions+=`<p class="st-line center">Bu seviyedeki bütün dersler tamam ✓</p>`;
  if((ctx.mode==="vocab"||ctx.mode==="grammar")&&u) actions+=`<button class="btn btn-soft" data-act="startQuiz" data-uid="${u.uid}" data-kind="${ctx.mode}">🔁 Tekrar Çöz</button>`;
  actions+=`<button class="btn btn-soft" data-act="goHome">Ana Sayfa</button>`;
  app.innerHTML=`${unitQuiz?unitBarHtml(u,"quiz"):""}<div class="card center"><h2>${title}</h2>
    <p style="font-size:24px;font-weight:800;">${score} / ${n} doğru</p>
    ${unitQuiz?`<p class="st-line">✓ Bu ünitenin bütün adımları bitti.</p>`:""}
    <p class="muted">${perfect?"Mükemmel, hepsi doğru! 🌟":(score>=Math.ceil(n*0.6)?"Güzel iş! Biraz daha tekrarla harika olacak.":"Sorun değil — tekrar etmek öğrenmenin yoludur. 💛")}</p>
    ${state.streak>0?`<div class="streak-badge">🔥 ${state.streak} gün seri</div>`:""}</div>
    <div class="card">${actions}</div>`; window.scrollTo(0,0); }

/* ----- YEDEKLE / TAŞI ----- */
const BK_PREFIX="TY1", BK_APP="TY-INGILIZCE", BK_FORMAT=1;
function bkFresh(){ return {code:"", input:"", pending:null, msg:"", msgType:""}; }
let bk=bkFresh();
function bkHash(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(16).padStart(8,"0"); }
function bkB64Enc(str){ const b=new TextEncoder().encode(str); let bin=""; for(let i=0;i<b.length;i+=0x8000) bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(bin); }
function bkB64Dec(b64){ const bin=atob(b64); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return new TextDecoder("utf-8",{fatal:true}).decode(b); }
function bkCurrentState(){ saveState(); return JSON.parse(JSON.stringify(state)); }
function bkEnvelope(){ return {app:BK_APP, format:BK_FORMAT, created:new Date().toISOString(), state:bkCurrentState()}; }
function bkMakeCode(){ const json=JSON.stringify(bkEnvelope()); return BK_PREFIX+":"+bkHash(json)+":"+bkB64Enc(json); }
function bkErr(m){ const e=new Error(m); e.userMsg=m; return e; }
const BK_ERR_BROKEN="Kod eksik veya bozuk görünüyor. Kodun tamamını (baştan sona) kopyalayıp tekrar yapıştır.";
/* Kod ya da dosya metnini çözer, doğrular; {state, created} döner. Hata olursa anlaşılır mesajla fırlatır. */
function bkParse(text){
  let t=String(text||"").trim();
  if(!t) throw bkErr("Önce yedek kodunu yapıştır veya bir yedek dosyası seç.");
  let env;
  if(t.charAt(0)==="{"){ // .json dosyası
    try{ env=JSON.parse(t); }catch(e){ throw bkErr("Bu dosya okunamadı. Uygulamadan indirdiğin yedek dosyasını seç."); }
    if(!env || env.app!==BK_APP) throw bkErr("Bu dosya bu uygulamanın yedeği değil.");
    if(env.checksum && env.state && bkHash(JSON.stringify(env.state))!==env.checksum) throw bkErr("Yedek dosyası bozulmuş veya değiştirilmiş. Yeni bir yedek dosyası indirip tekrar dene.");
  } else {
    t=t.replace(/\s+/g,"");
    const m=/^TY(\d+):([0-9a-f]{8}):([A-Za-z0-9+/=]+)$/i.exec(t);
    if(!m){ if(!/^TY\d+:/i.test(t)) throw bkErr("Bu bir yedek kodu değil. Yedek kodu “TY1:” ile başlar. Kodun tamamını kopyaladığından emin ol."); throw bkErr(BK_ERR_BROKEN); }
    if(+m[1]>BK_FORMAT) throw bkErr("Bu yedek uygulamanın daha yeni bir sürümünden. Önce uygulamayı güncelle (sayfayı yenile), sonra tekrar dene.");
    let json; try{ json=bkB64Dec(m[3]); }catch(e){ throw bkErr(BK_ERR_BROKEN); }
    if(bkHash(json)!==m[2].toLowerCase()) throw bkErr(BK_ERR_BROKEN);
    try{ env=JSON.parse(json); }catch(e){ throw bkErr(BK_ERR_BROKEN); }
  }
  if(!env || typeof env!=="object") throw bkErr(BK_ERR_BROKEN);
  if((env.format||1)>BK_FORMAT) throw bkErr("Bu yedek uygulamanın daha yeni bir sürümünden. Önce uygulamayı güncelle (sayfayı yenile), sonra tekrar dene.");
  const s=env.state;
  const okLang=o=>o && typeof o==="object" && (!("completedLessons" in o) || Array.isArray(o.completedLessons));
  if(!s || typeof s!=="object" || Array.isArray(s) || !s.langStore || typeof s.langStore!=="object"
     || !Object.keys(s.langStore).every(k=>okLang(s.langStore[k]))
     || ("studyDates" in s && !Array.isArray(s.studyDates)))
    throw bkErr("Bu yedeğin içinde ilerleme bilgisi bulunamadı.");
  return {state:s, created:env.created||null};
}
/* Geri yüklenecek durumu uygulamanın açılışta kullandığı normalizasyondan geçirir. */
function bkNormalize(raw){ const s=normalizeState(JSON.parse(JSON.stringify(raw)));
  const arr=v=>Array.isArray(v)?v:[], obj=v=>(v&&typeof v==="object"&&!Array.isArray(v))?v:{};
  Object.keys(s.langStore).forEach(k=>{ const o=Object.assign(defaultLangData(), obj(s.langStore[k]));
    o.completedLessons=arr(o.completedLessons); o.reviewWords=arr(o.reviewWords); o.dictLearned=arr(o.dictLearned); o.earnedBadges=arr(o.earnedBadges);
    o.bestScores=obj(o.bestScores); o.unlocks=obj(o.unlocks); o.wordsLearned=+o.wordsLearned||0; o.grammarLearned=+o.grammarLearned||0; o.perfectQuiz=!!o.perfectQuiz;
    s.langStore[k]=o; });
  s.studyDates=arr(s.studyDates).filter(d=>typeof d==="string");
  if(s.lang && !LANGS[s.lang]) s.lang=null;
  return s; }
function bkStreakOf(dates){ const set=new Set(dates||[]); let n=0, cur=new Date(); if(!set.has(dateKey(cur))) cur=addDays(cur,-1); while(set.has(dateKey(cur))){ n++; cur=addDays(cur,-1); } return n; }
function bkFmtDate(k){ if(!k) return "—"; const p=String(k).slice(0,10).split("-"); return p.length===3?p[2]+"."+p[1]+"."+p[0]:"—"; }
function bkStats(s){ const out={}; Object.keys(LANGS).forEach(l=>{ const o=(s.langStore&&s.langStore[l])||{};
    out[l]={units:(o.completedLessons||[]).length, words:(+o.wordsLearned||0)+((o.dictLearned||[]).length)}; });
  const dates=(s.studyDates||[]).slice().sort();
  return {langs:out, streak:bkStreakOf(dates), last:dates[dates.length-1]||null}; }
function bkCompareHtml(p){ const a=bkStats(bkCurrentState()), b=bkStats(p.state);
  const langs=Object.keys(LANGS).filter(l=>a.langs[l].units||a.langs[l].words||b.langs[l].units||b.langs[l].words);
  if(!langs.length) langs.push("en");
  const row=(lbl,x,y)=>`<tr><td style="padding:6px 4px;">${lbl}</td><td style="padding:6px 4px;text-align:center;">${x}</td><td style="padding:6px 4px;text-align:center;font-weight:700;">${y}</td></tr>`;
  let rows="";
  langs.forEach(l=>{ rows+=`<tr><td colspan="3" style="padding:8px 4px 2px;font-weight:700;">${flag(l,true)} ${esc(LANGS[l].name)}</td></tr>`
    +row("Bitirilen ünite",a.langs[l].units,b.langs[l].units)+row("Öğrenilen kelime",a.langs[l].words,b.langs[l].words); });
  rows+=row("Seri (gün)",a.streak,b.streak)+row("Son çalışma",bkFmtDate(a.last),bkFmtDate(b.last));
  return `<table style="width:100%;border-collapse:collapse;margin:8px 0;">
    <tr style="border-bottom:1px solid var(--line);"><th></th><th style="padding:6px 4px;">Bu cihazda</th><th style="padding:6px 4px;">Yedekte</th></tr>${rows}</table>`; }

    <button class="btn btn-primary" data-act="bkMake">🔑 Yedek kodu oluştur</button>
    ${bk.code?`<textarea id="bkCode" readonly rows="4" style="${ta}" aria-label="Yedek kodu">${esc(bk.code)}</textarea>

    <button class="btn btn-soft" data-act="bkDownload">💾 Dosya olarak indir</button>
    <label class="set-lbl" style="margin-top:16px;">Yedeği geri yükle</label>
    <p class="muted">Diğer cihazda aldığın kodu aşağıya yapıştır ya da yedek dosyasını seç.</p>
    <textarea id="bkInput" rows="3" style="${ta}" placeholder="Yedek kodunu buraya yapıştır (TY1: ile başlar)" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(bk.input)}</textarea>
    ${msg}
    <button class="btn btn-accent" data-act="bkCheck">📥 Kodu yükle</button>
    <label class="btn btn-ghost" style="cursor:pointer;">📂 Yedek dosyası seç<input type="file" id="bkFile" accept=".json,application/json,text/plain" style="display:none;"></label></div>`;

  state=bkNormalize(bk.pending.state);
  if(state.lang){ setLanguage(state.lang,{skipSaveOld:true}); }
  else { LEVELS=LANGS.en.levels; DICTIONARY_EXTRA=LANGS.en.dictExtra; indexCurriculum(); }
  state.streak=computeStreak(); saveState(); applySettings();

function bkCopy(){ const ta=document.getElementById("bkCode"); if(!ta) return;
  const manual=()=>{ ta.focus(); ta.select(); try{ ta.setSelectionRange(0,ta.value.length); }catch(e){}
    let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    showToast(ok?"Kod kopyalandı ✓":"Kod seçildi. Basılı tutup “Kopyala”ya dokun."); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(()=>showToast("Kod kopyalandı ✓"), manual); }
  else manual(); }
function bkDownload(){ const st=bkCurrentState();
  const env={app:BK_APP, format:BK_FORMAT, created:new Date().toISOString(), checksum:bkHash(JSON.stringify(st)), state:st};
  const name="ty-ingilizce-yedek-"+dateKey()+".json";
  try{ const url=URL.createObjectURL(new Blob([JSON.stringify(env,null,1)],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); showToast("Yedek dosyası indirildi: "+name);
  }catch(e){ showToast("Dosya indirilemedi. “Yedek kodu oluştur”u kullan."); } }
function bkReadFile(input){ const f=input.files&&input.files[0]; if(!f) return;

  LEVELS.forEach(lv=>{ const items=lv.units.filter(u=>notes[u.uid]); if(!items.length) return; any=true;
    html+=`<h3 class="notes-lv">${esc(lv.cefr)} · ${esc(lv.name)}</h3>`+items.map(u=>{ seen.add(u.uid); return noteItemHtml(u.uid, `${u.icon} ${esc(u.title)}`); }).join(""); });
  const other=Object.keys(notes).filter(k=>!seen.has(k));
  if(other.length){ any=true; html+=`<h3 class="notes-lv">Diğer</h3>`+other.map(k=>noteItemHtml(k,esc(k))).join(""); }
  if(!any) html+=`<p class="empty">Ders notun yok.<br>Bir derse girip sayfanın altındaki 📝 Notlarım kutusuna yazabilirsin.</p>`;
  html+=`<button class="btn btn-soft" style="margin-top:12px;" data-act="goHome">Ana Sayfa</button></div>`;
  app.innerHTML=html; window.scrollTo(0,keepScroll?y:0); }
function renderNoteEdit(key){ const u=key==="general"?null:findUnit(key); nav("noteEdit");
  app.innerHTML=`<div class="card">${u?`<div class="muted">${esc(u._level.name)} · ${u.type==="grammar"?"📖 Gramer":"🔤 Kelime"}</div><h2>${u.icon} ${esc(u.title)}</h2>`:`<h2>🗒️ Genel not</h2>`}
      <p class="muted">Yazdıkların kendiliğinden kaydedilir.</p></div>
    ${notesSlotHtml()}
    <div class="card">${u?`<button class="btn btn-accent" data-act="openUnit" data-uid="${u.uid}">📖 Derse git</button>`:""}
      <button class="btn btn-soft" data-act="openNotes">← Tüm notlarım</button>
      <button class="btn btn-soft" data-act="goHome">Ana Sayfa</button></div>`;
  notesMount(key,"full"); window.scrollTo(0,0); }

/* ===== OLAYLAR ===== */
document.addEventListener("click",(e)=>{ const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act, d=el.dataset;
  switch(a){
    case "goHome": goHome(); break;
    case "goSettings": bk=bkFresh(); renderSettings(); break;
    case "langPicker": renderLangPicker(); break;
    case "chooseLang": setLanguage(d.lang); goHome(); break;
    case "openUnit": openUnit(d.uid); break;
    case "resume": resumeUnit(d.uid); break;
    case "step": goStep(d.uid, d.k); break;
    case "jump": { const t=document.getElementById(d.target); if(t){ try{ t.scrollIntoView({behavior:"smooth",block:"start"}); }catch(_){ t.scrollIntoView(); } } break; }
    case "flash": renderFlash(d.uid); break;
    case "practice": renderPractice(d.uid); break;
    case "quizIntro": renderQuizIntro(d.uid, d.kind); break;
    case "startQuiz": startQuiz(d.uid, d.kind, d.fresh==="1"); break;
    case "restartQuiz": restartQuiz(); break;
    case "levelTest": startLevelTest(+d.id); break;
    case "mixReview": startMixReview(); break;
    case "reviewQuiz": startMixReview(true); break;
    case "review": renderReview(); break;
    case "achievements": renderAchievements(); break;
    case "openDict": dictState={q:"",cat:"Tümü"}; renderDictionary(); break;
    case "dictCat": dictState.cat=d.cat; document.querySelectorAll("#dictChips button").forEach(b=>b.classList.toggle("active",b.dataset.cat===d.cat)); updateDictList(); break;
    case "dictSpeak": { const w=dictFind(d.en); if(w) speakWord(w); break; }
    case "dictAddReview": { const w=dictFind(d.en); if(w) addReviewWord(w); break; }
    case "dictLearned": { const i=state.dictLearned.indexOf(d.en); if(i>=0) state.dictLearned.splice(i,1); else { state.dictLearned.push(d.en); showToast("Öğrendin: "+d.en+" 👏"); } saveState(); updateDictList(); const dc=document.getElementById("dictCount"); if(dc) dc.textContent=dictCountHtml(); break; }
    case "unlock": state.unlocks[+d.id]=true; saveState(); showToast("Seviye açıldı."); goHome(); break;
    case "reveal": { const box=document.getElementById("rev"+d.i); if(box){ const nowHidden=box.classList.toggle("hidden"); el.textContent = nowHidden ? "👁 Göster" : "🙈 Gizle"; } break; }
    case "speakUnitEx": speakWord(ctx.unit.words[+d.i]); break;
    case "speakExample": speak(ctx.unit.examples[+d.i].en); break;
    case "speakFlash": speakWord(ctx.unit.words[ctx.fcIndex]); break;
    case "speakPractice": speak(ctx.unit.words[ctx.prIndex].en); break;
    case "speakReview": { const w=state.reviewWords[+d.i]; if(w) speakWord(w); break; }
    case "replayAudio": speak(ctx.questions[ctx.qIndex].audio); break;
    case "flip": flipCard(); break;
    case "fcKnow": showToast("Aferin! 👏"); fcAdvance(); break;
    case "fcRepeat": addReviewWord(ctx.unit.words[ctx.fcIndex]); fcAdvance(); break;
    case "prNext": prNext(); break;
    case "micCheck": micCheck(); break;
    case "answer": answerQuiz(+d.i); break;
    case "nextQuiz": nextQuiz(); break;
    case "learned": removeReviewWord(d.en); showToast("Tebrikler! Öğrendin: "+d.en); renderReview(); break;
    case "setFont": state.settings.fontScale=+d.v; saveState(); applySettings(); renderSettings(true); break;
    case "setRate": state.settings.rate=+d.v; saveState(); renderSettings(true); speak(state.lang==="it"?"Ciao, come stai?":"Hello, how are you?"); break;
    case "setVoice": state.settings.voiceURI=d.uri; saveState(); renderSettings(true); speak(state.lang==="it"?"Ciao, come stai?":"Hello, how are you?"); break;
    case "testVoice": speak(state.lang==="it"?"Ciao, buongiorno. Come stai? Sto imparando l'italiano.":"Hello, good morning. How are you? I am learning English."); break;
    case "bkMake": bk.input=(document.getElementById("bkInput")||{}).value||bk.input; bk.code=bkMakeCode(); bk.msg=""; bkRefresh("#bkCode"); break;
    case "bkCopy": bkCopy(); break;
    case "bkDownload": bkDownload(); break;
    case "bkCheck": { const inp=document.getElementById("bkInput"); bkTry(inp?inp.value:""); break; }
    case "bkConfirm": bkApply(); break;
    case "bkCancel": bk.pending=null; bk.msg=""; bkRefresh(); break;
    case "openNotes": notesDelKey=null; renderNotes(); break;
    case "noteEdit": renderNoteEdit(d.key); break;
    case "noteDel": notesDelKey=d.key; renderNotes(true); break;
    case "noteDelNo": notesDelKey=null; renderNotes(true); break;
    case "noteDelYes": noteDelete(d.key); notesDelKey=null; renderNotes(true); showToast("Not silindi."); break;
    case "notesToggle": npToggleCompact(); break;
    case "hwToggle": npTogglePad(); break;
    case "hwLang": npSetLang(d.lang); break;
    case "hwUndo": npUndoStroke(); break;
    case "hwClear": npClearPad(); break;
    case "hwNewline": npNewline(); break;
    case "hwConvert": npConvert(false); break;
    case "hwAlt": npPickAlt(+d.i); break;
    case "hwUndoInsert": npUndoInsert(); break;
    case "resetAll": if(confirm("Tüm ilerleme silinsin mi? Geri alınamaz.")){ const keepLang=state.lang||"en", keepSet=state.settings; state=defaultState(); state.settings=keepSet; setLanguage(keepLang,{skipSaveOld:true}); state.streak=0; saveState(); applySettings(); showToast("Sıfırlandı."); goHome(); } break;
  }
});
document.addEventListener("keydown",(e)=>{ if((e.key==="Enter"||e.key===" ") && e.target && e.target.matches && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); } });
document.addEventListener("input",(e)=>{ if(e.target && e.target.id==="dictSearch"){ dictState.q=e.target.value; updateDictList(); } });
document.addEventListener("change",(e)=>{ if(e.target && e.target.id==="bkFile") bkReadFile(e.target); });

/* ===== BAŞLAT ===== */
if(state.lang && !LANGS[state.lang]) state.lang=null;
try{ if(history.state && history.state.inner) history.replaceState(null,""); }catch(e){}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
if(state.lang){ setLanguage(state.lang, {skipSaveOld:true}); }
else { LEVELS=LANGS.en.levels; DICTIONARY_EXTRA=LANGS.en.dictExtra; indexCurriculum(); }
state.streak=computeStreak(); saveState();
applySettings();
try{ new MutationObserver(updateHeader).observe(app,{childList:true}); }catch(e){}
if(state.lang){ renderHome(); } else { renderLangPicker(); }
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
